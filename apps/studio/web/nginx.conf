# The studio-web image's whole configuration (#1909): nginx serving the built
# SPA and nothing else. Copied to /etc/nginx/conf.d/default.conf, so it is one
# server block inside the base image's own http context.
#
# It proxies NOTHING. Traefik is the single ingress and routes /rpc, /api, /ws,
# /storage, /healthz and /readyz to the api service and everything else here,
# so the browser sees one origin without this container knowing the API exists.
# A proxy_pass here would be a second, undocumented route to the API — one that
# would keep working, wrongly, after Traefik's routing table changed.

server {
    # IPv4 only, deliberately. The base image adds an IPv6 listener to its own
    # default.conf at start, but only after checking that the host has IPv6 —
    # a `listen [::]:80` written here would fail to bind, and take nginx down
    # with it, on a host that has IPv6 disabled.
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The client is text: HTML, JavaScript, CSS, JSON and SVG all compress
    # heavily, and the hashed bundles are the bulk of a cold load.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # Vite's hashed build output. The name IS the content, so a year is not a
    # guess: a changed file arrives under a different name, and a cached copy
    # of this one can never be wrong. `immutable` is what stops a reload
    # revalidating every chunk.
    # Deliberately without `always`, unlike the blocks below: a missing chunk
    # 404s here, and `always` would let a browser cache "this chunk does not
    # exist" for a year — which is the one answer that must not outlive the
    # deploy that produced it.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The shell names those hashed chunks, so a cached shell is a cached
    # deployment: it must be revalidated on every load, or an open tab keeps
    # asking for chunks the last deploy removed.
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    # Traefik's error page, served from this container so it does not depend on
    # the API it is standing in for. Deliberately short-lived rather than
    # immutable: it is shown during an upgrade, and a cached copy would outlast
    # the outage it describes.
    location = /maintenance.html {
        add_header Cache-Control "no-store" always;
    }

    # Everything else: a real file if there is one, and the shell otherwise, so
    # every client-side route deep-links. The hour is for the unhashed files in
    # public/ — favicons, the manifest — which keep their names across deploys
    # and so cannot be cached longer than a deploy interval.
    location / {
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri $uri/ /index.html;
    }
}

# Network Canvas Studio — the reference stack (#1909).
#
# This is the whole deployment. A self-hoster downloads two files — this one
# and `.env.example`, renamed to `.env` — creates the two secret files named
# below, and runs:
#
#   docker compose up -d
#   docker compose run --rm migrate
#
# Between those two commands `api` and `worker` are up but closed: there is no
# schema yet, so `api` answers every request with the maintenance page and its
# `/readyz` fails naming the reason, and `worker` runs no jobs. Both re-check
# the schema every few seconds and open on their own once `migrate` has run,
# with no restart. An upgrade passes through the same state.
#
# Read `migrate`'s output: besides creating the schema it prints the first-run
# setup token, which is what `/setup` takes to create the first owner account.
# It is printed once and only stored hashed, but it is never lost for good —
# re-running `migrate` while the instance still has no owner issues a fresh one
# (and an instance that has an owner issues none).
#
# The managed service runs this same file, with its own `.env` pointing the
# object-store variables at a managed bucket. There is no second topology and
# no orchestrator: splitting a service onto another host means changing one
# URL in the Traefik service block below and giving that host a private
# address.
#
# Requires Docker Engine 25.0 or newer with Compose v2.23.1 or newer — older
# versions cannot read the inline `configs: content:` blocks this file uses to
# keep the Traefik and Garage configuration in one downloadable file.
#
# ── The swappable elements ────────────────────────────────────────────────
#
# Three of the four are swapped from `.env` alone: `DATABASE_URL`, `REDIS_URL`
# and `S3_ENDPOINT` each default to the stack's own service, so setting one
# points Studio elsewhere without a line of this file changing. Deleting the
# service it replaced is then tidying, not part of the swap.
#
#   Database       set `DATABASE_URL`. The password stays in the
#                  `postgres-password` file secret — `DATABASE_PASSWORD_FILE`
#                  still names it, and a URL carrying one as well is refused —
#                  so put the managed instance's password there. Then delete
#                  the `postgres` service and the `postgres-data` volume.
#   Object store   set `S3_ENDPOINT` and the other four `S3_*` variables. Then
#                  delete the `garage` service, the `depends_on` entries
#                  naming it in `api`, `worker` and `migrate`, the
#                  `garage-config` config, and the `garage-data` volume.
#                  Or, for Azure Blob Storage, which does not speak S3: set
#                  `STUDIO_OBJECT_STORE=azure-blob`, the `AZURE_STORAGE_*`
#                  variables, and empty every `S3_*` value, `S3_ENDPOINT`
#                  included if a managed bucket set it (an empty access key
#                  also stops `S3_ENDPOINT` defaulting to Garage, and Garage
#                  creating a key and bucket — see below). The Garage tidying
#                  is then the same.
#   Rate limiting  set `REDIS_URL`; any Redis 7-compatible server works. The
#                  same server holds the rate-limit counters and carries the
#                  `studio:protocol-events` doorbell that tells every API
#                  replica a protocol has changed. Then delete the `valkey`
#                  service and the `depends_on` entries naming it.
#   Ingress        the one that is not a variable, because it is a routing
#                  table rather than an address: delete the `traefik` service,
#                  the `traefik-dynamic` and `traefik-api-servers` configs and
#                  the published ports, and reproduce that routing table in an
#                  institution's own proxy against `web` and `api`.
#
# ── Where the secrets live ────────────────────────────────────────────────
#
# Two Compose file secrets, mounted read-only under /run/secrets, so neither
# appears in `docker inspect`, in the process environment, or in a log:
#
#   secrets/postgres-password     the database password. Postgres reads it
#                                 through POSTGRES_PASSWORD_FILE; the server
#                                 reads it through DATABASE_PASSWORD_FILE and
#                                 inserts it into DATABASE_URL, which
#                                 therefore carries no password itself.
#   secrets/studio-secrets-key    the keyring every stored secret is
#                                 encrypted under (#1900). Back it up with the
#                                 database: a dump restored without it
#                                 recovers no secrets.
#
# Both are gitignored. `secrets/README.md` says how to generate them.

name: studio

# One environment for the three processes built from the studio-api image, so
# the API, the worker and the migrate one-shot cannot drift apart. `migrate`
# needs BETTER_AUTH_SECRET and PUBLIC_URL as well as the database, because it
# reads the same environment every other process does.
x-studio-env: &studio-env
  NODE_ENV: production
  PUBLIC_URL: https://${STUDIO_HOSTNAME}
  # These three name the swappable backing services, and each defaults to the
  # stack's own. Setting one in `.env` is the whole swap — nothing in this file
  # changes, though the service it replaces can then be deleted.
  #
  # No password in the database URL, deliberately: it is in the file secret
  # below, and a URL carrying one as well is refused at boot. That holds for a
  # managed Postgres too — put its password in the same file.
  DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER}@postgres:5432/${POSTGRES_DB}}
  REDIS_URL: ${REDIS_URL:-redis://valkey:6379}
  # The stack's own Garage is the default only while an S3 access key is
  # configured. An Azure Blob deployment empties the `S3_*` values in `.env`,
  # and then this is empty too: the server refuses any `S3_*` variable beside
  # `STUDIO_OBJECT_STORE=azure-blob`, so a default here would stop it booting.
  S3_ENDPOINT: ${S3_ENDPOINT:-${S3_ACCESS_KEY_ID:+http://garage:3900}}
  DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
  STUDIO_SECRETS_KEY_FILE: /run/secrets/studio_secrets_key
  S3_REGION: ${S3_REGION}
  S3_BUCKET: ${S3_BUCKET}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
  # `s3` reads the five above. `azure-blob` reads these instead: the
  # container, and either the account URL (a managed identity, optionally the
  # user-assigned one `AZURE_CLIENT_ID` names) or a connection string.
  STUDIO_OBJECT_STORE: ${STUDIO_OBJECT_STORE}
  AZURE_STORAGE_ACCOUNT_URL: ${AZURE_STORAGE_ACCOUNT_URL:-}
  AZURE_STORAGE_CONTAINER: ${AZURE_STORAGE_CONTAINER:-}
  AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING:-}
  AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
  SMTP_URL: ${SMTP_URL:-}
  EMAIL_FROM: ${EMAIL_FROM:-}
  # Traefik is the only thing that reaches the API, and it is on this network.
  TRUSTED_PROXIES: ${STACK_SUBNET}
  # Optional; unset means the provider is not offered on the sign-in screen.
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
  MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
  MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID:-}
  STUDIO_TELEMETRY: ${STUDIO_TELEMETRY:-}
  STUDIO_LOG_LEVEL: ${STUDIO_LOG_LEVEL:-}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}

x-studio-secrets: &studio-secrets
  - postgres_password
  - studio_secrets_key

services:
  # The only service with published ports. Its static configuration is the
  # command flags; its routing table is the `traefik-dynamic` config below,
  # read through the file provider from one directory: the routes in
  # `traefik-dynamic`, and the list of `api` servers in `traefik-api-servers`.
  # The list is its own file so that running more than one `api` is a change to
  # that file alone (docs/self-host/run.md). It is given no Docker socket: the
  # routing is fixed, and a container-discovery provider would let any
  # container on this network publish a route by setting a label.
  traefik:
    image: traefik:v3.6@sha256:31267173a15b4944e797a76ffd9c419707c8d8b32fe5b610f80cd0cfa05f372d
    restart: unless-stopped
    command:
      - --entryPoints.web.address=:80
      - --entryPoints.web.http.redirections.entryPoint.to=websecure
      - --entryPoints.web.http.redirections.entryPoint.scheme=https
      - --entryPoints.websecure.address=:443
      # HTTP-01, so the stack needs no DNS credentials — only that
      # STUDIO_HOSTNAME resolves to this host and port 80 is reachable. The
      # challenge is answered on the `web` entrypoint ahead of the redirection
      # above.
      - --certificatesResolvers.le.acme.email=${ACME_EMAIL}
      - --certificatesResolvers.le.acme.storage=/acme/acme.json
      - --certificatesResolvers.le.acme.httpChallenge.entryPoint=web
      - --providers.file.directory=/etc/traefik/dynamic
      # No dashboard and no API: this instance routes one hostname and has
      # nothing an operator needs to inspect over HTTP.
      - --api=false
      - --global.checkNewVersion=false
      - --global.sendAnonymousUsage=false
      - --log.level=INFO
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - traefik-acme:/acme
    configs:
      - source: traefik-dynamic
        target: /etc/traefik/dynamic/routing.yml
      - source: traefik-api-servers
        target: /etc/traefik/dynamic/api-servers.yml
    depends_on:
      - web
      - api

  # nginx and the built client. It proxies nothing and needs no environment:
  # Traefik routes the API's paths past it, so the browser sees one origin.
  web:
    image: ${STUDIO_WEB_IMAGE}
    restart: unless-stopped

  api:
    image: ${STUDIO_API_IMAGE}
    restart: unless-stopped
    command: [serve]
    # The server's own shutdown takes up to 15s — open WebSockets get 5s to
    # close, then accepted requests 10s to finish — and the upgrade's backup
    # relies on it finishing. Docker's 10s default would SIGKILL it partway.
    stop_grace_period: 20s
    environment: *studio-env
    secrets: *studio-secrets
    # Liveness, not readiness: it consults nothing, so the container runtime
    # does not restart a healthy process because Postgres is down.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      # Healthy means bootstrapped: Garage creates its layout, key and bucket
      # before it starts serving, so a healthy Garage has the bucket.
      garage:
        condition: service_healthy

  # The same image, the same environment, a different command. It routes no
  # traffic and publishes no port; its health listener binds 127.0.0.1 inside
  # the container and exists only for the check below.
  worker:
    image: ${STUDIO_API_IMAGE}
    restart: unless-stopped
    command: [worker]
    # The documented drain takes 25-30s; Docker's 10s default would SIGKILL it.
    stop_grace_period: 40s
    environment: *studio-env
    secrets: *studio-secrets
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/readyz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      garage:
        condition: service_healthy

  # Rate-limit counters (#1909), and the `studio:protocol-events` doorbell the
  # API replicas ring each other on when a protocol changes. Nothing here is
  # kept: persistence is off on purpose, because a counter that survives a
  # restart outlives the abuse it was measuring, and a doorbell message is
  # only a nudge. The limiter fails open when Valkey is unreachable, and the
  # replicas fall back to checking the database every five seconds.
  valkey:
    image: valkey/valkey:8.1-alpine@sha256:d2e18f3410b6f616de1417f570fa55261af2898b9c5b2cfb6781ce2373ea43d1
    restart: unless-stopped
    command: ['valkey-server', '--save', '', '--appendonly', 'no']
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      # The postgres:18 image moved PGDATA below /var/lib/postgresql, so the
      # parent is the image's supported persistence path.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10

  # Single-node Garage: the S3-compatible store asset bytes live in. It
  # publishes no port — only the Studio processes reach it, over this network.
  #
  # It bootstraps itself, idempotently, on every start: `--single-node`
  # applies a one-node layout the first time, and `--default-bucket` imports
  # the access key below and creates the bucket with read, write and owner on
  # it. A volume an earlier release bootstrapped through its admin API is
  # already in that state and is left as it is. A key whose secret has since
  # changed in `.env` is refused, by name, rather than kept silently.
  #
  # The flag is interpolated so that an empty `S3_ACCESS_KEY_ID` drops it: an
  # Azure Blob deployment empties the `S3_*` values, and Garage then runs
  # holding nothing until the service is deleted. A string rather than a list
  # because Compose splits it into arguments itself — there is no shell in the
  # image — and an empty substitution leaves no empty argument behind.
  garage:
    image: dxflrs/garage:v2.4.1@sha256:9c96caa2612d3411acc5b0e6701fb238dbfba33e533a6d7d3d811a4b12d0d020
    restart: unless-stopped
    command: /garage server --single-node ${S3_ACCESS_KEY_ID:+--default-bucket}
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: ${S3_ACCESS_KEY_ID}
      GARAGE_DEFAULT_SECRET_KEY: ${S3_SECRET_ACCESS_KEY}
      GARAGE_DEFAULT_BUCKET: ${S3_BUCKET}
    volumes:
      - garage-data:/var/lib/garage
    configs:
      - source: garage-config
        target: /etc/garage.toml
        # Garage refuses a configuration file that carries secrets and is
        # readable by anyone but its owner. Compose's default for a config is
        # 0444, which that check rejects.
        mode: 0400
    # The image has no shell, but the check is Garage's own binary: it asks
    # the node over RPC and fails while the cluster is unavailable.
    healthcheck:
      test: ['CMD', '/garage', 'health', '--quiet']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # `docker compose run --rm migrate`. Applies, in one transaction, every
  # migration this image carries that the database has not recorded: all of
  # them to an empty database, none to a current one. It refuses, changing
  # nothing, a database a newer release migrated, one whose recorded history
  # differs from the image's, or one with Studio's tables and no history; the
  # message names the remedy. The upgrade sequence is
  # docs/self-host/upgrade.md. On an instance that still has no owner it also prints the
  # first-run setup token, so its output is worth reading rather than only its
  # exit code. It waits for Garage, which bootstraps itself, so a first run is
  # one command.
  migrate:
    image: ${STUDIO_API_IMAGE}
    profiles: [migrate]
    command: [migrate]
    environment: *studio-env
    secrets: *studio-secrets
    depends_on:
      postgres:
        condition: service_healthy
      garage:
        condition: service_healthy

configs:
  # Traefik's routing table. Inline so a self-hoster downloads two files
  # rather than three.
  traefik-dynamic:
    content: |
      http:
        routers:
          # Highest priority and NO middleware, deliberately: the deploy
          # script and the container runtime must always read the real status
          # and the named failing check. Put the maintenance page in front of
          # these and an upgrade would report a healthy API that is not there.
          health:
            rule: "Host(`${STUDIO_HOSTNAME}`) && (Path(`/healthz`) || Path(`/readyz`))"
            service: api
            priority: 1000
            entryPoints: [websecure]
            tls:
              certResolver: le

          # Everything the server answers. `/ws` is a Path rather than a
          # PathPrefix because it is one endpoint, and Traefik proxies the
          # WebSocket upgrade with no further configuration.
          api:
            rule: "Host(`${STUDIO_HOSTNAME}`) && (PathPrefix(`/rpc`) || PathPrefix(`/api`) || PathPrefix(`/storage`) || Path(`/ws`))"
            service: api
            priority: 100
            middlewares: [maintenance]
            entryPoints: [websecure]
            tls:
              certResolver: le

          # Every page path, including `/`. The client is a single-page app,
          # so nginx serves its shell for routes that are not files.
          web:
            rule: "Host(`${STUDIO_HOSTNAME}`)"
            service: web
            priority: 10
            entryPoints: [websecure]
            tls:
              certResolver: le

        middlewares:
          # While the API container is being replaced it answers nothing, and
          # Traefik's own 502 is a blank page. This serves the static
          # maintenance page from the web container instead — which depends on
          # nothing that is being upgraded — for the seconds the window lasts.
          maintenance:
            errors:
              status: ["502-503"]
              service: web
              query: /maintenance.html
              # A stopped API container is a connection error, which Traefik
              # reports as 502. "Bad gateway" is not what is happening — the
              # instance is temporarily unavailable — and 503 is also what the
              # API itself answers while it is closed: maintenance mode, a
              # migration holding the lock, a schema that is not this build's,
              # or a boot whose checks have not finished (#1901). A client and a
              # monitor see one status for the whole window however it started.
              statusRewrites:
                "502-503": 503

        services:
          web:
            loadBalancer:
              servers:
                - url: "http://web:80"

  # The `api` service Traefik balances across, apart from the routes so that a
  # second replica is a one-file change. One `url` per replica, each named for
  # its Compose service; `docs/self-host/run.md` shows the edit, and adds the
  # health check that takes a stopped replica out of rotation. One replica
  # needs no health check: with nowhere else to send a request, taking it out
  # would only turn a slow answer into the maintenance page.
  traefik-api-servers:
    content: |
      http:
        services:
          api:
            loadBalancer:
              servers:
                - url: "http://api:3000"

  garage-config:
    content: |
      # One node, one copy of every object. Durability on a single-host
      # deployment comes from the volume and the backups, not from Garage.
      replication_factor = 1

      metadata_dir = "/var/lib/garage/meta"
      data_dir = "/var/lib/garage/data"

      # The node-to-node port. Required even with one node, and never
      # published: nothing outside this network speaks Garage's RPC.
      rpc_bind_addr = "[::]:3901"
      # Shared between nodes in a multi-node cluster; with one node it is
      # still required, and still a secret.
      rpc_secret = "${GARAGE_RPC_SECRET}"

      [s3_api]
      api_bind_addr = "[::]:3900"
      s3_region = "${S3_REGION}"

secrets:
  postgres_password:
    file: ./secrets/postgres-password
  studio_secrets_key:
    file: ./secrets/studio-secrets-key

volumes:
  traefik-acme:
  postgres-data:
  garage-data:

networks:
  # Named so TRUSTED_PROXIES can say which addresses may set X-Forwarded-For:
  # Traefik is the only thing that reaches the API, and it is on this subnet.
  default:
    ipam:
      config:
        - subnet: ${STACK_SUBNET}

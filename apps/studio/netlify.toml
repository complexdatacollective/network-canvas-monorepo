# Netlify deployment for Studio: the client SPA on the CDN and the server as a
# Netlify Function, on ONE site. Two sites would not work — the client calls
# /rpc and /api as relative paths, and src/auth/csrf.ts refuses cross-origin
# mutations, so the single-origin invariant (#1245) is a hard requirement.
#
# This is NOT the deployment topology decided in #1245/#1247. It exists to get
# branch previews and a public URL; /ws is unserved here (Netlify cannot hold
# persistent connections), and scheduled work has nowhere to run.
#
# Auth is therefore off here: PUBLIC_URL has to match the origin the browser
# used, and a deploy preview's origin is per-PR. Netlify cannot supply it —
# this file does not interpolate variables, and DEPLOY_PRIME_URL is a
# build-only variable that functions cannot read at runtime (only URL,
# SITE_NAME, and SITE_ID reach them). So setting DATABASE_URL on this site
# would give previews a production-origin PUBLIC_URL, whose cookies and
# magic-link URLs point at the wrong host and whose CSRF check refuses the
# preview's own requests. Deriving the origin from the request is the way in,
# and belongs with the real topology work.
#
# This site is the managed topology, so it wants STUDIO_DEPLOYMENT_MODE=managed
# — and that has to be set as a SITE environment variable (`netlify env:set`,
# or the UI), never in [build.environment] below, which configures the build
# and cannot reach the function at runtime. src/netlify.ts reads it inside the
# running function, the same as src/index.ts does.
#
# The gate that variable drives (src/client-assets.ts) does not run on this
# lane at all: the client is served by the CDN, and src/netlify.ts's
# `config.path` claims only /api, /rpc, /storage and /healthz, so no function
# is invoked for a page path and the function-level refusal is unreachable.
# The mode still reaches the client here, over the `status` procedure.
#
# What the CDN can answer without a function is a redirect rule carrying a 404
# status, and that is how a topology-gated path is refused on this lane — see
# the /setup rule below. It is a hand-written copy of a classification that
# lives in code (@codaco/studio-rpc's surfaces module), so
# server/src/__tests__/deployment-mode.test.ts fails when the two disagree.
#
# That rule is matched literally, and literal matching is not the whole
# refusal: TanStack Router resolves /Setup and //setup to the same route, and
# only the Node lane normalises a path before matching it (`normaliseForGate`).
# Nothing in this file can express that, and no status line withholds a screen
# on its own — the SPA boots from the body either way. Refusing every spelling,
# and rendering a not-found instead of the gated route, is the client's own
# topology guard; this rule is the honest status line underneath it.

[build]
command = "pnpm exec turbo run build --filter=@codaco/studio-client && pnpm --filter @codaco/studio-server build:netlify"
publish = "apps/studio/client/dist"
functions = "apps/studio/netlify/functions"

[build.environment]
NODE_OPTIONS = "--max-old-space-size=4096"

[context.deploy-preview]
ignore = "cd \"$(git rev-parse --show-toplevel)\" && if test -n \"$CACHED_COMMIT_REF\" && test \"$CACHED_COMMIT_REF\" != \"$COMMIT_REF\" && git diff --quiet \"$CACHED_COMMIT_REF\" \"$COMMIT_REF\" -- apps/studio/netlify.toml package.json pnpm-lock.yaml pnpm-workspace.yaml && npx --yes turbo@2.10.4 query affected --packages @codaco/studio-client @codaco/studio-server --base \"$CACHED_COMMIT_REF\" --head \"$COMMIT_REF\" --exit-code; then true; else false; fi"

# /setup configures a whole instance on first run, and this site is the managed
# topology — so it is one of the paths this deployment does not have. Ahead of
# the catch-all below, because Netlify applies the first rule that matches.
# `force` so the refusal does not depend on whether a file happens to sit at
# that path. index.html at a 404 is the same answer the Node lane's gate gives.
[[redirects]]
from = "/setup"
to = "/index.html"
status = 404
force = true

# SPA fallback so client-side routes deep-link. Unforced, so it cannot shadow a
# real asset. Function paths are claimed declaratively by src/netlify.ts's
# `config.path` and are matched first.
[[redirects]]
from = "/*"
to = "/index.html"
status = 200

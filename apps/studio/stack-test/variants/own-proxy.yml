# The ingress swap (#1909): docs/self-host/swap.md, "The ingress".
#
# The one swap that is not a variable, because Traefik holds a routing table
# rather than an address. Traefik is disabled and its ports are gone; in its
# place is an nginx carrying the guide's own configuration block, extracted
# from docs/self-host/swap.md by `up.sh` at run time and written to
# .work/nginx.conf. A copy of that block in this repository would drift from
# the one an institution pastes, and then this variant would be testing the
# copy.
#
# The proxy is on the stack's own network, which is what makes `api` and `web`
# resolvable by service name — the guide says as much — and what puts it inside
# TRUSTED_PROXIES, which is STACK_SUBNET and is unchanged.

services:
  # "Delete the `traefik` service … and the published ports."
  traefik:
    profiles: [unused]
    # A merging override would keep 80 and 443 published by a service that is
    # then never started; `!reset` is how a sequence is emptied rather than
    # appended to.
    ports: !reset []

  own-proxy:
    image: nginx:1.29-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
    restart: unless-stopped
    volumes:
      # nginx's conf.d is included inside its `http` block, which is the
      # context the guide's `upstream` and `server` blocks belong in. Replacing
      # default.conf rather than adding beside it: the image's own file claims
      # `localhost` on port 80.
      - ./stack-test/.work/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Mounted at the two paths the guide's `ssl_certificate` lines name, so
      # those lines are tested exactly as written rather than substituted.
      - ./stack-test/.work/tls:/etc/nginx/tls:ro
    ports:
      # Not 443: this is a second ingress on a host where a reference-variant
      # stack may still be holding the real one, and a clash would read as a
      # routing failure rather than as the port conflict it is.
      - '127.0.0.1:8443:443'
    networks:
      # Both: `api` and `web` are on the stack's network, and the client below
      # is on the other one — where a real client is, since TRUSTED_PROXIES is
      # the stack subnet and a client must not be inside it.
      - default
      - external
    depends_on:
      - web
      - api

  # A client that is NOT a trusted proxy, for the one assertion that cannot be
  # made from the host: what address the API ends up recording for a request.
  # Reached through the published port, the host arrives as the stack network's
  # own gateway — inside TRUSTED_PROXIES, so the API correctly declines to
  # treat it as a client address and records none. A container out here has an
  # address the ingress can forward and Studio will believe, which is the shape
  # every real request has.
  own-proxy-client:
    image: curlimages/curl:8.16.0@sha256:463eaf6072688fe96ac64fa623fe73e1dbe25d8ad6c34404a669ad3ce1f104b6
    entrypoint: ['sleep', 'infinity']
    restart: unless-stopped
    networks:
      - external

networks:
  external:
    name: ${EXTERNAL_NETWORK}
    ipam:
      config:
        - subnet: ${EXTERNAL_SUBNET}

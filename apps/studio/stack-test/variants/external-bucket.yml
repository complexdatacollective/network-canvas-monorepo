# The object-store swap (#1909): docs/self-host/swap.md, "A managed bucket".
#
# A second Garage — the same image and digest as the stack's — stands in for a
# managed bucket, on a network of its own with its own credentials, its own
# region and its own RPC secret. The five `S3_*` variables in the environment
# file `up.sh` writes are the whole swap; everything below is the tidying the
# guide describes as following it.
#
# The stub bootstraps itself with the SAME flags and environment keys the
# stack's `garage` service starts with — `--single-node --default-bucket` and
# the three `GARAGE_DEFAULT_*` values, fed from the `S3_*` the swap names — so
# the store Studio is pointed at is created the way a deployment's own is,
# with no second bootstrap to keep in step. The flag is not interpolated here
# as it is there: this variant always names an access key.

services:
  external-garage:
    image: dxflrs/garage:v2.4.1@sha256:9c96caa2612d3411acc5b0e6701fb238dbfba33e533a6d7d3d811a4b12d0d020
    restart: unless-stopped
    command: /garage server --single-node --default-bucket
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: ${S3_ACCESS_KEY_ID}
      GARAGE_DEFAULT_SECRET_KEY: ${S3_SECRET_ACCESS_KEY}
      GARAGE_DEFAULT_BUCKET: ${S3_BUCKET}
    # A volume for the same reason the stack's Garage has one: the image is
    # built FROM scratch and carries no /var/lib/garage for Garage to write
    # its metadata and data directories into.
    volumes:
      - external-garage-data:/var/lib/garage
    configs:
      - source: external-garage-config
        target: /etc/garage.toml
        # Garage refuses a configuration file carrying secrets that is readable
        # by anyone but its owner, and Compose's default for a config is 0444.
        mode: 0400
    # The stack's own check, unchanged. Garage creates its layout, the key and
    # the bucket before it starts serving, so a healthy stub holds the bucket.
    healthcheck:
      test: ['CMD', '/garage', 'health', '--quiet']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - external

  # "Then delete the `garage` service…" — a profile no command enables, which
  # `assert.sh` holds by asserting the container does not exist.
  garage:
    profiles: [unused]

  api:
    # The base file's `garage: service_healthy` entry would survive a merging
    # override and then fail the command, because no profile enables it.
    depends_on: !override
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    networks:
      - default
      - external

  worker:
    depends_on: !override
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    networks:
      - default
      - external

  # "…and the `depends_on` entries naming it". `migrate`'s is replaced by one
  # on the stub: a managed bucket exists before Studio is pointed at it, and a
  # healthy stub is one that has created it.
  migrate:
    depends_on: !override
      postgres:
        condition: service_healthy
      external-garage:
        condition: service_healthy
    networks:
      - default
      - external

configs:
  external-garage-config:
    content: |
      replication_factor = 1

      metadata_dir = "/var/lib/garage/meta"
      data_dir = "/var/lib/garage/data"

      rpc_bind_addr = "[::]:3901"
      rpc_secret = "${EXTERNAL_GARAGE_RPC_SECRET}"

      [s3_api]
      api_bind_addr = "[::]:3900"
      # Not the stack Garage's region. Studio signs for whatever S3_REGION
      # names, so a request still being signed for the stack's own store would
      # be refused here rather than pass by coincidence.
      s3_region = "${S3_REGION}"

volumes:
  external-garage-data:

networks:
  external:
    name: ${EXTERNAL_NETWORK}
    ipam:
      config:
        - subnet: ${EXTERNAL_SUBNET}

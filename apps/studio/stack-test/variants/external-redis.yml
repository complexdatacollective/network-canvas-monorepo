# The rate-limit store swap (#1909, #1916): docs/self-host/swap.md, "An
# external Redis".
#
# A second Valkey — the same image and digest as the stack's — stands in for an
# institution's own Redis, on a network of its own. `REDIS_URL` in the
# environment file `up.sh` writes is the whole swap; everything below is the
# tidying the guide describes as following it.
#
# `api` and `worker` are both attached to the stub's network, and both need to
# be: the API consumes the limiter's counters, and the worker's
# `denied-attempts-summary` job reads what was refused out of the same store.
# `migrate` is deliberately NOT attached — it reads REDIS_URL like every other
# process built from that image, but it opens no connection, and a swap that
# quietly needed one more service to reach the institution's Redis would be
# worth knowing about rather than papering over.

services:
  external-valkey:
    image: valkey/valkey:8.1-alpine@sha256:d2e18f3410b6f616de1417f570fa55261af2898b9c5b2cfb6781ce2373ea43d1
    restart: unless-stopped
    # The same command the stack's own runs: persistence off, because a counter
    # that survives a restart is a counter that outlives the abuse it was
    # measuring. A managed Redis would have its own policy; what the swap has
    # to meet is that the limiter's scripts run against it, which is what
    # `assert.sh` proves.
    command: ['valkey-server', '--save', '', '--appendonly', 'no']
    networks:
      - external
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  # "Then delete the `valkey` service and the `depends_on` entries naming it."
  # A profile no command enables is the closest an override can get to deleting
  # a service, and it is testable: `assert.sh` holds that the container does not
  # exist.
  valkey:
    profiles: [unused]

  # `!override` rather than an addition: Compose MERGES a `depends_on` mapping,
  # so the base file's entry for `valkey` would survive an override that only
  # named the others — and a dependency on a service no profile enables fails
  # the whole command.
  api:
    depends_on: !override
      postgres:
        condition: service_healthy
      garage:
        condition: service_started
      external-valkey:
        condition: service_healthy
    networks:
      - default
      - external

  worker:
    depends_on: !override
      postgres:
        condition: service_healthy
      garage:
        condition: service_started
      external-valkey:
        condition: service_healthy
    networks:
      - default
      - external

networks:
  external:
    name: ${EXTERNAL_NETWORK}
    ipam:
      config:
        - subnet: ${EXTERNAL_SUBNET}

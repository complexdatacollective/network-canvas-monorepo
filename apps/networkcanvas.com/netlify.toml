[build]
command = "pnpm exec turbo run build --filter=networkcanvas.com"
publish = "apps/networkcanvas.com/out"
edge_functions = "apps/networkcanvas.com/netlify/edge-functions"

[build.environment]
NETLIFY_NEXT_PLUGIN_SKIP = "true"
NODE_OPTIONS = "--max-old-space-size=4096"

[functions]
deno_import_map = "apps/networkcanvas.com/netlify/import-map.json"

# The gallery is served from its own domain alias of this site. Its exported
# routes stay in the publish directory as the rewrite target, so a plain
# redirect would lose to the real file — these have to be forced. Only the
# localized paths need rules: the edge function localizes everything else first.
[[redirects]]
from = "https://networkcanvas.com/:locale/protocol-gallery/*"
to = "https://protocolgallery.networkcanvas.com/:locale/:splat"
status = 301
force = true

[[redirects]]
from = "https://networkcanvas.com/:locale/protocol-gallery"
to = "https://protocolgallery.networkcanvas.com/:locale/"
status = 301
force = true

[context.deploy-preview]
ignore = "bash \"$(git rev-parse --show-toplevel)/scripts/ci/netlify-ignore-deploy-preview.sh\" --config apps/networkcanvas.com/netlify.toml -- @codaco/documentation networkcanvas.com"

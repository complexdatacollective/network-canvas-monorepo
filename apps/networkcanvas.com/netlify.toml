[build]
command = "pnpm exec turbo run build --filter=networkcanvas.com"
publish = "apps/networkcanvas.com/out"
edge_functions = "apps/networkcanvas.com/netlify/edge-functions"

[build.environment]
NETLIFY_NEXT_PLUGIN_SKIP = "true"
NODE_OPTIONS = "--max-old-space-size=4096"

[functions]
deno_import_map = "apps/networkcanvas.com/netlify/import-map.json"

[context.deploy-preview]
ignore = "cd \"$(git rev-parse --show-toplevel)\" && if test -n \"$CACHED_COMMIT_REF\" && test \"$CACHED_COMMIT_REF\" != \"$COMMIT_REF\" && git diff --quiet \"$CACHED_COMMIT_REF\" \"$COMMIT_REF\" -- package.json pnpm-lock.yaml pnpm-workspace.yaml && npx --yes turbo@2.10.4 query affected --packages @codaco/documentation networkcanvas.com --base \"$CACHED_COMMIT_REF\" --head \"$COMMIT_REF\" --exit-code; then true; else false; fi"

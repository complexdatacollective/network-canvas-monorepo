# Paths are relative to the repository root, the site's base directory.
[build]
command = "pnpm exec turbo run build --filter=@codaco/sketch && pnpm --filter @codaco/sketch bundle-functions"
publish = "apps/sketch/dist"

[build.environment]
NODE_OPTIONS = "--max-old-space-size=4096"

# `netlify dev` must serve the page on http://localhost:5186, the only Sketch
# origin a development build of Architect accepts (sketchOrigins.ts). Vite
# moves to an inner port so the two do not collide.
[dev]
framework = "#custom"
command = "pnpm --filter @codaco/sketch exec sh -c 'node scripts/bundle-functions.mjs --watch & exec vite --port 5187 --strictPort'"
targetPort = 5187
port = 5186
# Serve the deploy bundle, which the command above rebuilds on every change:
# only it can load the Markdown prompts (scripts/bundle-functions.mjs).
functions = "apps/sketch/netlify/.bundled"

# Deployed functions are pre-bundled by scripts/bundle-functions.mjs (see
# there for why), so Netlify ships each file as it is: tracing the bundle
# would follow a process.cwd() call in it and pull in the whole repository.
[functions]
directory = "apps/sketch/netlify/.bundled"
node_bundler = "none"

[context.deploy-preview]
ignore = "bash \"$(git rev-parse --show-toplevel)/scripts/ci/netlify-ignore-deploy-preview.sh\" --config apps/sketch/netlify.toml --tasks build -- @codaco/sketch"

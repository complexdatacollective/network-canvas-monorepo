[build]
# scripts/release/write-build-info.mjs stamps dist/build-info.json with the
# deployed commit
# AFTER the turbo-cached build: baked into the build it would survive cache
# restoration and describe whichever commit originally built the artifact.
command = "pnpm exec turbo run build --filter=@codaco/architect && node scripts/release/write-build-info.mjs apps/architect/dist"
publish = "apps/architect/dist"

[build.environment]
NODE_OPTIONS = "--max-old-space-size=4096"

[context.deploy-preview]
ignore = "bash \"$(git rev-parse --show-toplevel)/scripts/ci/netlify-ignore-deploy-preview.sh\" --config apps/architect/netlify.toml --tasks build -- @codaco/architect"

# Trust Sketch's own deploy previews and branch deploys (see
# src/config/sketchOrigins.ts) only in Architect's non-production deploys, so
# a preview-to-preview handoff works without production trusting code from an
# arbitrary pull request.
[context.deploy-preview.environment]
VITE_ALLOW_SKETCH_PREVIEWS = "true"

[context.branch-deploy.environment]
VITE_ALLOW_SKETCH_PREVIEWS = "true"

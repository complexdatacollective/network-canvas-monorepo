[build]
publish = ".next"
command = "pnpm build:platform"
ignore = "bash scripts/netlify-should-build.sh"

# Turbopack runs webpack loaders (Fresco's i18n loader) in pools of Node.js
# processes, one pool per module context, each allowed as many processes as
# the machine has CPUs. On Netlify's build machines (about six CPUs) those
# pools, ~120 MB a process, pushed the compile past the memory limit and the
# build was killed (exit 137). This variable is Turbopack's override for the
# CPU count it plans with; two keeps the peak well clear of the limit at the
# cost of a somewhat longer compile.
[build.environment]
TURBO_TASKS_AVAILABLE_PARALLELISM = "2"

# Branch deploys and deploy previews never see the production database: the
# site sets DATABASE_URL and DATABASE_URL_UNPOOLED for production alone. A pull
# request's preview gets a Neon branch of its base's database
# (.github/workflows/fresco-preview-database.yml), and `build:preview` migrates
# that database only when PREVIEW_DATABASE_BRANCH says it is the preview's own.
[context.branch-deploy]
command = "pnpm build:preview"

[context.deploy-preview]
command = "pnpm build:preview"
ignore = "bash scripts/netlify-should-build.sh || bash \"$(git rev-parse --show-toplevel)/scripts/ci/netlify-ignore-deploy-preview.sh\" --config apps/fresco/netlify.toml --tasks build -- fresco"

# Local release-testing stack: Fresco (any image: the released GHCR image or
# the locally built pending image) + PostgreSQL + Garage, on plain localhost
# ports — no Traefik/TLS, unlike the production compose files this mirrors
# (docker-compose.prod.yml). Storage is deliberately NOT env-pinned: real
# deployments enter the S3 endpoint/public URL in the setup wizard, and the
# release test verifies that path.
#
# Driven by up.sh / down.sh with a compose project name per lane, so every
# lane runs side by side. Interpolated variables: FRESCO_IMAGE, FRESCO_PORT,
# POSTGRES_PORT, STORAGE_PORT, SINK_HTTPS_PORT, SINK_HTTP_PORT, the Garage
# secrets (GARAGE_ACCESS_KEY_ID, GARAGE_SECRET_ACCESS_KEY, GARAGE_RPC_SECRET,
# GARAGE_ADMIN_TOKEN: fixed test values that up.sh exports), and the
# per-lane deployment switches below — FRESCO_DISABLE_ANALYTICS,
# FRESCO_REQUIRE_TWO_FACTOR, FRESCO_NODE_TLS_REJECT_UNAUTHORIZED,
# FRESCO_AWS_REQUEST_CHECKSUM_CALCULATION, RELAY_SINK_SCRIPT. up.sh sets all of them; the defaults here are the
# disabled-analytics, no-two-factor deployment the first two lanes test, so a
# compose invocation that forgets one is the safe configuration rather than a
# quietly weakened one.
#
# Named volumes let the upgrade lane swap the fresco image against live data
# (the swap runs the new image's migrate-and-start.sh); `down -v` removes them
# so every run starts from the unconfigured setup wizard.
#
# relay-sink is aliased onto the PostHog relay's hostname for every container
# on this network, so server-side analytics egress from the app container is
# observed rather than leaving the box. See release-test/scripts/relay-sink.mjs
# and the release gate in .claude/workflows/fresco-release-test.js.

services:
  fresco:
    image: ${FRESCO_IMAGE:?Set FRESCO_IMAGE (released or pending image ref)}
    depends_on:
      postgres:
        condition: service_healthy
      garage-init:
        condition: service_completed_successfully
      # Started AND listening before the app is, so a server-side analytics
      # request can never be refused rather than recorded.
      relay-sink:
        condition: service_healthy
    ports:
      - '${FRESCO_PORT:-3210}:3000'
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/postgres
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@postgres:5432/postgres
      PUBLIC_URL: http://localhost:${FRESCO_PORT:-3210}
      # Stops server-side capture, and stops the browser reaching off-box at
      # all: posthog-js is loaded only once the server has confirmed analytics
      # are on, so a stack that sets this contacts nothing but localhost. The
      # lanes that set it report the hosts their tab reached and the workflow
      # fails the run on any that is not this deployment. Default 'true'. The analytics lane is the one deployment that sets
      # this to false: its whole purpose is to read what an ENABLED deployment
      # sends, which no disabled stack can show.
      DISABLE_ANALYTICS: ${FRESCO_DISABLE_ANALYTICS:-true}
      # Default unset (the variable is optional in env.js). The two-factor lane
      # sets it to true to test mandatory enrolment.
      REQUIRE_TWO_FACTOR: ${FRESCO_REQUIRE_TWO_FACTOR:-false}
      # Default 1 — certificate validation on, as it ships. The analytics lane
      # sets 0, and ONLY that lane: its sink terminates TLS with a certificate
      # minted for this run, so the container would otherwise refuse to talk to
      # it and the payloads the lane exists to inspect would never be sent.
      # It changes whether the container VERIFIES the relay, never what it
      # sends — which is what that lane asserts on — and no lane that asserts
      # silence sets it.
      NODE_TLS_REJECT_UNAUTHORIZED: ${FRESCO_NODE_TLS_REJECT_UNAUTHORIZED:-1}
      # The SDK's own default unless up.sh says otherwise. Only the upgrade
      # lane's released baseline overrides it: see up.sh.
      AWS_REQUEST_CHECKSUM_CALCULATION: ${FRESCO_AWS_REQUEST_CHECKSUM_CALCULATION:-WHEN_SUPPORTED}
      COOKIE_SECURE: 'false'
      # Next standalone binds to $HOSTNAME (default: container id -> NIC IP),
      # which would make the 127.0.0.1 healthcheck below unreachable.
      HOSTNAME: 0.0.0.0
    healthcheck:
      test:
        ['CMD', 'wget', '-qO', '/dev/null', 'http://127.0.0.1:3000/api/health']
      interval: 5s
      timeout: 10s
      retries: 10
      # First boot runs prisma generate + migrations before the server starts.
      start_period: 120s

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '${POSTGRES_PORT:-5533}:5432'
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres']
      interval: 5s
      timeout: 10s
      retries: 5

  # The bundled Garage of docker-compose.prod.yml. Compose cannot `extends`
  # a service whose configs live in another file, so the image, the init
  # container and both configs below are copies — and
  # scripts/release-test/fresco-release-test-storage.test.mjs fails if any of
  # them drifts from the production file. What differs is only what a
  # localhost stack needs instead of Traefik: the S3 port is published, and
  # browsers on the app's origin are granted CORS on the bucket.
  garage:
    image: dxflrs/garage:v2.1.0@sha256:4c9b34c113e61358466e83fd6e7d66e6d18657ede14b776eb78a93ee8da7cf6a
    volumes:
      - garage-data:/var/lib/garage
    configs:
      - source: garage-config
        target: /etc/garage.toml
        mode: 0400
    # Browsers on the host PUT and GET directly through presigned URLs signed
    # for this published port (the wizard's Public URL).
    ports:
      - '${STORAGE_PORT:-9310}:3900'

  garage-init:
    image: curlimages/curl:8.16.0@sha256:463eaf6072688fe96ac64fa623fe73e1dbe25d8ad6c34404a669ad3ce1f104b6
    entrypoint: ['/bin/sh', '/garage-init.sh']
    environment:
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?Set GARAGE_ADMIN_TOKEN (up.sh exports it)}
      GARAGE_ACCESS_KEY_ID: ${GARAGE_ACCESS_KEY_ID:?Set GARAGE_ACCESS_KEY_ID (up.sh exports it)}
      GARAGE_SECRET_ACCESS_KEY: ${GARAGE_SECRET_ACCESS_KEY:?Set GARAGE_SECRET_ACCESS_KEY (up.sh exports it)}
      # The app is served from localhost:FRESCO_PORT and storage from
      # localhost:STORAGE_PORT, so the browser's presigned requests are
      # cross-origin — the case the production file leaves this unset for
      # because Traefik serves both on one origin.
      GARAGE_CORS_ORIGIN: http://localhost:${FRESCO_PORT:-3210}
    configs:
      - source: garage-init
        target: /garage-init.sh
    depends_on:
      garage:
        condition: service_started

  # Stands in for https://ph-relay.networkcanvas.com (`@codaco/shared-consts`
  # POSTHOG_HOST) inside this network, via the alias below: Docker's embedded
  # DNS answers that name with this container for everything on the network, so
  # posthog-node in the app container would connect here instead of off-box.
  # It records connection attempts and never terminates TLS — see
  # scripts/relay-sink.mjs for why, and scripts/relay-sink-check.mjs for the
  # probe that proves it was watching.
  #
  # No restart policy on purpose: a sink that died mid-run must stay dead, so
  # the closing probe fails and the run reports that it observed nothing —
  # rather than coming back up and reporting a silence it did not witness.
  # Which sink runs is the lane's choice (up.sh sets RELAY_SINK_SCRIPT).
  # relay-sink.mjs records connection attempts and never terminates TLS, which
  # is all a lane asserting SILENCE needs. relay-payload-sink.mjs terminates
  # TLS with the certificate up.sh mints for the run and records every request
  # body, which is what a lane asserting on what an ENABLED deployment sends
  # needs. They share READY_FILE and the port list, so the healthcheck and the
  # alias below cover both.
  relay-sink:
    image: node:lts-alpine
    command: ['node', '/opt/release-test/${RELAY_SINK_SCRIPT:-relay-sink.mjs}']
    environment:
      # Where the payload sink writes; ignored by the connection sink.
      RELAY_CAPTURE_DIR: /opt/relay-capture
      RELAY_TLS_DIR: /opt/relay-tls
      # Names the capture file, so one lane's traffic can never be read as
      # another's even though every lane shares the bind mount.
      RELAY_LANE: ${LANE:-unknown}
    # Published so a browser on the HOST resolves the relay's name to this
    # sink too (the analytics lane maps it there with Chromium's host resolver
    # rules). A lane whose browser sends nothing simply never dials them.
    ports:
      - '${SINK_HTTPS_PORT:-9440}:443'
      - '${SINK_HTTP_PORT:-9450}:80'
    volumes:
      - ./scripts:/opt/release-test:ro
      - ./artifacts/relay-capture:/opt/relay-capture
      - ./artifacts/relay-tls:/opt/relay-tls:ro
    healthcheck:
      # The sink's own readiness file, not a connection to its ports: a
      # healthcheck that dialled 443 would be recorded as egress on every
      # interval and fail the gate it exists to support.
      test: ['CMD', 'test', '-f', '/tmp/relay-sink-listening']
      interval: 2s
      timeout: 5s
      retries: 15
    networks:
      default:
        aliases:
          - ph-relay.networkcanvas.com

volumes:
  postgres:
  garage-data:

configs:
  garage-config:
    content: |
      # One node, one copy of every object. Durability on a single-host
      # deployment comes from the volume and its backups, not from Garage.
      replication_factor = 1

      metadata_dir = "/var/lib/garage/meta"
      data_dir = "/var/lib/garage/data"

      # The node-to-node port. Required even with one node, and never
      # published: nothing outside this network speaks Garage's RPC.
      rpc_bind_addr = "[::]:3901"
      rpc_secret = "${GARAGE_RPC_SECRET:?Set GARAGE_RPC_SECRET in .env (openssl rand -hex 32)}"

      # Garage only accepts requests signed for the region it names. us-east-1
      # is what the setup wizard suggests and what S3 clients default to.
      [s3_api]
      api_bind_addr = "[::]:3900"
      s3_region = "us-east-1"
      root_domain = ".s3.garage"

      [admin]
      api_bind_addr = "[::]:3903"
      admin_token = "${GARAGE_ADMIN_TOKEN:?Set GARAGE_ADMIN_TOKEN in .env (openssl rand -hex 32)}"

  # Every `$$` below is one literal `$` in the script: Compose interpolates
  # the content of a config exactly as it interpolates the rest of this file.
  garage-init:
    content: |
      # Bootstraps a single-node Garage through its admin API (v2). The Garage
      # image is FROM scratch, so there is no shell to run its CLI in; this
      # runs in a curl image on the same network. Every step is idempotent.
      #
      # No jq in that image either. Every value read here is a flat scalar, so
      # the JSON is split on its structural characters and the wanted key
      # matched as a whole line.
      set -eu

      ADMIN="http://garage:3903"
      S3="http://garage:3900"
      BUCKET=assets
      REGION=us-east-1

      fail() {
          echo "garage-init: $$1" >&2
          exit 1
      }

      # Garage's own key format, checked here so a mistyped .env value is
      # reported as such rather than as a failed import.
      printf '%s' "$$GARAGE_ACCESS_KEY_ID" | grep -Eq '^GK[0-9a-f]{24}$$' ||
          fail 'GARAGE_ACCESS_KEY_ID must be GK followed by 24 lowercase hex characters: echo "GK$$(openssl rand -hex 12)"'
      printf '%s' "$$GARAGE_SECRET_ACCESS_KEY" | grep -Eq '^[0-9a-f]{64}$$' ||
          fail 'GARAGE_SECRET_ACCESS_KEY must be 64 lowercase hex characters: openssl rand -hex 32'

      # Sets STATUS and BODY. A non-2xx is not fatal here: two callers read a
      # "not found" as "not created yet" and carry on.
      request() {
          _method="$$1"
          _path="$$2"
          _body="$${3:-}"
          if [ -n "$$_body" ]; then
              _response=$$(curl -sS -X "$$_method" "$$ADMIN$$_path" \
                  -H "Authorization: Bearer $$GARAGE_ADMIN_TOKEN" \
                  -H 'Content-Type: application/json' \
                  -d "$$_body" -w '\n%{http_code}') || fail "$$_method $$_path could not be sent"
          else
              _response=$$(curl -sS -X "$$_method" "$$ADMIN$$_path" \
                  -H "Authorization: Bearer $$GARAGE_ADMIN_TOKEN" \
                  -w '\n%{http_code}') || fail "$$_method $$_path could not be sent"
          fi
          STATUS=$$(printf '%s' "$$_response" | tail -n 1)
          BODY=$$(printf '%s' "$$_response" | sed '$$d')
      }

      # As above, but a non-2xx stops the run and says what was asked and what
      # came back: a half-bootstrapped object store is worse than none.
      require() {
          request "$$1" "$$2" "$${3:-}"
          case "$$STATUS" in
          2*) ;;
          *) fail "$$1 $$2 returned $$STATUS: $$BODY" ;;
          esac
      }

      # $$1 key, $$2 document, $$3 a basic regular expression the value must
      # match whole. Garage pretty-prints its responses, so the whitespace
      # around the key, the colon and the value is all optional.
      string_field() {
          printf '%s' "$$2" | tr ',{}[]' '\n\n\n\n\n' |
              sed -n "s/^[[:space:]]*\"$$1\"[[:space:]]*:[[:space:]]*\"\\($$3\\)\"[[:space:]]*\$$/\\1/p" |
              head -n 1
      }

      number_field() {
          printf '%s' "$$2" | tr ',{}[]' '\n\n\n\n\n' |
              sed -n "s/^[[:space:]]*\"$$1\"[[:space:]]*:[[:space:]]*\\([0-9][0-9]*\\)[[:space:]]*\$$/\\1/p" |
              head -n 1
      }

      echo 'garage-init: waiting for Garage to answer its admin API...'
      attempt=0
      until curl -sS -f -o /dev/null \
          -H "Authorization: Bearer $$GARAGE_ADMIN_TOKEN" \
          "$$ADMIN/v2/GetClusterStatus"; do
          attempt=$$((attempt + 1))
          [ "$$attempt" -lt 60 ] || fail "Garage's admin API at $$ADMIN did not answer after 60 attempts"
          sleep 1
      done

      # A node id is a 64-character hex public key, which nothing else in the
      # status document is.
      require GET /v2/GetClusterStatus
      node_id=$$(string_field id "$$BODY" '[0-9a-f]\{64\}')
      [ -n "$$node_id" ] || fail "could not read this node's id from GetClusterStatus: $$BODY"

      # The layout version increments only when a layout is applied, and only
      # this script ever writes one, so a version above zero means the node
      # already has its role. A previous run that staged a role but failed
      # before applying it leaves the version at zero, and is redone here.
      require GET /v2/GetClusterLayout
      layout_version=$$(number_field version "$$BODY")
      [ -n "$$layout_version" ] || fail "could not read the layout version from GetClusterLayout: $$BODY"

      if [ "$$layout_version" -eq 0 ]; then
          echo "garage-init: assigning node $$node_id a role"
          # Capacity is advertised, not reserved: with one node it only has to
          # be large enough for Garage to shard across its partitions.
          require POST /v2/UpdateClusterLayout \
              "{\"roles\":[{\"id\":\"$$node_id\",\"zone\":\"fresco\",\"capacity\":107374182400,\"tags\":[]}]}"
          require POST /v2/ApplyClusterLayout "{\"version\":$$((layout_version + 1))}"
      else
          echo "garage-init: cluster layout version $$layout_version is already applied"
      fi

      request GET "/v2/GetKeyInfo?id=$$GARAGE_ACCESS_KEY_ID"
      if [ "$$STATUS" = 200 ]; then
          echo "garage-init: access key $$GARAGE_ACCESS_KEY_ID already exists"
      else
          echo "garage-init: importing access key $$GARAGE_ACCESS_KEY_ID"
          require POST /v2/ImportKey \
              "{\"accessKeyId\":\"$$GARAGE_ACCESS_KEY_ID\",\"secretAccessKey\":\"$$GARAGE_SECRET_ACCESS_KEY\",\"name\":\"fresco\"}"
      fi

      # `id` is the bucket's own identifier — the access keys listed in the
      # same document carry theirs under `accessKeyId`.
      request GET "/v2/GetBucketInfo?globalAlias=$$BUCKET"
      if [ "$$STATUS" = 200 ]; then
          echo "garage-init: bucket $$BUCKET already exists"
      else
          echo "garage-init: creating bucket $$BUCKET"
          require POST /v2/CreateBucket "{\"globalAlias\":\"$$BUCKET\"}"
      fi
      bucket_id=$$(string_field id "$$BODY" '[0-9a-f]\{64\}')
      [ -n "$$bucket_id" ] || fail "could not read the id of bucket $$BUCKET: $$BODY"

      # Granting a permission that is already granted is a no-op, so this runs
      # unconditionally rather than reading the current grants back first.
      require POST /v2/AllowBucketKey \
          "{\"bucketId\":\"$$bucket_id\",\"accessKeyId\":\"$$GARAGE_ACCESS_KEY_ID\",\"permissions\":{\"read\":true,\"write\":true,\"owner\":true}}"

      # Browsers upload to and download from the bucket directly, through
      # presigned URLs. When they reach it on the app's own origin (the
      # Traefik route) no CORS rule is needed; a different origin needs one,
      # and Garage has no global setting for it, only a per-bucket rule set
      # through the S3 API. Replacing the rule is idempotent.
      if [ -n "$${GARAGE_CORS_ORIGIN:-}" ]; then
          cors="<CORSConfiguration><CORSRule><AllowedOrigin>$$GARAGE_CORS_ORIGIN</AllowedOrigin><AllowedMethod>GET</AllowedMethod><AllowedMethod>PUT</AllowedMethod><AllowedMethod>HEAD</AllowedMethod><AllowedHeader>*</AllowedHeader><ExposeHeader>ETag</ExposeHeader><MaxAgeSeconds>3600</MaxAgeSeconds></CORSRule></CORSConfiguration>"
          digest=$$(printf '%s' "$$cors" | sha256sum | cut -d ' ' -f 1)
          # A freshly applied layout can take a moment to accept S3 requests.
          attempt=0
          until status=$$(curl -sS -o /dev/null -w '%{http_code}' -X PUT "$$S3/$$BUCKET?cors" \
              --aws-sigv4 "aws:amz:$$REGION:s3" \
              --user "$$GARAGE_ACCESS_KEY_ID:$$GARAGE_SECRET_ACCESS_KEY" \
              -H "x-amz-content-sha256: $$digest" \
              -H 'Content-Type: application/xml' \
              -d "$$cors") && [ "$$status" = 200 ]; do
              attempt=$$((attempt + 1))
              [ "$$attempt" -lt 30 ] || fail "setting the CORS rule on bucket $$BUCKET returned $${status:-no response}"
              sleep 1
          done
          echo "garage-init: bucket $$BUCKET accepts browser requests from $$GARAGE_CORS_ORIGIN"
      fi

      echo "garage-init: bucket $$BUCKET is ready for key $$GARAGE_ACCESS_KEY_ID"

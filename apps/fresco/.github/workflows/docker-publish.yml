# Fresco is developed in the network-canvas monorepo; this repository receives
# its source through the release sync, which pushes to `main`. That push is the
# release event, so it is what builds and publishes the image.
name: Build and Publish Docker Image

permissions:
  contents: read
  packages: write

on:
  push:
    branches: [main]

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The synced package.json is the single source of truth for the release
      # version — the monorepo's changeset run has already bumped it.
      - name: Read version from package.json
        id: version
        run: |
          VERSION=$(jq -r .version package.json)
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "::error::Could not read a version from package.json"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Multi-platform Docker Image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # This is the only build of the bundle the image serves, so it is the
          # only place Fresco's source maps can be uploaded from: PostHog
          # resolves a frame by matching the chunk ID baked into the bundle
          # against an uploaded map, and no other build's chunk IDs match this
          # one's. The Dockerfile reads both as optional BuildKit secrets, so
          # they stay out of the image and its layer history; when a secret is
          # unset here it arrives empty and the build emits no maps at all,
          # exactly as it did before. Each platform builds separately and so
          # uploads its own maps — the JS is identical, and an extra upload is
          # cheaper than a frame nobody can read.
          secrets: |
            posthog_personal_api_key=${{ secrets.POSTHOG_PERSONAL_API_KEY }}
            posthog_project_id=${{ secrets.POSTHOG_PROJECT_ID }}
          tags: |
            ghcr.io/complexdatacollective/fresco:${{ steps.version.outputs.version }}
            ghcr.io/complexdatacollective/fresco:latest
          cache-from: |
            type=gha
            type=registry,ref=ghcr.io/complexdatacollective/fresco:buildcache
          cache-to: |
            type=gha,mode=max
            type=registry,ref=ghcr.io/complexdatacollective/fresco:buildcache,mode=max,image-manifest=true

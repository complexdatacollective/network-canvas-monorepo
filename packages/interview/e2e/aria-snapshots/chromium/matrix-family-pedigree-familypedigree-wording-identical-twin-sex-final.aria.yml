- main:
  - status:
    - heading "Add the members of your family." [level=2]
  - region "Interview notifications"
  - dialog "About Ben":
    - heading "About Ben" [level=2]
    - button "Close"
    - text: Name (optional) A first name or nickname is fine. If you don’t know it, leave this blank and they will be shown by how they are related to you.
    - textbox "Name (optional)": Ben
    - text: Gender identity
    - radiogroup "Gender identity":
      - radio "Woman"
      - text: Woman
      - radio "Man" [checked]
      - text: Man
      - radio "Non-binary"
      - text: Non-binary
      - radio "A different identity"
      - text: A different identity
      - radio "Don’t know"
      - text: Don’t know
      - radio "Prefer not to say"
      - text: Prefer not to say
    - text: Sex assigned at birth Required
    - radiogroup "Sex assigned at birth":
      - radio "Female"
      - text: Female
      - radio "Male" [checked]
      - text: Male
      - radio "Intersex"
      - text: Intersex
      - radio "Don’t know"
      - text: Don’t know
      - radio "Prefer not to say"
      - text: Prefer not to say
    - text: How would you define the relationship of “Julie” to “Ben”?
    - radiogroup "How would you define the relationship of “Julie” to “Ben”?":
      - radio "Biological parent" [checked]
      - text: Biological parent
      - radio "Adoptive parent"
      - text: Adoptive parent
      - radio "Step or social parent"
      - text: Step or social parent
      - radio "Egg or sperm donor"
      - text: Egg or sperm donor
      - radio "Surrogate"
      - text: Surrogate
    - text: Did Julie carry the pregnancy?
    - radiogroup "Did Julie carry the pregnancy?":
      - radio "Yes" [checked]
      - radio "No"
    - text: How would you define the relationship of “Rob” to “Ben”? “Surrogate” is unavailable because “Rob” is recorded as “Male” at birth, so they cannot have carried a pregnancy. To choose it, first change their sex at birth.
    - radiogroup "How would you define the relationship of “Rob” to “Ben”?":
      - radio "Biological parent" [checked]
      - text: Biological parent
      - radio "Adoptive parent"
      - text: Adoptive parent
      - radio "Step or social parent"
      - text: Step or social parent
      - radio "Egg or sperm donor"
      - text: Egg or sperm donor
      - radio "Surrogate" [disabled]
      - text: Surrogate “Surrogate” is unavailable because “Rob” is recorded as “Male” at birth, so they cannot have carried a pregnancy. To choose it, first change their sex at birth.
    - text: Which siblings of “Ben”, if any, are their twins? Include triplets and other multiple births.
    - group "Which siblings of “Ben”, if any, are their twins?":
      - checkbox "You" [checked]
      - text: You
    - text: Are “Ben” and you identical twins? Required Ben and you differ in sex at birth, so not Yes, identical - matrix check
    - radiogroup "Are “Ben” and you identical twins?":
      - radio "Yes, identical" [disabled]
      - text: Yes, identical Ben and you differ in sex at birth, so not Yes, identical - matrix check
      - radio "No, fraternal (non-identical)" [checked]
      - text: No, fraternal (non-identical)
      - radio "Don’t know"
      - text: Don’t know
    - button "Delete"
    - button "Cancel"
    - button "Save"
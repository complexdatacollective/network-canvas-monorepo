- main:
  - status:
    - heading "Add the members of your family." [level=2]
  - region "Your family":
    - button "Mother term - matrix check"
    - button "Father term - matrix check"
    - button "You"
    - button "Sister term - matrix check ex of Tom - matrix check"
    - button "Tom"
    - button "Sister term - matrix check partnered with Sam - matrix check"
    - button "Sam"
  - toolbar "Family tree tools":
    - group "What clicking a person does":
      - button "Add and edit" [pressed]
      - button "Connect"
      - button "Disconnect"
    - separator
    - button "Zoom out"
    - button "Zoom in"
    - button "Show the whole family"
  - navigation:
    - button "Settings"
    - button "Previous Step" [disabled]
    - progressbar "Progress indicator": x
    - button "Next Step"
  - region "Interview notifications"
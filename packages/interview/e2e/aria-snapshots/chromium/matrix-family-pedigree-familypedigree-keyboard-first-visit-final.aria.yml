- main:
  - status:
    - heading "Add the members of your family." [level=2]
  - region "Your family":
    - button "Linda"
    - button "Biological father"
    - button "You"
    - toolbar "Add your relatives":
      - button "Parent"
      - button "Sibling"
      - button "Partner"
      - button "Child"
  - toolbar "Family tree tools":
    - group "What clicking a person does":
      - button "Add and edit" [pressed]
      - button "Connect"
      - button "Disconnect"

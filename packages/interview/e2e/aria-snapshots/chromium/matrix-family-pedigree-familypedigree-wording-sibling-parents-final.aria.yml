- main:
  - status:
    - heading "Add the members of your family." [level=2]
  - region "Interview notifications"
  - dialog "Add your sibling":
    - heading "Add your sibling" [level=2]
    - button "Close"
    - text: Which parents do they share with you? Required
    - group "Which parents do they share with you?":
      - checkbox "Amy"
      - text: Amy
      - checkbox "Rob"
      - text: Rob
      - checkbox "Sam" [checked]
      - text: Sam
      - checkbox "Gail" [checked]
      - text: Gail
    - paragraph: Sharing only Sam and Gail with you is not enough - matrix check
    - text: To the parents they share, are they… Required
    - radiogroup "To the parents they share, are they…":
      - radio "A biological child" [checked]
      - text: A biological child
      - radio "An adopted child"
      - text: An adopted child
    - text: Are they your twin? Answer yes for triplets and other multiple births too. “Yes, identical twins” is unavailable because identical twins have the same biological parents and donors, and this sibling would not have all of yours. To choose it, choose all of your biological parents and donors above.
    - radiogroup "Are they your twin?":
      - radio "No" [checked]
      - text: "No"
      - radio "Yes, identical twins" [disabled]
      - text: Yes, identical twins “Yes, identical twins” is unavailable because identical twins have the same biological parents and donors, and this sibling would not have all of yours. To choose it, choose all of your biological parents and donors above.
      - radio "Yes, fraternal (non-identical) twins"
      - text: Yes, fraternal (non-identical) twins
      - radio "Yes, but I don’t know if they are identical"
      - text: Yes, but I don’t know if they are identical
    - button "Cancel"
    - button "Back"
    - button "Save"
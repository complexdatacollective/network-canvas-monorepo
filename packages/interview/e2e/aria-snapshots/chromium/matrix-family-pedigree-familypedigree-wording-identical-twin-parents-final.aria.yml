- main:
  - status:
    - heading "Add the members of your family." [level=2]
  - text: Details saved.
  - region "Interview notifications"
  - dialog "About Bea":
    - heading "About Bea" [level=2]
    - button "Close"
    - text: Name (optional) A first name or nickname is fine. If you don’t know it, leave this blank and they will be shown by how they are related to you.
    - textbox "Name (optional)": Bea
    - text: Gender identity Required
    - radiogroup "Gender identity":
      - radio "Woman" [checked]
      - text: Woman
      - radio "Man"
      - text: Man
      - radio "Non-binary"
      - text: Non-binary
      - radio "A different identity"
      - text: A different identity
      - radio "Don’t know"
      - text: Don’t know
      - radio "Prefer not to say"
      - text: Prefer not to say
    - text: Sex assigned at birth Required
    - radiogroup "Sex assigned at birth":
      - radio "Female" [checked]
      - text: Female
      - radio "Male"
      - text: Male
      - radio "Intersex"
      - text: Intersex
      - radio "Don’t know"
      - text: Don’t know
      - radio "Prefer not to say"
      - text: Prefer not to say
    - text: What kind of parent is “Julie” to “Bea”?
    - radiogroup "What kind of parent is “Julie” to “Bea”?":
      - radio "Biological parent" [checked]
      - text: Biological parent
      - radio "Adoptive parent"
      - text: Adoptive parent
      - radio "Step or social parent"
      - text: Step or social parent
      - radio "Egg or sperm donor"
      - text: Egg or sperm donor
      - radio "Surrogate"
      - text: Surrogate
    - text: What kind of parent is “Rob” to “Bea”? “Surrogate” is unavailable because “Rob” is recorded as “Male” at birth, so they cannot have carried a pregnancy. To choose it, first change their sex at birth.
    - radiogroup "What kind of parent is “Rob” to “Bea”?":
      - radio "Biological parent" [checked]
      - text: Biological parent
      - radio "Adoptive parent"
      - text: Adoptive parent
      - radio "Step or social parent"
      - text: Step or social parent
      - radio "Egg or sperm donor"
      - text: Egg or sperm donor
      - radio "Surrogate" [disabled]
      - text: Surrogate “Surrogate” is unavailable because “Rob” is recorded as “Male” at birth, so they cannot have carried a pregnancy. To choose it, first change their sex at birth.
    - text: Who carried the pregnancy?
    - radiogroup "Who carried the pregnancy?":
      - radio "Julie" [checked]
      - text: Julie
      - radio "Someone else, or I don’t know"
      - text: Someone else, or I don’t know
    - text: Are any of these siblings twins with “Bea”? Include triplets and other multiple births.
    - group "Are any of these siblings twins with “Bea”?":
      - checkbox "You" [checked]
      - text: You
    - text: Are “Bea” and you identical twins? Required
    - radiogroup "Are “Bea” and you identical twins?":
      - radio "Yes, identical" [checked]
      - text: Yes, identical
      - radio "No, fraternal (non-identical)"
      - text: No, fraternal (non-identical)
      - radio "Don’t know"
      - text: Don’t know
    - button "Delete"
    - button "Cancel"
    - button "Save"
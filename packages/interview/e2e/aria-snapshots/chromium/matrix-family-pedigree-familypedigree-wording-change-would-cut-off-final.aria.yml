- main:
  - status:
    - heading "Add the members of your family." [level=2]
  - text: Hal added to your family.
  - region "Interview notifications"
  - dialog "Add a parent of Relative":
    - heading "Add a parent of Relative" [level=2]
    - button "Close"
    - alert:
      - text: "Error:"
      - paragraph: "Change would strand 2 people: Relative and Relative - matrix check"
    - text: Name (optional) A first name or nickname is fine. If you don’t know it, leave this blank and they will be shown by how they are related to you.
    - textbox "Name (optional)": Al
    - text: Gender identity Required
    - radiogroup "Gender identity":
      - radio "Woman"
      - text: Woman
      - radio "Man" [checked]
      - text: Man
      - radio "Non-binary"
      - text: Non-binary
      - radio "A different identity"
      - text: A different identity
      - radio "Don’t know"
      - text: Don’t know
      - radio "Prefer not to say"
      - text: Prefer not to say
    - text: Sex assigned at birth Required
    - radiogroup "Sex assigned at birth":
      - radio "Female"
      - text: Female
      - radio "Male" [checked]
      - text: Male
      - radio "Intersex"
      - text: Intersex
      - radio "Don’t know"
      - text: Don’t know
      - radio "Prefer not to say"
      - text: Prefer not to say
    - text: What kind of parent are they? Required Some answers are unavailable because this person is recorded as “Male” at birth, so they cannot have carried a pregnancy. To choose one, first change their sex at birth.
    - radiogroup "What kind of parent are they?":
      - radio "Biological parent" [checked]
      - text: Biological parent
      - radio "Adoptive parent"
      - text: Adoptive parent
      - radio "Step or social parent"
      - text: Step or social parent
      - radio "Egg or sperm donor"
      - text: Egg or sperm donor
      - radio "Surrogate" [disabled]
      - text: Surrogate
    - text: Are they also the parent of…
    - group "Are they also the parent of…":
      - checkbox "You"
      - text: You
    - button "Cancel"
    - button "Save"
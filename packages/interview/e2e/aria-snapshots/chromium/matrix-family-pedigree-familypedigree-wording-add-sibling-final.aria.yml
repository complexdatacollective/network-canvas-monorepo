- main:
  - status:
    - heading "Add the members of your family." [level=2]
  - region "Interview notifications"
  - dialog "Add your sibling":
    - heading "Add your sibling" [level=2]
    - button "Close"
    - text: Name (optional) A first name or nickname is fine. If you don’t know it, leave this blank and they will be shown by how they are related to you.
    - textbox "Name (optional)"
    - text: Gender identity Required
    - radiogroup "Gender identity":
      - radio "Woman"
      - text: Woman
      - radio "Man"
      - text: Man
      - radio "Non-binary"
      - text: Non-binary
      - radio "A different identity"
      - text: A different identity
      - radio "Don’t know"
      - text: Don’t know
      - radio "Prefer not to say"
      - text: Prefer not to say
    - text: Sex assigned at birth Required
    - radiogroup "Sex assigned at birth":
      - radio "Female"
      - text: Female
      - radio "Male"
      - text: Male
      - radio "Intersex"
      - text: Intersex
      - radio "Don’t know"
      - text: Don’t know
      - radio "Prefer not to say"
      - text: Prefer not to say
    - text: Parents shared with you - matrix check Required
    - group "Parents shared with you - matrix check":
      - checkbox "Julie" [checked]
      - text: Julie
      - checkbox "Rob"
      - text: Rob
    - text: Kind of sibling - matrix check Required
    - radiogroup "Kind of sibling - matrix check":
      - radio "Biological kind - matrix check" [checked]
      - text: Biological kind - matrix check
      - radio "Adopted kind - matrix check"
      - text: Adopted kind - matrix check
      - radio "Social kind - matrix check"
      - text: Social kind - matrix check
    - text: Carrier of the pregnancy - matrix check
    - radiogroup "Carrier of the pregnancy - matrix check":
      - radio "Julie"
      - text: Julie
      - radio "Another or unknown carrier - matrix check"
      - text: Another or unknown carrier - matrix check
    - text: Is this your twin - matrix check Triplets count as twins - matrix check New sibling cannot be identical to you - matrix check
    - radiogroup "Is this your twin - matrix check":
      - radio "Not twins - matrix check" [checked]
      - text: Not twins - matrix check
      - radio "Identical twin option - matrix check" [disabled]
      - text: Identical twin option - matrix check
      - radio "Fraternal twin option - matrix check"
      - text: Fraternal twin option - matrix check
      - radio "Twins of unknown kind - matrix check"
      - text: Twins of unknown kind - matrix check
    - button "Cancel"
    - button "Save"
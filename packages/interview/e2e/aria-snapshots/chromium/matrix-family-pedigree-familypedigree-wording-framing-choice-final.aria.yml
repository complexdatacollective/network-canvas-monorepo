- main:
  - status:
    - heading "Add the members of your family." [level=2]
  - text: Family members are now described with words like mother, father, sister and brother.
  - region "Interview notifications"
  - dialog "Add your sibling":
    - heading "Add your sibling" [level=2]
    - button "Close"
    - text: Parents shared with you - matrix check Required Shares the father note - matrix check
    - radiogroup "Parents shared with you - matrix check":
      - radio "Both of them - matrix check"
      - text: Both of them - matrix check
      - radio "Mother side only - matrix check"
      - text: Mother side only - matrix check
      - radio "Father side only - matrix check" [checked]
      - text: Father side only - matrix check
    - text: To the parents they share, are they… Required
    - radiogroup "To the parents they share, are they…":
      - radio "A biological child"
      - text: A biological child
      - radio "An adopted child"
      - text: An adopted child
    - text: Are they your twin? Answer yes for triplets and other multiple births too.
    - radiogroup "Are they your twin?":
      - radio "No"
      - text: "No"
      - radio "Yes, fraternal (non-identical) twins"
      - text: Yes, fraternal (non-identical) twins
    - button "Cancel"
    - button "Back"
    - button "Save"
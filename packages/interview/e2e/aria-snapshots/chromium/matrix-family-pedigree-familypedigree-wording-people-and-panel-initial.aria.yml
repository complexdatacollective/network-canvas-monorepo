- main:
  - status:
    - heading "Add the members of your family." [level=2]
  - region "Your family":
    - button "Mother term - matrix check"
    - button "Relative term - matrix check"
    - button "You": Me myself - matrix check
    - button "Sister term - matrix check"
  - toolbar "Family tree tools":
    - group "What clicking a person does":
      - button "Add and edit" [pressed]
      - button "Connect"
      - button "Disconnect"
    - separator
    - group "History tools":
      - button "Undo" [disabled]
      - button "Redo" [disabled]
    - separator
    - button /Family tree \d+% complete\. Show what’s still needed\./
  - toolbar "View controls":
    - button "Zoom out"
    - button "Zoom in"
    - button "Show the whole family"
  - navigation:
    - button "Settings"
    - button "Previous Step" [disabled]
    - progressbar "Progress indicator": x
    - button "Next Step"
  - region "Interview notifications"
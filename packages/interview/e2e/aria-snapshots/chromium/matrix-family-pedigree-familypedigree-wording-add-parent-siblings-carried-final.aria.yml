- main:
  - status:
    - heading "Add the members of your family." [level=2]
  - region "Interview notifications"
  - dialog "Add your parent":
    - heading "Add your parent" [level=2]
    - button "Close"
    - text: What kind of parent are they? Required Surrogate is unavailable because Sue is recorded as having carried you, and only one person carries a pregnancy. To choose it, first change how Sue is connected to you.
    - radiogroup "What kind of parent are they?":
      - radio "Biological parent"
      - text: Biological parent
      - radio "Adoptive parent"
      - text: Adoptive parent
      - radio "Step or social parent" [checked]
      - text: Step or social parent
      - radio "Egg or sperm donor"
      - text: Egg or sperm donor
      - radio "Surrogate" [disabled]
      - text: Surrogate Surrogate is unavailable because Sue is recorded as having carried you, and only one person carries a pregnancy. To choose it, first change how Sue is connected to you.
    - text: Are they the partner of another parent?
    - radiogroup "Are they the partner of another parent?":
      - radio "Julie"
      - text: Julie
      - radio "Rob"
      - text: Rob
      - radio "No"
      - text: "No"
    - text: Are they also the parent of…
    - group "Are they also the parent of…":
      - checkbox "Bea" [checked]
      - text: Bea
      - checkbox "Bo"
      - text: Bo
    - text: Did this parent carry Bea - matrix check Required
    - radiogroup "Did this parent carry Bea - matrix check":
      - radio "Yes"
      - text: "Yes"
      - radio "No"
      - text: "No"
      - radio "Don’t know"
      - text: Don’t know
    - button "Cancel"
    - button "Back"
    - button "Save"
- main:
  - toolbar "Network composer tools":
    - group "Editing tools":
      - button "Select" [pressed]
      - button "Add node"
    - separator
    - group "Layout tools":
      - button "Automatic layout"
    - separator
    - group "History tools":
      - button "Undo"
      - button "Redo" [disabled]
  - application:
    - button "Priya" [pressed]
  - dialog "Priya":
    - separator "Resize panel"
    - heading "Priya" [level=2]
    - button "Close"
    - text: Bio A Required
    - list:
      - listitem: Enter at least 3 characters.
    - textbox "Bio A": Gated marker
    - text: Bio B Required
    - textbox "Bio B": Known
    - text: Count
    - button "Decrease value"
    - spinbutton "Count": /\d+/
    - button "Increase value"
    - button "Delete"
  - navigation:
    - button "Previous Step" [disabled]
    - progressbar "Progress indicator": x
    - button "Next Step"
  - region "Interview notifications"
name: App Sub-path Dist

# Builds a released app tag under a sub-path and attaches the result to that
# tag's GitHub release, for the app's next major to bundle:
#
#   @codaco/architect@8.5.0    ->  architect-v8-dist.tgz    (base /v8/)
#   @codaco/interviewer@8.5.0  ->  interviewer-v8-dist.tgz  (base /v8/)
#
# Architect 9 serves Architect 8, and Interviewer 9 serves Interviewer 8, at
# /v8/ from its own deploy, so researchers keep working with schema 8
# protocols beside the new version. The newer major does not build the older
# one itself: apps/<app>/legacy-<app>.json on the newer line pins this tarball
# by URL and sha256, and its build verifies and extracts it into dist/v8. See
# "Sub-path dist tarball" in apps/<app>/RELEASING.md.
#
# App- and major-generic: a tag of `app` on major N is built with
# <APP>_BASE_PATH=/vN/ and packed as <app>-vN-dist.tgz, so a 10.x line can
# bundle 9 the same way. Only tags whose tree can build under a sub-path are
# eligible (the marker is the app's build reading its <APP>_BASE_PATH, which
# 8.5.0 introduced); called from a release lane, an ineligible tag such as
# 8.4.1 is skipped with a notice rather than failing a release that has
# already shipped.
#
# Chained with workflow_call from the release lanes — apps-release-<app> in
# ci-and-release.yml, the Hotfix Release workflow and the maintenance lanes —
# because a tag or release created with GITHUB_TOKEN never fires
# `on: push: tags` or `on: release`. Dispatch it by hand (from main) to retry a
# failed run or, with `replace`, to rebuild.
#
# Never replaces an uploaded tarball unless `replace` is set. The build is not
# bit-for-bit reproducible (its precache id is random outside turbo), and the
# pin's sha256 is what the newer major's production build verifies — a
# silently replaced asset would fail every later build of it until the pin was
# bumped.
#
# Split into three jobs so the one that holds a write token never runs code
# from the tag: `build` installs and builds the tag's tree, and a lifecycle
# script there could prepend to $GITHUB_PATH, so it holds a read-only token;
# `publish` downloads the packed tarball, re-verifies it, and uploads it with
# the REST API. Not softprops/action-gh-release: on a release that already
# exists it rewrites the name, body and make_latest, and re-running it on
# 8.5.0 after 9.0 ships could move "Latest".
#
# No PostHog credentials reach the build: without them it emits no source
# maps and uploads nothing. The version was already released, so uploading its
# maps again would duplicate them against that release in PostHog. The packer
# refuses a dist carrying any.

on:
  workflow_dispatch:
    inputs:
      app:
        description: App whose release to build under a sub-path
        required: true
        type: choice
        options:
          - architect
          - interviewer
      tag:
        description: Released tag to build under its major's sub-path (e.g. @codaco/interviewer@8.5.0)
        required: true
        type: string
      replace:
        description: Replace a tarball already attached to the release (breaks the current pin)
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      app:
        required: true
        type: string
      tag:
        required: true
        type: string
      replace:
        required: false
        default: false
        type: boolean
      # In a reusable workflow the `github` context belongs to the CALLER, so
      # `github.sha` is the caller's commit rather than the revision this body
      # was loaded from. For a local `./.github/workflows/…` call those are the
      # same commit, and the default is correct; a caller that pins an explicit
      # `@ref` must pass the matching revision here, or the tooling checkouts
      # below could be an older tree that lacks the guard and packing scripts.
      tooling_ref:
        required: false
        default: ''
        type: string
      # The commit the calling lane released. The tag is only trusted to
      # name it: a tag created at a later commit would ship that commit's
      # tree under this version. A dispatch never sets it (undeclared there).
      expected_sha:
        required: false
        default: ''
        type: string
      # A release lane calls this after its release has shipped, so a tag that
      # cannot be built under a sub-path is skipped with a notice. A dispatch
      # never sets it (undeclared there), so asking by hand for an ineligible
      # tag fails.
      skip_ineligible:
        required: false
        default: true
        type: boolean

permissions:
  contents: read

env:
  # One task at a time on every CI runner; see the `env` block and the `test`
  # job in ci-and-release.yml for the measurements behind the cap.
  TURBO_CONCURRENCY: '1'

jobs:
  # Validates the tag, decides whether it is eligible, and checks the release
  # for an existing tarball before a build is spent on it. Checks out THIS
  # workflow's revision, not the tag: the guard reads the tag with `git show`.
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      label: ${{ steps.app.outputs.label }}
      base_variable: ${{ steps.app.outputs.base_variable }}
      version: ${{ steps.guard.outputs.version }}
      major: ${{ steps.guard.outputs.major }}
      sha: ${{ steps.guard.outputs.sha }}
      base: ${{ steps.eligible.outputs.base }}
      asset: ${{ steps.eligible.outputs.asset }}
      eligible: ${{ steps.eligible.outputs.eligible }}
      skip: ${{ steps.existing.outputs.skip }}
    steps:
      # Every caller runs from main (the release lanes fire only there, and the
      # dispatched lanes refuse any other ref), so this refuses only a dispatch
      # from a branch, whose copy of this file is unreviewed. DISPATCH_REF
      # comes through the environment, never interpolated into the script.
      - name: Validate the dispatch
        env:
          DISPATCH_REF: ${{ github.ref }}
        run: |
          if [[ "$DISPATCH_REF" != 'refs/heads/main' ]]; then
            echo "::error::Run this workflow from main. Running it from a branch would take the job definition from that branch too." >&2
            exit 1
          fi

      # A workflow_call input is a free string, so the app is checked here
      # before it names a directory, a package or an environment variable.
      - name: Validate the app
        id: app
        env:
          APP: ${{ inputs.app }}
        run: |
          case "$APP" in
            architect) label=Architect ;;
            interviewer) label=Interviewer ;;
            *)
              echo "::error::'$APP' has no sub-path dist (expected architect or interviewer)." >&2
              exit 1
              ;;
          esac
          {
            echo "label=$label"
            echo "base_variable=${APP^^}_BASE_PATH"
          } >>"$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ inputs.tooling_ref || github.sha }}
          fetch-tags: true
          # The guard reads every tag on the major line.
          fetch-depth: 0
          persist-credentials: false

      # Checks the tag is a release tag of the app that agrees with its own
      # tree and is the newest stable release on its major line: the pin is
      # only ever moved forward.
      - name: Resolve and guard tag
        id: guard
        env:
          APP: ${{ inputs.app }}
          TAG: ${{ inputs.tag }}
          FORCE: 'false'
        run: bash .github/scripts/release-line-tag-guard.sh

      - name: Check the tag names the released commit
        if: inputs.expected_sha != ''
        env:
          TAG: ${{ inputs.tag }}
          TAGGED: ${{ steps.guard.outputs.sha }}
          EXPECTED: ${{ inputs.expected_sha }}
        run: |
          if [[ "$TAGGED" != "$EXPECTED" ]]; then
            echo "::error::$TAG points at $TAGGED, not the released commit $EXPECTED. Its tree is not what was released, so no sub-path dist is built from it. Move the tag to $EXPECTED, then dispatch this workflow." >&2
            exit 1
          fi

      - name: Check the tag can build under a sub-path
        id: eligible
        env:
          APP: ${{ inputs.app }}
          TAG: ${{ inputs.tag }}
          MAJOR: ${{ steps.guard.outputs.major }}
          BASE_VARIABLE: ${{ steps.app.outputs.base_variable }}
          SKIP_INELIGIBLE: ${{ inputs.skip_ineligible }}
        run: |
          {
            echo "base=/v${MAJOR}/"
            echo "asset=${APP}-v${MAJOR}-dist.tgz"
          } >>"$GITHUB_OUTPUT"
          # A tree that can build under a sub-path reads the app's base-path
          # variable in its Vite config or build scripts; no earlier release
          # names it anywhere there.
          if git grep -q -F -e "$BASE_VARIABLE" "$TAG" -- \
            "apps/${APP}/scripts" "apps/${APP}/vite.config.ts" "apps/${APP}/vite.renderer.config.ts"; then
            echo "eligible=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          message="$TAG predates sub-path builds (its build never reads ${BASE_VARIABLE})"
          if [[ "$SKIP_INELIGIBLE" == 'true' ]]; then
            echo "::notice::$message; no sub-path dist for it."
            echo "eligible=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error::$message." >&2
          exit 1

      # Releases are created at the end of the release lanes, which run before
      # this, so a missing release is an error rather than a race. A run that
      # stopped between the two uploads leaves the tarball without its
      # checksum; it never printed a pin, so nothing can depend on that
      # tarball, but it is still only replaced when asked.
      - name: Check the release for an existing tarball
        id: existing
        if: steps.eligible.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          ASSET: ${{ steps.eligible.outputs.asset }}
          REPLACE: ${{ inputs.replace }}
        run: |
          set -euo pipefail
          encoded="$(jq -rn --arg t "$TAG" '$t|@uri')"
          names="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${encoded}" --jq '.assets[].name')"
          has_tarball=false
          has_checksum=false
          grep -qxF "$ASSET" <<<"$names" && has_tarball=true
          grep -qxF "${ASSET}.sha256" <<<"$names" && has_checksum=true
          if [[ "$has_tarball" == 'false' && "$has_checksum" == 'false' ]]; then
            echo "skip=false" >>"$GITHUB_OUTPUT"
          elif [[ "$REPLACE" == 'true' ]]; then
            echo "::warning::$TAG already has $ASSET; replacing it, which breaks any pin of the current one."
            echo "skip=false" >>"$GITHUB_OUTPUT"
          elif [[ "$has_tarball" == 'true' && "$has_checksum" == 'true' ]]; then
            echo "::notice::$TAG already has $ASSET; leaving it (and any pin of it) alone."
            echo "skip=true" >>"$GITHUB_OUTPUT"
          else
            echo "::error::$TAG has only part of its sub-path dist: an earlier run stopped between the two uploads and printed no pin. Re-run with replace to rebuild it." >&2
            exit 1
          fi

  # Builds and packs the tag's tree. Runs code from the tag, so it holds a
  # read-only token and no secret.
  build:
    needs: resolve
    if: needs.resolve.outputs.eligible == 'true' && needs.resolve.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      sha256: ${{ steps.pack.outputs.sha256 }}
      cache_prefix: ${{ steps.pack.outputs.cache_prefix }}
    steps:
      # Application source, from the tag: the tree that gets built, so the
      # install resolves the lockfile that release shipped with.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      # Packing tooling, from THIS workflow's revision, which is the copy
      # anyone has reviewed. Kept in a subdirectory so the tag's tree stays the
      # workspace root.
      - name: Check out the packing tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ inputs.tooling_ref || github.sha }}
          path: .dist-tooling
          sparse-checkout: |
            scripts/release
            scripts/buildtime
            apps/${{ inputs.app }}/scripts
          persist-credentials: false

      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile --ignore-scripts

      # Not through turbo: a cache entry restored from a root build would be
      # labelled with the sub-path. The package script runs Vite and then the
      # tag's own assert-pwa-build.mjs, which holds the sub-path shape. Packages
      # are consumed as source, so nothing needs building first.
      # The base reaches the build through the app's own variable
      # (ARCHITECT_BASE_PATH, INTERVIEWER_BASE_PATH), whose name was
      # validated in `resolve`.
      - name: Build the app under its sub-path
        env:
          APP: ${{ inputs.app }}
          BASE: ${{ needs.resolve.outputs.base }}
          BASE_VARIABLE: ${{ needs.resolve.outputs.base_variable }}
        run: env "${BASE_VARIABLE}=${BASE}" pnpm --filter "@codaco/${APP}" build

      # Architect's deploys carry a build-info.json stamp; Interviewer has
      # none, and its sub-path build stamps dist-info.json itself. COMMIT_REF
      # must be explicit: GITHUB_SHA is the commit the workflow definition was
      # read from, not the tag being built.
      - name: Stamp the built commit
        if: inputs.app == 'architect'
        env:
          COMMIT_REF: ${{ needs.resolve.outputs.sha }}
        run: |
          node .dist-tooling/apps/architect/scripts/write-build-info.mjs \
            "${GITHUB_WORKSPACE}/apps/architect/dist"

      # Checks the sub-path shape again from reviewed tooling, drops the
      # hosting rules, writes dist-info.json and packs deterministically:
      # tar --sort=name --mtime=@0 --owner=0 --group=0 | gzip -n.
      - name: Pack the sub-path dist
        id: pack
        env:
          APP: ${{ inputs.app }}
          TAG: ${{ inputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
          COMMIT: ${{ needs.resolve.outputs.sha }}
          BASE: ${{ needs.resolve.outputs.base }}
          ASSET: ${{ needs.resolve.outputs.asset }}
        run: |
          mkdir -p "${RUNNER_TEMP}/subpath-dist"
          node .dist-tooling/scripts/release/package-app-subpath-dist.mjs \
            --app "$APP" \
            --dist "${GITHUB_WORKSPACE}/apps/${APP}/dist" \
            --tag "$TAG" \
            --version "$VERSION" \
            --commit "$COMMIT" \
            --base "$BASE" \
            --out "${RUNNER_TEMP}/subpath-dist/${ASSET}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.app }}-subpath-dist
          path: ${{ runner.temp }}/subpath-dist
          if-no-files-found: error
          retention-days: 3

  # Uploads the tarball. Holds the write token and runs nothing from the tag:
  # no checkout, only the artifact the build job packed.
  publish:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    # One upload per major line at a time, so two runs for the same tag cannot
    # both find the asset missing and race to attach it.
    concurrency:
      group: ${{ inputs.app }}-subpath-dist-v${{ needs.resolve.outputs.major }}
      cancel-in-progress: false
    env:
      TAG: ${{ inputs.tag }}
      ASSET: ${{ needs.resolve.outputs.asset }}
      SHA256: ${{ needs.build.outputs.sha256 }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.app }}-subpath-dist
          path: ${{ runner.temp }}/subpath-dist

      # The artifact store sits between the jobs; what is uploaded must be
      # exactly what the build job hashed.
      - name: Verify the downloaded tarball
        working-directory: ${{ runner.temp }}/subpath-dist
        run: |
          set -euo pipefail
          sha256sum -c "${ASSET}.sha256"
          [[ "$(sha256sum "$ASSET" | cut -d' ' -f1)" == "$SHA256" ]] || {
            echo "::error::$ASSET does not hash to the build job's $SHA256" >&2
            exit 1
          }

      # Re-checked under the lock: a run that started earlier may have
      # attached the asset since `resolve` looked. Replacement deletes the old
      # assets first; the REST upload refuses a name that already exists, so
      # without `replace` a lost race fails here instead of overwriting.
      - name: Upload to the release
        id: upload
        working-directory: ${{ runner.temp }}/subpath-dist
        env:
          GH_TOKEN: ${{ github.token }}
          REPLACE: ${{ inputs.replace }}
        run: |
          set -euo pipefail
          encoded="$(jq -rn --arg t "$TAG" '$t|@uri')"
          release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${encoded}")"
          release_id="$(jq -r '.id' <<<"$release")"
          for name in "$ASSET" "${ASSET}.sha256"; do
            existing="$(jq -r --arg n "$name" '.assets[] | select(.name == $n) | .id' <<<"$release")"
            [[ -z "$existing" ]] && continue
            if [[ "$REPLACE" != 'true' ]]; then
              echo "::error::$TAG already has $name. Re-run with replace to rebuild it, then update the pin." >&2
              exit 1
            fi
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${existing}"
          done
          upload() {
            gh api -X POST \
              "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?name=$1" \
              -H "Content-Type: $2" \
              --input "$1"
          }
          asset_json="$(upload "$ASSET" application/gzip)"
          upload "${ASSET}.sha256" text/plain >/dev/null
          {
            echo "url=$(jq -r '.browser_download_url' <<<"$asset_json")"
            echo "asset_id=$(jq -r '.id' <<<"$asset_json")"
          } >>"$GITHUB_OUTPUT"

      # What the newer major's build will do: fetch the public URL and hash it.
      # Also compares GitHub's own digest of the asset when it reports one.
      - name: Verify the uploaded tarball
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.upload.outputs.url }}
          ASSET_ID: ${{ steps.upload.outputs.asset_id }}
        run: |
          set -euo pipefail
          digest="$(gh api "repos/${GITHUB_REPOSITORY}/releases/assets/${ASSET_ID}" --jq '.digest // ""')"
          if [[ -n "$digest" && "$digest" != "sha256:${SHA256}" ]]; then
            echo "::error::GitHub reports $digest for $ASSET, not sha256:${SHA256}" >&2
            exit 1
          fi
          fetched="$(curl -fsSL --retry 5 --retry-all-errors "$URL" | sha256sum | cut -d' ' -f1)"
          if [[ "$fetched" != "$SHA256" ]]; then
            echo "::error::$URL hashes to $fetched, not $SHA256" >&2
            exit 1
          fi

      # The pin, ready to paste into apps/<app>/legacy-<app>.json on the line
      # that bundles this one (see apps/<app>/RELEASING.md).
      - name: Summary
        env:
          APP: ${{ inputs.app }}
          LABEL: ${{ needs.resolve.outputs.label }}
          URL: ${{ steps.upload.outputs.url }}
          VERSION: ${{ needs.resolve.outputs.version }}
          MAJOR: ${{ needs.resolve.outputs.major }}
          CACHE_PREFIX: ${{ needs.build.outputs.cache_prefix }}
        run: |
          set -euo pipefail
          pin="$(jq -n \
            --arg key "v${MAJOR}" \
            --arg version "$VERSION" \
            --arg url "$URL" \
            --arg sha256 "$SHA256" \
            --arg cachePrefix "$CACHE_PREFIX" \
            '{($key): {version: $version, url: $url, sha256: $sha256, cachePrefix: $cachePrefix}}')"
          {
            echo "### ${LABEL} ${VERSION} sub-path dist"
            echo
            echo "Attached \`${ASSET}\` to \`${TAG}\`. Pin for \`apps/${APP}/legacy-${APP}.json\`:"
            echo
            echo '```json'
            echo "$pin"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          echo "$pin"

name: Architect Archive Release

# Publishes a released Architect version to a permanent, version-pinned host so
# researchers on an older protocol schema keep a working Architect:
#
#   @codaco/architect@8.2.5  ->  https://v8.architect.networkcanvas.com
#
# The archive is keyed by MAJOR version, not by release. Major versions track
# protocol schema versions, so only the newest release on each major line needs
# to stay reachable: 8.3.0 replaces 8.2.5 at the same host. That keeps the host
# count to one per schema generation rather than one per patch, which matters
# because a zone allows 100 custom domains in total.
#
# Production stays on Netlify at architect.networkcanvas.com. This lane is
# additive: it never touches the production site, the release tags, or the
# GitHub releases, so a failure here cannot block or undo a release. It is not
# yet wired into the release workflow — dispatch it by hand after a release, or
# call it from another workflow. Integration is tracked in issue #1767, which
# also records the sequencing constraint: the archive has to run AFTER the
# release tag is pushed, because the guard reads tags to decide whether this
# version is still the newest on its line.
#
# The archive is a Cloudflare Worker serving static assets, one Worker per major
# line. `custom_domain: true` in the generated Wrangler config has Cloudflare
# provision both the DNS record and the certificate — including for this
# two-label host, which Universal SSL's single-level wildcard does not cover.
# Requests to static assets are free and unlimited on both Workers plans, so the
# archive's running cost is zero.
#
# Why not keep the Netlify deploy that already exists for each version: Netlify
# overrides `Cache-Control` on `/sw.js` and `/manifest.webmanifest` for any
# deploy that is not the site's production deploy, so an aliased Netlify archive
# cannot satisfy the cache contract in apps/architect/RELEASING.md. Cloudflare
# honours those rules. It differs in two other ways instead, both handled by
# write-cloudflare-archive-config.mjs — see that file.
#
# The build is made from the tag rather than reused from the original release,
# so it is not byte-identical to what production served: PostHog credentials are
# deliberately not passed here, and without them the build emits no source maps
# and uploads nothing. Re-uploading maps for an already-released version would
# duplicate them against that release in PostHog.
#
# NOTE(human-setup-required): needs the repository secret CLOUDFLARE_API_TOKEN,
# scoped to the networkcanvas.com zone with DNS:Edit, Zone:Read and Workers
# Routes:Edit, plus account-level Workers Scripts:Edit. Set the repository
# variable CLOUDFLARE_ACCOUNT_ID as well when the token can see more than one
# account; with a single-account token Wrangler resolves it on its own.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Released tag to archive (e.g. @codaco/architect@8.2.5)
        required: true
        type: string
      zone:
        description: Zone to publish the version host under
        required: false
        default: networkcanvas.com
        type: string
      force:
        description: Archive even if a newer release exists on this major line
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      zone:
        required: false
        default: networkcanvas.com
        type: string
      force:
        required: false
        default: false
        type: boolean
      # In a reusable workflow the `github` context belongs to the CALLER, so
      # `github.sha` is the caller's triggering commit rather than the revision
      # this workflow body was loaded from. For a local `./.github/workflows/…`
      # call those are necessarily the same commit, which is how issue #1767
      # intends to wire this up, and the default is correct. A caller that pins
      # an explicit `@ref` must pass the matching revision here, or the tooling
      # checkout below could be an older tree that lacks these scripts.
      tooling_ref:
        required: false
        default: ''
        type: string
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  # Fails a bad tag before a build is spent on it. Split from the deploy so the
  # concurrency group below can be keyed on the major line: two runs for the
  # same line share a Worker and a hostname and must not overlap, while runs for
  # different lines are independent. A job's `concurrency` may read `needs`
  # outputs; a workflow-level one may not.
  #
  # Checks out THIS workflow's revision, not the tag: the guard reads the tag's
  # manifest with `git show` and needs no working tree, and the tag's own tree
  # predates the guard script.
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.guard.outputs.version }}
      major: ${{ steps.guard.outputs.major }}
      sha: ${{ steps.guard.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          # See `tooling_ref` above: the guard script has to come from this
          # workflow's own revision, not merely the caller's commit.
          ref: ${{ inputs.tooling_ref || github.sha }}
          fetch-tags: true
          # The newest-on-the-line check reads every tag on this major.
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve and guard tag
        id: guard
        env:
          TAG: ${{ inputs.tag }}
          FORCE: ${{ inputs.force }}
        run: bash .github/scripts/architect-archive-guard.sh

  deploy:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: architect-archive-v${{ needs.resolve.outputs.major }}
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      # Pinned: an archive deploy that silently changes shape between runs is
      # the failure this whole lane exists to avoid.
      WRANGLER_VERSION: '4.129.1'
    steps:
      # Application source, from the tag. This is the tree that gets built, so
      # the install resolves the lockfile that release actually shipped with.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      # Archive tooling, from THIS workflow's revision. Every release tagged
      # before this lane existed has no write-cloudflare-archive-config.mjs and
      # no guard script in its tree, so running them from the checked-out tag
      # would fail with MODULE_NOT_FOUND before the first archive could deploy.
      # Kept in a subdirectory so the tag's tree stays the workspace root and
      # every build path stays ordinary.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ inputs.tooling_ref || github.sha }}
          path: .archive-tooling
          fetch-tags: true
          fetch-depth: 0
          persist-credentials: false

      # Not redundant with `resolve`: this one runs while the concurrency lock
      # is held. A newer release on the same major line tagged in between would
      # otherwise let this older run publish last and roll the shared host back.
      - name: Re-check newest release on the line
        working-directory: .archive-tooling
        env:
          TAG: ${{ inputs.tag }}
          FORCE: ${{ inputs.force }}
        run: bash .github/scripts/architect-archive-guard.sh

      # Composite action taken from the tooling checkout for the same reason,
      # but its steps still run in the workspace root, so the install and cache
      # apply to the tag's tree.
      - uses: ./.archive-tooling/.github/actions/turbo-ci-setup

      - name: Build architect
        run: pnpm exec turbo run build --filter=@codaco/architect

      # After the build so a turbo-restored dist still describes the archived
      # commit. COMMIT_REF must be explicit: GITHUB_SHA is the commit the
      # workflow definition was read from, not the tag being archived. The
      # script takes its output directory as an argument precisely so a lane can
      # run a newer copy against an older tree — the hotfix lane does the same.
      - name: Stamp archived commit
        env:
          COMMIT_REF: ${{ needs.resolve.outputs.sha }}
        run: |
          node .archive-tooling/apps/architect/scripts/write-build-info.mjs \
            "${GITHUB_WORKSPACE}/apps/architect/dist"

      # Rewrites dist/_headers for Cloudflare's append semantics and drops the
      # Netlify _redirects file, then emits the Wrangler config naming this
      # line's Worker and custom domain. Fails loudly rather than shipping a
      # plausible-looking archive with the wrong cache headers.
      - name: Prepare Cloudflare archive config
        id: config
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          ZONE: ${{ inputs.zone }}
        run: |
          set -euo pipefail
          result="$(node .archive-tooling/apps/architect/scripts/write-cloudflare-archive-config.mjs \
            --version "$VERSION" --zone "$ZONE" \
            --dist "${GITHUB_WORKSPACE}/apps/architect/dist" \
            --out "${GITHUB_WORKSPACE}/apps/architect/wrangler.archive.json")"
          echo "$result"
          echo "hostname=$(echo "$result" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).hostname")" >>"$GITHUB_OUTPUT"

      - name: Deploy archive
        run: |
          set -euo pipefail
          pnpm dlx "wrangler@${WRANGLER_VERSION}" deploy \
            --config apps/architect/wrangler.archive.json

      # A deploy that reports success can still serve the wrong headers — that
      # is exactly how the Netlify sw.js override went unnoticed. Assert the
      # contract against the live host, and fail the run if it does not hold.
      - name: Verify deployed archive
        env:
          HOSTNAME: ${{ steps.config.outputs.hostname }}
        run: |
          set -euo pipefail
          base="https://${HOSTNAME}"

          # A custom domain created for the first time needs its certificate
          # before it answers, which for this two-label host took about three
          # minutes when measured. Poll rather than sleeping a guessed interval.
          for attempt in $(seq 1 30); do
            if curl -fsS -o /dev/null --max-time 10 "$base/"; then
              echo "reachable after ${attempt} attempt(s)"
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "::error::$base did not become reachable"
              exit 1
            fi
            sleep 10
          done

          fail() { echo "::error::$1"; exit 1; }

          header() {
            curl -fsSI --max-time 20 "$1" | tr -d '\r' \
              | awk 'tolower($1) == "cache-control:" { $1=""; sub(/^ /,""); print }'
          }

          # Content-hashed assets must be cacheable. This is the regression the
          # header transform exists for: with Netlify's file lifted unchanged,
          # Cloudflare joins `/*` and `/assets/*` into one header where
          # no-store wins and every asset becomes uncacheable.
          asset="$(find apps/architect/dist/assets -name '*.js' -type f -print -quit)"
          asset_cc="$(header "$base/assets/$(basename "$asset")")"
          echo "assets: $asset_cc"
          case "$asset_cc" in
            *no-store*) fail "asset carries no-store and is uncacheable: $asset_cc" ;;
          esac
          case "$asset_cc" in
            *immutable*) ;;
            *) fail "asset is not immutable: $asset_cc" ;;
          esac

          # The PWA entry points must not be stored, per RELEASING.md. This host
          # is replaced by later releases on the line, so a visitor holding the
          # previous shell has to revalidate to reach the newer one. Named
          # `entry` rather than `path`, which some shells bind to $PATH.
          for entry in / /sw.js /manifest.webmanifest; do
            cc="$(header "$base$entry")"
            echo "$entry: $cc"
            case "$cc" in
              *no-store*) ;;
              *) fail "$entry must be no-store, got: $cc" ;;
            esac
          done

          # The SPA fallback replaces Netlify's _redirects rule. Without it a
          # deep link 404s and the archive is unusable for shared links.
          code="$(curl -fsS -o /dev/null -w '%{http_code}' --max-time 20 "$base/some/deep/link" || true)"
          [ "$code" = "200" ] || fail "SPA deep link returned $code"

          echo "archive verified at $base"

      - name: Summary
        if: success()
        env:
          HOSTNAME: ${{ steps.config.outputs.hostname }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          {
            echo "### Architect ${VERSION} archived"
            echo
            echo "<https://${HOSTNAME}>"
          } >>"$GITHUB_STEP_SUMMARY"

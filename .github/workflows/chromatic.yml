name: Chromatic

# Visual review of a release, run only when someone asks for it.
#
# Chromatic captures the fresco-ui, Interview and Interviewer Storybooks
# against the head of the Version Packages PR (`changeset-release/main`), so
# the rendering changes of everything a release collects are reviewed once,
# after the release has settled, rather than on every pull request or every
# push. Start it from the release branch:
#
#   gh workflow run chromatic.yml --ref changeset-release/main
#
# A build with changes nobody has accepted fails. Accept or deny them in
# Chromatic, then run the workflow again: a commit whose build has been
# accepted is not captured again. The `version-packages-freshness` job in
# ci-and-release.yml refuses the release PR until this workflow has succeeded
# for its exact head.
#
# Baselines. The merge queue merges with a merge commit, so the head approved
# here becomes an ancestor of main, and every later release branch (which
# changesets regenerates from main) finds that build as its ancestor build.
# Chromatic also carries accepted baselines from the latest build on the same
# branch across the force-pushes that regenerate it, so a change accepted on
# one release head is not asked about again on the next. Nothing runs on main.
#
# TurboSnap compares each build with that ancestor build, so a project whose
# stories no release change can reach is bypassed at no cost, and a change
# reaches only the stories that import it. A change to anything a Storybook's
# preview imports, its config directory, or an `--externals` path still
# recaptures that whole project.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer request for the same branch supersedes an older one; only the
  # build for the branch's current head can satisfy the release check.
  group: chromatic-${{ github.ref_name }}
  cancel-in-progress: true

env:
  # One task at a time on every CI runner; see the `env` block and the `test`
  # job in ci-and-release.yml for the measurements behind the cap.
  TURBO_CONCURRENCY: '1'

jobs:
  release-branch:
    name: Confirm the release branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refuse any branch but the Version Packages branch
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          # Builds on other branches spend snapshots and set baselines that no
          # release check reads.
          if [[ "$REF_NAME" != 'changeset-release/main' ]]; then
            echo "::error::Chromatic runs only on changeset-release/main (requested: $REF_NAME). Run: gh workflow run chromatic.yml --ref changeset-release/main"
            exit 1
          fi

  fresco-ui:
    name: Fresco UI
    needs: release-branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/turbo-ci-setup
      - name: Build Storybook
        run: pnpm exec turbo run build-storybook --filter=@codaco/fresco-ui
      - name: Verify TurboSnap metadata
        run: test -s packages/fresco-ui/storybook-static/preview-stats.json
      - name: Run Chromatic
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN_FRESCO_UI }}
          CHROMATIC_SHA: ${{ github.sha }}
          CHROMATIC_BRANCH: ${{ github.ref_name }}
          CHROMATIC_SLUG: ${{ github.repository }}
        run: |
          pnpm --filter @codaco/fresco-ui chromatic \
            --skip-update-check --no-interactive \
            --log-file="$RUNNER_TEMP/chromatic-fresco-ui.log" \
            --diagnostics-file="$RUNNER_TEMP/chromatic-fresco-ui-diagnostics.json"
      - name: Confirm Chromatic tested the stories
        if: always()
        run: >-
          node scripts/ci/chromatic-observability.mjs
          fresco-ui
          "$RUNNER_TEMP/chromatic-fresco-ui.log"
      - name: Upload Chromatic diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chromatic-fresco-ui-${{ github.run_attempt }}
          path: ${{ runner.temp }}/chromatic-fresco-ui*
          if-no-files-found: ignore
          retention-days: 30

  interview:
    name: Interview
    needs: release-branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/turbo-ci-setup
      - name: Build Storybook
        run: pnpm exec turbo run build-storybook --filter=@codaco/interview
      - name: Verify TurboSnap metadata
        run: test -s packages/interview/storybook-static/preview-stats.json
      - name: Run Chromatic
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN_INTERVIEW }}
          CHROMATIC_SHA: ${{ github.sha }}
          CHROMATIC_BRANCH: ${{ github.ref_name }}
          CHROMATIC_SLUG: ${{ github.repository }}
        run: |
          pnpm --filter @codaco/interview chromatic \
            --skip-update-check --no-interactive \
            --log-file="$RUNNER_TEMP/chromatic-interview.log" \
            --diagnostics-file="$RUNNER_TEMP/chromatic-interview-diagnostics.json"
      - name: Confirm Chromatic tested the stories
        if: always()
        run: >-
          node scripts/ci/chromatic-observability.mjs
          interview
          "$RUNNER_TEMP/chromatic-interview.log"
      - name: Upload Chromatic diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chromatic-interview-${{ github.run_attempt }}
          path: ${{ runner.temp }}/chromatic-interview*
          if-no-files-found: ignore
          retention-days: 30

  interviewer:
    name: Interviewer
    needs: release-branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/turbo-ci-setup
      - name: Build Storybook
        run: pnpm exec turbo run build-storybook --filter=@codaco/interviewer
      - name: Verify TurboSnap metadata
        run: test -s apps/interviewer/storybook-static/preview-stats.json
      - name: Run Chromatic
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN_INTERVIEWER }}
          CHROMATIC_SHA: ${{ github.sha }}
          CHROMATIC_BRANCH: ${{ github.ref_name }}
          CHROMATIC_SLUG: ${{ github.repository }}
        run: |
          pnpm --filter @codaco/interviewer chromatic \
            --skip-update-check --no-interactive \
            --log-file="$RUNNER_TEMP/chromatic-interviewer.log" \
            --diagnostics-file="$RUNNER_TEMP/chromatic-interviewer-diagnostics.json"
      - name: Confirm Chromatic tested the stories
        if: always()
        run: >-
          node scripts/ci/chromatic-observability.mjs
          interviewer
          "$RUNNER_TEMP/chromatic-interviewer.log"
      - name: Upload Chromatic diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chromatic-interviewer-${{ github.run_attempt }}
          path: ${{ runner.temp }}/chromatic-interviewer*
          if-no-files-found: ignore
          retention-days: 30

  # The release PR's `quality` check read the review before it existed, so
  # re-run the failed jobs of its CI run for this head; the review step then
  # finds this successful run. A CI run still in progress reads it itself.
  refresh-release-check:
    name: Refresh the release PR's check
    needs: [fresco-ui, interview, interviewer]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Re-run the release PR's failed CI jobs
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          run_id=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci-and-release.yml/runs?event=pull_request&head_sha=${HEAD_SHA}&per_page=1" \
            --jq '.workflow_runs[0] | select(.status == "completed" and .conclusion == "failure") | .id')
          if [[ -z "$run_id" ]]; then
            echo "No completed, failed CI run for $HEAD_SHA; nothing to re-run"
            exit 0
          fi
          gh run rerun "$run_id" --failed --repo "$GITHUB_REPOSITORY"
          echo "Re-ran the failed jobs of CI run $run_id"

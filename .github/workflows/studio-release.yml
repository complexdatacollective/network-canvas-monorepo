name: Studio distribution release

on:
  workflow_dispatch:
    inputs:
      oldest_supported_source:
        description: Oldest authenticated distribution source still supported (optional for fewer than 21 releases)
        required: false
        type: string

concurrency:
  group: studio-distribution-release
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    if: github.repository == 'complexdatacollective/network-canvas-monorepo' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      actions: read
      contents: write
      id-token: write
      packages: write
    steps:
      - name: Check out the exact reviewed main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          install: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          cache: pnpm
          node-version-file: .nvmrc
      - name: Install locked workspace dependencies without package scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install the pinned arm64 emulator
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          cache-image: false
          image: tonistiigi/binfmt:qemu-v10.0.4-56@sha256:30cc9a4d03765acac9be2ed0afc23af1ad018aed2c28ea4be8c2eb9afe03fbd1
          platforms: arm64
      - name: Install the pinned multi-platform builder
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: v0.36.1
          driver-opts: image=moby/buildkit:v0.30.0@sha256:0168606be2315b7c807a03b3d8aa79beefdb31c98740cebdffdfeebf31190c9f
      - name: Authenticate the controlled image repositories
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Qualify and publish the exact distribution
        env:
          GH_TOKEN: ${{ github.token }}
          STUDIO_OLDEST_SUPPORTED_SOURCE: ${{ inputs.oldest_supported_source }}
        run: node scripts/studio-distribution-release.mjs
      - name: Remove registry credentials
        if: always()
        run: docker logout ghcr.io

name: Regenerate E2E Visual Snapshots

on:
  workflow_call:
    inputs:
      suite:
        description: Visual snapshot suite to regenerate
        required: true
        type: string
      mode:
        description: Regenerate snapshots or stress the Geospatial visual capture
        required: false
        type: string
        default: regenerate
      browser:
        description: Browser to use for a Geospatial stress run
        required: false
        type: string
        default: all
      iterations:
        description: Number of retry-free Geospatial stress iterations per browser
        required: false
        type: number
        default: 10
  workflow_dispatch:
    inputs:
      suite:
        description: Visual snapshot suite
        required: true
        type: choice
        options:
          - architect
          - interview
          - interviewer
      mode:
        description: Operation to run
        required: true
        type: choice
        default: regenerate
        options:
          - regenerate
          - geospatial-stress
      browser:
        description: Browser for Geospatial stress runs
        required: true
        type: choice
        default: all
        options:
          - all
          - chromium
          - firefox
          - webkit
      iterations:
        description: Retry-free Geospatial iterations per browser
        required: true
        type: choice
        default: '10'
        options:
          - '5'
          - '10'
          - '20'

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Validate Geospatial stress inputs
        if: inputs.mode == 'geospatial-stress'
        env:
          SUITE: ${{ inputs.suite }}
        run: |
          if [[ "$SUITE" != "interview" ]]; then
            echo "::error::Geospatial stress mode requires the interview suite."
            exit 1
          fi

      - name: Regenerate Architect visual snapshots
        if: inputs.mode == 'regenerate' && inputs.suite == 'architect'
        run: ./apps/architect/e2e/scripts/run.sh --grep @visual --update-snapshots

      - name: Regenerate Interview visual snapshots
        if: inputs.mode == 'regenerate' && inputs.suite == 'interview'
        env:
          PW_WORKERS: 4
        run: >-
          ./packages/interview/e2e/scripts/run.sh
          --project=chromium-visual
          --project=firefox-visual
          --project=webkit-visual
          --update-snapshots

      - name: Regenerate Interviewer visual snapshots
        if: inputs.mode == 'regenerate' && inputs.suite == 'interviewer'
        run: ./apps/interviewer/e2e/scripts/run.sh --grep @visual --update-snapshots

      - name: Establish current-render Geospatial baseline
        if: inputs.mode == 'geospatial-stress'
        env:
          BROWSER: ${{ inputs.browser }}
          PW_WORKERS: 1
        run: |
          projects=()
          if [[ "$BROWSER" == "all" ]]; then
            projects=(
              --project=chromium-visual
              --project=firefox-visual
              --project=webkit-visual
            )
          else
            projects=("--project=$BROWSER-visual")
          fi
          ./packages/interview/e2e/scripts/run.sh \
            "${projects[@]}" \
            --grep '^visual Geospatial: core-click-select-and-prompt-panel$' \
            --workers=1 \
            --retries=0 \
            --update-snapshots

      - name: Stress Geospatial visual capture
        if: inputs.mode == 'geospatial-stress'
        env:
          BROWSER: ${{ inputs.browser }}
          E2E_VISUAL_DEBUG: geospatial
          ITERATIONS: ${{ inputs.iterations }}
          PW_WORKERS: 1
        run: |
          projects=()
          if [[ "$BROWSER" == "all" ]]; then
            projects=(
              --project=chromium-visual
              --project=firefox-visual
              --project=webkit-visual
            )
          else
            projects=("--project=$BROWSER-visual")
          fi
          ./packages/interview/e2e/scripts/run.sh \
            "${projects[@]}" \
            --grep '^visual Geospatial: core-click-select-and-prompt-panel$' \
            --workers=1 \
            --retries=0 \
            --repeat-each="$ITERATIONS"

      - name: Reclaim snapshot ownership
        if: always()
        run: |
          sudo chown -R "$(id -u):$(id -g)" \
            apps/architect/e2e/visual-snapshots \
            packages/interview/e2e/visual-snapshots \
            apps/interviewer/e2e/visual-snapshots 2>/dev/null || true

      - name: Stage canonical snapshot paths
        if: inputs.mode == 'regenerate'
        env:
          ARTIFACT_ROOT: ${{ runner.temp }}/snapshot-candidate
          SUITE: ${{ inputs.suite }}
        run: |
          case "$SUITE" in
            architect)
              parent=apps/architect/e2e/visual-snapshots
              mkdir -p "$ARTIFACT_ROOT/$parent/chromium"
              cp "$parent/chromium/"*.png "$ARTIFACT_ROOT/$parent/chromium/"
              ;;
            interview)
              parent=packages/interview/e2e/visual-snapshots
              for browser in chromium firefox webkit; do
                directory="$browser-matrix"
                mkdir -p "$ARTIFACT_ROOT/$parent/$directory"
                cp "$parent/$directory/"*.png "$ARTIFACT_ROOT/$parent/$directory/"
              done
              ;;
            interviewer)
              parent=apps/interviewer/e2e/visual-snapshots
              mkdir -p "$ARTIFACT_ROOT/$parent/chromium"
              cp "$parent/chromium/"*.png "$ARTIFACT_ROOT/$parent/chromium/"
              ;;
            *)
              echo "::error::unsupported snapshot suite '$SUITE'"
              exit 1
              ;;
          esac

      - name: Upload visual snapshots
        if: inputs.mode == 'regenerate'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-visual-snapshots-${{ inputs.suite }}
          path: ${{ runner.temp }}/snapshot-candidate/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload Geospatial stress diagnostics
        if: always() && inputs.mode == 'geospatial-stress'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: geospatial-visual-stress-${{ inputs.browser }}
          path: |
            packages/interview/e2e/playwright-report/
            packages/interview/e2e/test-results/
            packages/interview/e2e/visual-snapshots/*-matrix/matrix-visual-visual-geospatial-core-click-select-and-prompt-panel-stage-0*.png
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0

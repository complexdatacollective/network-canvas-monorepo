name: Regenerate E2E Visual Snapshots

on:
  workflow_call:
    inputs:
      suite:
        description: Visual snapshot suite to regenerate
        required: true
        type: string
  workflow_dispatch:
    inputs:
      suite:
        description: Visual snapshot suite to regenerate
        required: true
        type: choice
        options:
          - architect
          - interview
          - interviewer

permissions:
  contents: read

jobs:
  regenerate:
    # This runner is the source of truth for every committed pixel baseline.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/native-playwright-setup
        if: inputs.suite == 'architect'
        with:
          package: '@codaco/architect'
          browsers: chromium

      - uses: ./.github/actions/native-playwright-setup
        if: inputs.suite == 'interview'
        with:
          package: '@codaco/interview'
          browsers: chromium firefox webkit

      - uses: ./.github/actions/native-playwright-setup
        if: inputs.suite == 'interviewer'
        with:
          package: '@codaco/interviewer'
          browsers: chromium

      - name: Regenerate Architect visual snapshots
        if: inputs.suite == 'architect'
        run: >-
          ./scripts/run-e2e-native.sh architect
          --grep @visual
          --update-snapshots=all

      - name: Regenerate Interview visual snapshots
        if: inputs.suite == 'interview'
        env:
          PW_WORKERS: 4
        run: >-
          ./scripts/run-e2e-native.sh interview
          --project=chromium-visual
          --project=firefox-visual
          --project=webkit-visual
          --update-snapshots=all

      - name: Regenerate Interviewer visual snapshots
        if: inputs.suite == 'interviewer'
        run: >-
          ./scripts/run-e2e-native.sh interviewer
          --grep @visual
          --update-snapshots=all

      - name: Stage canonical snapshot paths
        env:
          ARTIFACT_ROOT: ${{ runner.temp }}/snapshot-candidate
          SUITE: ${{ inputs.suite }}
        run: |
          case "$SUITE" in
            architect)
              parent=apps/architect/e2e/visual-snapshots
              mkdir -p "$ARTIFACT_ROOT/$parent/chromium"
              cp "$parent/chromium/"*.png "$ARTIFACT_ROOT/$parent/chromium/"
              ;;
            interview)
              parent=packages/interview/e2e/visual-snapshots
              for browser in chromium firefox webkit; do
                directory="$browser-matrix"
                mkdir -p "$ARTIFACT_ROOT/$parent/$directory"
                cp "$parent/$directory/"*.png "$ARTIFACT_ROOT/$parent/$directory/"
              done
              ;;
            interviewer)
              parent=apps/interviewer/e2e/visual-snapshots
              mkdir -p "$ARTIFACT_ROOT/$parent/chromium"
              cp "$parent/chromium/"*.png "$ARTIFACT_ROOT/$parent/chromium/"
              ;;
            *)
              echo "::error::unsupported snapshot suite '$SUITE'"
              exit 1
              ;;
          esac

      - name: Upload visual snapshots
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-visual-snapshots-${{ inputs.suite }}
          path: ${{ runner.temp }}/snapshot-candidate/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

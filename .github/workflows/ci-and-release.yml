name: CI and Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Force package-scoped conditional checks to run regardless of change detection.'
        type: boolean
        default: false
      interview_e2e_benchmark:
        description: 'Run only Interview E2E for controlled runner, worker, or shard measurements.'
        type: boolean
        default: false
      interview_e2e_runner:
        description: 'Runner class for an Interview E2E benchmark. Normal CI uses automatic routing.'
        type: choice
        default: auto
        options:
          - auto
          - github-hosted
          - self-hosted
      interview_e2e_workers:
        description: 'Playwright workers for an Interview E2E benchmark; 0 uses the runner default.'
        type: number
        default: 0
      interview_e2e_shard:
        description: 'Optional Playwright shard for a benchmark, such as 1/2.'
        type: string
        default: ''
      release_app:
        description: 'Force a legacy desktop app release (Architect/Interviewer) at the version currently in package.json, regardless of version-bump detection.'
        type: choice
        default: none
        options:
          - none
          - architect
          - interviewer
          - both

permissions:
  contents: read
  packages: read
  actions: read
  checks: write
  pull-requests: write

# PR runs are grouped per ref so a new push cancels the previous run for that
# branch. Push-to-main runs get a per-commit group instead: main pushes must
# never cancel each other, or a release-carrying run (the merge of a generated
# release PR) can be evicted while queued during a burst of merges and the release
# is silently lost. See .github/scripts/detect-app-release.sh for the self-healing
# safety net if a release run is dropped anyway.
concurrency:
  # Benchmark dispatches get an independent group so hosted shards can run in
  # parallel. Normal runs retain per-ref supersession semantics.
  group: ci-${{ (github.event_name == 'workflow_dispatch' && inputs.interview_e2e_benchmark == true && github.run_id) || github.ref }}${{ github.event_name == 'push' && format('-{0}', github.sha) || '' }}
  # Cancel every superseded PR run, including generated release PRs. Only the
  # current head's required `quality` aggregate matters, and its replacement run
  # will report that check. A release-branch dispatch also targets a concrete
  # branch head, so a newer dispatch can safely replace an obsolete one.
  cancel-in-progress: >-
    ${{ github.event_name == 'pull_request'
    || (github.event_name == 'workflow_dispatch'
    && (startsWith(github.ref_name, 'changeset-release/')
    || github.ref_name == 'e2e-snapshots/main')) }}

jobs:
  # Skipped on push: its only consumers (site preview checks, the quality
  # aggregate, carry-forward-statuses) never run on push-to-main.
  detect:
    if: >-
      github.event_name != 'merge_group'
      && github.event_name != 'push'
      && !(github.event_name == 'workflow_dispatch'
      && inputs.interview_e2e_benchmark == true)
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.flags.outputs.docs }}
      website: ${{ steps.flags.outputs.website }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: '.nvmrc'
      - id: flags
        env:
          # Manual runs may set force_run=true to bypass package change
          # detection (replaces the old per-workflow rerun buttons).
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.force_run == true }}
          EVENT_ACTION: ${{ github.event.action }}
        run: |
          # Determine the comparison base — the commit range whose diff decides
          # which conditional jobs run. We DON'T use turbo-ignore because it
          # includes global config (turbo.json, lockfile, root configs) in its
          # hash, so any unrelated workflow tweak invalidates every package's
          # hash.
          #
          # PR semantics depend on the event action:
          #   - opened / reopened: no prior verdicts exist on this PR (or, for
          #     reopened, they may describe a stale base), so judge the
          #     CUMULATIVE PR diff — merge-base with the base branch to the PR
          #     tip. The tip's parent is NOT a safe stand-in: it only equals
          #     the base HEAD for single-commit branches, and a branch pushed
          #     with its commits already stacked would be judged on its tip
          #     commit alone (PR #890: a changeset-only tip skipped the
          #     architect preview on an architect-wide PR).
          #   - synchronize (subsequent pushes): push-to-push — diff only the
          #     latest push (prior branch commit → new tip) so only impacted
          #     jobs re-run; jobs that already ran keep their prior status via
          #     the carry-forward job below.
          #
          # GH Actions checks out a synthetic merge commit on PRs; HEAD^2 is
          # the actual PR tip.
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            CURR=$(git rev-parse HEAD^2 2>/dev/null || git rev-parse HEAD)
            if [[ "$EVENT_ACTION" == "synchronize" ]]; then
              PREV=$(git rev-parse "${CURR}^1" 2>/dev/null || true)
            else
              PREV=$(git merge-base "$CURR" "origin/${GITHUB_BASE_REF}" 2>/dev/null || true)
            fi
          else
            CURR=$(git rev-parse HEAD)
            PREV=$(git rev-parse HEAD^1 2>/dev/null || true)
          fi
          echo "comparing $PREV..$CURR (event action: ${EVENT_ACTION:-n/a})"

          # A change to this CI workflow itself can alter how any conditional job
          # behaves or whether it passes, so a prior run's verdict no longer
          # describes the new code. Treat a workflow change like FORCE_RUN for
          # package-scoped conditional jobs (E2E is release-gated separately), so
          # the carry-forward job below carries nothing stale forward for it.
          # Without this, a workflow-only commit leaves every package flag false
          # and republishes now-irrelevant prior verdicts against the new SHA.
          WORKFLOW_CHANGED=false
          if [[ -n "$PREV" ]] && ! git diff --quiet "$PREV" "$CURR" -- .github/workflows/ci-and-release.yml; then
            WORKFLOW_CHANGED=true
            echo "CI workflow changed in $PREV..$CURR — forcing all conditional jobs to run."
          fi

          # flag <package>: true if any file in the package's workspace dep
          # tree changed between PREV and CURR, false otherwise.
          flag() {
            local pkg=$1
            if [[ "$FORCE_RUN" == "true" || "$WORKFLOW_CHANGED" == "true" ]]; then
              echo true; return
            fi
            # First commit on a branch (no parent reachable) — be conservative
            # and run everything.
            if [[ -z "$PREV" ]]; then
              echo true; return
            fi
            local paths
            paths=$(npx --yes turbo@2.9.6 ls --filter="${pkg}..." --output=json 2>/dev/null \
              | jq -r '.packages.items[].path')
            local pathspec=()
            while IFS= read -r p; do
              [[ -n "$p" ]] && pathspec+=("$p")
            done <<<"$paths"
            if git diff --quiet "$PREV" "$CURR" -- "${pathspec[@]}"; then
              echo false
            else
              echo true
            fi
          }
          docs=$(flag @codaco/documentation)
          website=$(flag networkcanvas.com)

          # Either public site can contain inbound links to routes owned by the
          # other. Crawl both paired previews whenever either site changes so a
          # removed route cannot escape the link check on the unchanged peer.
          if [[ "$docs" == "true" || "$website" == "true" ]]; then
            docs=true
            website=true
          fi

          echo "docs=$docs" >> "$GITHUB_OUTPUT"
          echo "website=$website" >> "$GITHUB_OUTPUT"

  # Decides per suite whether E2E must run for this ref. Feature PRs select the
  # suites whose subject package or workspace dependency closure changed.
  # Release lanes select the suites whose subjects ship in their deploy, while
  # release-PR refreshes may reuse an equivalent earlier verdict. Merge groups
  # deliberately skip the policy and all E2E work. Every path and history guard
  # fails closed; see
  # scripts/release-e2e-policy.mjs.
  e2e-policy:
    if: >-
      github.event_name != 'merge_group'
      && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      interview: ${{ steps.policy.outputs.interview }}
      interviewer: ${{ steps.policy.outputs.interviewer }}
      architect: ${{ steps.policy.outputs.architect }}
      release_ref: ${{ steps.policy.outputs.release_ref }}
      snapshot_branch: ${{ steps.policy.outputs.snapshot_branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          # Feature-PR selection, app-lane selection, and cross-branch
          # equivalence all compare commits, so every policy run needs full
          # history.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: '.nvmrc'
      - name: Determine which E2E suites this ref requires
        id: policy
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          REF_NAME: ${{ github.ref_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # On feature PRs, BASE_SHA and HEAD_SHA define the cumulative
          # merge-base diff. On release PRs, HEAD_SHA is also the branch tip
          # equivalence reuse compares with prior validated runs. HEAD_REPO
          # guards reuse off for fork PRs.
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BENCHMARK_INTERVIEW_E2E: ${{ github.event_name == 'workflow_dispatch' && inputs.interview_e2e_benchmark == true }}
          # Read-only, feeds release-PR equivalence lookups.
          GH_TOKEN: ${{ github.token }}
        run: |
          policy=$(node scripts/release-e2e-policy.mjs)
          if [[ "$BENCHMARK_INTERVIEW_E2E" == "true" ]]; then
            policy=$(jq \
              '.interview = true
              | .interviewer = false
              | .architect = false
              | .releaseRef = ""
              | .snapshotBranch = ""' <<< "$policy")
          fi
          echo "E2E policy: $policy"
          {
            echo "interview=$(jq -r '.interview' <<< "$policy")"
            echo "interviewer=$(jq -r '.interviewer' <<< "$policy")"
            echo "architect=$(jq -r '.architect' <<< "$policy")"
            echo "release_ref=$(jq -r '.releaseRef' <<< "$policy")"
            echo "snapshot_branch=$(jq -r '.snapshotBranch' <<< "$policy")"
          } >> "$GITHUB_OUTPUT"

  # Route the longest E2E suite. The single-slot private runner is reserved for
  # the normal Changesets release lane, where Interview runs alongside hosted
  # Architect and Interviewer suites.
  # The availability check requires online AND idle; `runs-on` has no native
  # fallback after a job has been queued.
  #
  # Listing self-hosted runners needs `administration:read`, which GITHUB_TOKEN
  # cannot hold, so the check uses the E2E_RUNNER_STATUS_TOKEN secret (a
  # fine-grained PAT, Administration:read on this repo only). Every failure
  # mode degrades to GitHub-hosted: secret missing, API error, runner offline.
  # Fork PRs cannot read secrets, so outside contributions always land on
  # GitHub-hosted runners and never execute on the self-hosted machine.
  pick-e2e-runner:
    needs: e2e-policy
    if: ${{ !cancelled() && needs.e2e-policy.outputs.interview == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      runs_on: ${{ steps.pick.outputs.runs_on }}
      pw_workers: ${{ steps.pick.outputs.pw_workers }}
      runner_class: ${{ steps.pick.outputs.runner_class }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ secrets.E2E_RUNNER_STATUS_TOKEN }}
          RELEASE_REF: ${{ needs.e2e-policy.outputs.release_ref }}
          RUNNER_OVERRIDE: ${{ github.event_name == 'workflow_dispatch' && inputs.interview_e2e_benchmark == true && inputs.interview_e2e_runner || 'auto' }}
          WORKER_OVERRIDE: ${{ github.event_name == 'workflow_dispatch' && inputs.interview_e2e_benchmark == true && inputs.interview_e2e_workers || 0 }}
        run: |
          runs_on='"ubuntu-latest"'
          pw_workers=4
          runner_class=github-hosted

          # Normal automatic routing gives only the normal Changesets lane
          # access to the private runner. A benchmark may explicitly select
          # either class.
          private_eligible=false
          if [[ "$RUNNER_OVERRIDE" == "self-hosted" ]]; then
            private_eligible=true
          elif [[ "$RUNNER_OVERRIDE" == "auto" && "$RELEASE_REF" == "changeset-release/main" ]]; then
            private_eligible=true
          fi

          if [[ "$RUNNER_OVERRIDE" == "self-hosted" && -z "$GH_TOKEN" ]]; then
            echo "::error::The self-hosted benchmark requires E2E_RUNNER_STATUS_TOKEN"
            exit 1
          fi

          if [[ "$private_eligible" == "true" && -n "$GH_TOKEN" ]]; then
            idle=$(curl -sf --max-time 30 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runners?per_page=100" \
              | jq '[.runners[] | select(
                  .status == "online"
                  and .busy == false
                  and ([.labels[].name] | index("e2e"))
                )] | length' \
              || echo 0)
            if [[ "${idle:-0}" -gt 0 ]]; then
              runs_on='["self-hosted", "e2e"]'
              pw_workers=6
              runner_class=self-hosted
            elif [[ "$RUNNER_OVERRIDE" == "self-hosted" ]]; then
              echo "::error::The forced self-hosted benchmark runner is not online and idle"
              exit 1
            fi
          fi

          if [[ "$WORKER_OVERRIDE" =~ ^[1-9][0-9]*$ ]]; then
            pw_workers=$WORKER_OVERRIDE
          fi
          echo "picked runs-on: $runs_on (class=$runner_class, PW_WORKERS=$pw_workers)"
          {
            echo "runs_on=$runs_on"
            echo "pw_workers=$pw_workers"
            echo "runner_class=$runner_class"
          } >> "$GITHUB_OUTPUT"

  # pick-e2e-runner snapshots availability once, but interview-e2e is scheduled
  # later — if the self-hosted runner dies in between (or while the job queues
  # behind another run's job on the single-slot runner), the queued job would
  # sit against dead labels for GitHub's 24h backstop, blocking the `quality`
  # gate. This watchdog polls the run's own interview-e2e job:
  # queued-while-runner-ONLINE is normal (busy runner) and waits;
  # queued-while-runner-OFFLINE for 5 consecutive checks cancels the run with a
  # clear error — a rerun re-picks and falls back to GitHub-hosted. Only
  # spawned when self-hosted was picked, which implies E2E_RUNNER_STATUS_TOKEN
  # existed for pick-e2e-runner. continue-on-error: this job must never redden
  # CI by itself; its only lever is the cancel.
  e2e-queue-watchdog:
    needs: [e2e-policy, pick-e2e-runner]
    if: >-
      ${{ !cancelled() && needs.e2e-policy.outputs.interview == 'true'
      && needs.pick-e2e-runner.result == 'success'
      && contains(needs.pick-e2e-runner.outputs.runs_on, 'self-hosted') }}
    runs-on: ubuntu-latest
    # Outlive the 45-minute suite plus queueing behind other runs sharing the
    # runner. Past this, GitHub's 24h queued-job limit is the backstop.
    # Watchdog minutes are free on a public repo.
    timeout-minutes: 355
    continue-on-error: true
    permissions:
      actions: write
    steps:
      - name: Cancel the run if interview-e2e is queued against a dead runner
        env:
          GH_TOKEN: ${{ github.token }}
          ADMIN_TOKEN: ${{ secrets.E2E_RUNNER_STATUS_TOKEN }}
        run: |
          strikes=0
          while true; do
            sleep 60
            jobs=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs?per_page=100" \
              --jq '[.jobs[] | select(.name == "interview-e2e")]') || continue
            total=$(jq 'length' <<< "$jobs")
            completed=$(jq '[.[] | select(.status == "completed")] | length' <<< "$jobs")
            queued=$(jq '[.[] | select(.status == "queued")] | length' <<< "$jobs")
            if [ "$total" -gt 0 ] && [ "$completed" -eq "$total" ]; then
              echo "interview-e2e completed — watchdog done"
              exit 0
            fi
            if [ "$queued" -eq 0 ]; then
              strikes=0
              continue
            fi
            online=$(curl -sf --max-time 30 \
              -H "Authorization: Bearer $ADMIN_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runners?per_page=100" \
              | jq '[.runners[] | select(.status == "online" and ([.labels[].name] | index("e2e")))] | length' \
              || echo "")
            # Unknown status (API hiccup) is not evidence the runner is dead —
            # never cancel on a blind guess.
            if [ -z "$online" ] || [ "$online" -gt 0 ]; then
              strikes=0
              continue
            fi
            strikes=$((strikes + 1))
            echo "$queued e2e job(s) queued with no online 'e2e' runner (strike ${strikes}/5)"
            if [ "$strikes" -ge 5 ]; then
              echo "::error::Self-hosted e2e runner went offline with e2e jobs still queued. Cancelling this run — rerun it to fall back to GitHub-hosted runners."
              gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/cancel"
              exit 1
            fi
          done

  # Cache design: turbo-ci-setup runs a runner-local server speaking turbo's
  # remote-cache protocol, backed by the GitHub Actions Cache with per-task,
  # hash-addressed entries. Per-package env values (NEXT_PUBLIC_*, VITE_*) are
  # part of each build task's `env:` list in turbo.json so they participate in
  # the cache key. The lockfile is deliberately NOT in turbo.json's
  # `globalDependencies`: turbo hashes each package's resolved dependencies
  # (including pnpm catalog entries) granularly, so a dependency bump only
  # invalidates the packages that use it — listing pnpm-lock.yaml globally
  # would invalidate every task on every bump.
  #
  # GitHub's cache is branch-scoped: PR runs can restore main's entries plus
  # their own branch's, and the quality jobs skip `push` — so without the
  # `seed-turbo-cache` job below, main's tree would never have cache entries and
  # every run after a merge would re-run everything that merge changed.
  #
  # `quality` is an aggregate over three independent runners: lint, tests, and
  # a support runner that amortises setup across knip, changesets, script tests,
  # package builds, and typechecking. Workspace packages are consumed as raw
  # `src` (exports point at source), so typecheck/test/lint resolve dependency
  # types directly and do not need built `.d.ts`. This seed job still runs
  # `build` explicitly so the release and app-deploy jobs find a warm `build`
  # cache on main.
  seed-turbo-cache:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Cache warming only — a flake here must not fail the push run, which also
    # carries the release jobs.
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/turbo-ci-setup
      - name: Write protocol-validation .env (test fixture)
        env:
          PROTOCOL_ENCRYPTION_KEY: ${{ secrets.PROTOCOL_ENCRYPTION_KEY }}
          PROTOCOL_ENCRYPTION_IV: ${{ secrets.PROTOCOL_ENCRYPTION_IV }}
          TEST_PROTOCOL_TOKEN: ${{ secrets.TEST_PROTOCOL_TOKEN }}
        run: |
          {
            echo "PROTOCOL_ENCRYPTION_KEY=$PROTOCOL_ENCRYPTION_KEY"
            echo "PROTOCOL_ENCRYPTION_IV=$PROTOCOL_ENCRYPTION_IV"
            echo "GITHUB_TOKEN=$TEST_PROTOCOL_TOKEN"
          } > packages/protocol-validation/.env
      # Fresco's `build` script is a bare `next build`, whose env.js validates
      # the full deployment env at config load; this job has no Fresco
      # deployment secrets. The variable reaches the task through
      # `fresco#build`'s `passThroughEnv` (strict env mode strips undeclared
      # variables), which keeps it out of the task hash so the seeded cache
      # stays valid for runs that don't set it.
      - run: pnpm exec turbo run build test typecheck
        env:
          SKIP_ENV_VALIDATION: 'true'

  lint:
    if: >-
      github.event_name != 'merge_group'
      && github.event_name != 'push'
      && !(github.event_name == 'workflow_dispatch'
      && inputs.interview_e2e_benchmark == true)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
          # Pull requests lint only changed files against their synthetic
          # merge commit's base parent.
          fetch-depth: 0
      - uses: ./.github/actions/turbo-ci-setup
      # oxlint-tsgolint's type-aware rules resolve workspace types directly from
      # each package's `src` (exports point at source), so no built `.d.ts` is
      # needed and the job runs without a prior package build. Fresco is the one
      # exception: its Prisma client and Next type declarations are generated
      # and gitignored, and the install above runs with --ignore-scripts, so
      # without this its queries lint as untyped. The PR path below calls oxlint directly rather than through
      # turbo, so the task cannot be reached as a dependency.
      - name: Generate Fresco's Prisma client and Next types
        run: pnpm exec turbo run fresco#codegen
      - name: Lint and check formatting
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            pnpm lint:changed HEAD^1
          else
            pnpm exec turbo run //#lint
          fi

  # These checks are individually short and cache-heavy. Keeping them on one
  # runner avoids five duplicate checkout/install/cache-server sequences while
  # lint and test remain independent jobs on the critical path.
  quality-support:
    if: >-
      github.event_name != 'merge_group'
      && github.event_name != 'push'
      && !(github.event_name == 'workflow_dispatch'
      && inputs.interview_e2e_benchmark == true)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/turbo-ci-setup
      - name: Check unused files, exports, and dependencies
        id: knip
        continue-on-error: true
        run: pnpm exec turbo run //#knip
      - name: Check changeset release-lane isolation
        id: changesets
        continue-on-error: true
        run: pnpm check:changesets
      - name: Test repository scripts
        id: scripts
        continue-on-error: true
        run: pnpm test:scripts
      - name: Build shared packages
        id: build
        continue-on-error: true
        run: pnpm exec turbo run build --filter='./packages/*'
      - name: Typecheck workspaces
        id: typecheck
        continue-on-error: true
        run: pnpm exec turbo run typecheck
      - name: Verify support checks passed
        if: always()
        env:
          KNIP_OUTCOME: ${{ steps.knip.outcome }}
          CHANGESETS_OUTCOME: ${{ steps.changesets.outcome }}
          SCRIPTS_OUTCOME: ${{ steps.scripts.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
        run: |
          failed=false
          for result in \
            "knip=$KNIP_OUTCOME" \
            "changesets=$CHANGESETS_OUTCOME" \
            "scripts=$SCRIPTS_OUTCOME" \
            "build=$BUILD_OUTCOME" \
            "typecheck=$TYPECHECK_OUTCOME"; do
            echo "$result"
            if [[ "${result#*=}" != "success" ]]; then
              failed=true
            fi
          done
          if [[ "$failed" == "true" ]]; then
            echo "::error::One or more quality support checks failed"
            exit 1
          fi

  test:
    if: >-
      github.event_name != 'merge_group'
      && github.event_name != 'push'
      && !(github.event_name == 'workflow_dispatch'
      && inputs.interview_e2e_benchmark == true)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
          # `--affected` diffs against the PR base; on a shallow clone turbo
          # treats every package as changed.
          fetch-depth: 0
      - uses: ./.github/actions/turbo-ci-setup
      - name: Write protocol-validation .env (test fixture)
        env:
          PROTOCOL_ENCRYPTION_KEY: ${{ secrets.PROTOCOL_ENCRYPTION_KEY }}
          PROTOCOL_ENCRYPTION_IV: ${{ secrets.PROTOCOL_ENCRYPTION_IV }}
          TEST_PROTOCOL_TOKEN: ${{ secrets.TEST_PROTOCOL_TOKEN }}
        run: |
          {
            echo "PROTOCOL_ENCRYPTION_KEY=$PROTOCOL_ENCRYPTION_KEY"
            echo "PROTOCOL_ENCRYPTION_IV=$PROTOCOL_ENCRYPTION_IV"
            echo "GITHUB_TOKEN=$TEST_PROTOCOL_TOKEN"
          } > packages/protocol-validation/.env
      - name: Run tests (PRs run only affected tasks)
        env:
          DIFF_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # PR checkouts are synthetic merges. Diff against the event's base
          # SHA, then use --affected to scope the run to tasks whose declared
          # inputs the diff touches, plus their dependents (turbo.json enables
          # affectedUsingTaskInputs so selection matches what cache hashing
          # considers an input).
          #
          # Fail closed: a change outside the workspace package trees (this
          # workflow, composite actions, .nvmrc, pnpm-workspace.yaml, root
          # configs/scripts) can alter how tests run without being any turbo
          # task's input, so any such change forces the full suite. The
          # lockfile stays on the affected path because turbo hashes it
          # granularly per package; docs, changesets, and markdown are inert
          # to tests.
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]] \
            && [[ -n "$DIFF_BASE_SHA" ]] \
            && git cat-file -e "$DIFF_BASE_SHA^{commit}" \
            && git diff --quiet "$DIFF_BASE_SHA" HEAD -- . \
              ':(exclude)packages' ':(exclude)apps' ':(exclude)workers' \
              ':(exclude)tooling' ':(exclude)docs' ':(exclude).changeset' \
              ':(exclude)pnpm-lock.yaml' ':(exclude)*.md'; then
            echo "Running test tasks affected by $DIFF_BASE_SHA..HEAD"
            TURBO_SCM_BASE="$DIFF_BASE_SHA" pnpm exec turbo run test --affected
            exit 0
          fi

          echo "Running the full test suite for $GITHUB_EVENT_NAME"
          pnpm exec turbo run test

  quality:
    needs:
      - lint
      - quality-support
      - test
      - detect
      - e2e-policy
      - interview-e2e
      - interview-e2e-native
      - interviewer-e2e
      - interviewer-e2e-native
      - architect-e2e
      - architect-e2e-native
    if: >-
      ${{ !cancelled()
      && github.event_name != 'push'
      && !(github.event_name == 'workflow_dispatch'
      && inputs.interview_e2e_benchmark == true) }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify all quality checks passed
        env:
          EVENT_NAME: ${{ github.event_name }}
          DETECT_RESULT: ${{ needs.detect.result }}
          E2E_POLICY_RESULT: ${{ needs.e2e-policy.result }}
          E2E_INTERVIEW_REQUIRED: ${{ needs.e2e-policy.outputs.interview }}
          E2E_INTERVIEWER_REQUIRED: ${{ needs.e2e-policy.outputs.interviewer }}
          E2E_ARCHITECT_REQUIRED: ${{ needs.e2e-policy.outputs.architect }}
          LINT_RESULT: ${{ needs.lint.result }}
          SUPPORT_RESULT: ${{ needs.quality-support.result }}
          TEST_RESULT: ${{ needs.test.result }}
          INTERVIEW_E2E_RESULT: ${{ needs.interview-e2e.result }}
          INTERVIEW_E2E_NATIVE_RESULT: ${{ needs.interview-e2e-native.result }}
          INTERVIEWER_E2E_RESULT: ${{ needs.interviewer-e2e.result }}
          INTERVIEWER_E2E_NATIVE_RESULT: ${{ needs.interviewer-e2e-native.result }}
          ARCHITECT_E2E_RESULT: ${{ needs.architect-e2e.result }}
          ARCHITECT_E2E_NATIVE_RESULT: ${{ needs.architect-e2e-native.result }}
        run: |
          if [[ "$EVENT_NAME" == "merge_group" ]]; then
            echo "PR quality verdicts are authoritative; merge-group CI is intentionally lightweight"
            exit 0
          fi

          verify_successes() {
            local gate=$1
            shift
            echo "$gate results: $*"
            for r in "$@"; do
              if [ "$r" != "success" ]; then
                echo "::error::$gate failed — a sub-job concluded '$r'"
                exit 1
              fi
            done
          }

          verify_successes "quality gate" \
            "$LINT_RESULT" \
            "$SUPPORT_RESULT" \
            "$TEST_RESULT"

          if [[ "$EVENT_NAME" != "merge_group" && "$DETECT_RESULT" != "success" ]]; then
            echo "::error::quality gate failed — detect concluded '$DETECT_RESULT'"
            exit 1
          fi

          if [[ "$E2E_POLICY_RESULT" != "success" ]]; then
            echo "::error::quality gate failed — E2E policy concluded '$E2E_POLICY_RESULT'"
            exit 1
          fi

          verify_required_e2e() {
            local suite=$1 required=$2 result=$3
            if [[ "$required" != "true" ]]; then
              echo "$suite is not required for this event (result: $result)"
              return
            fi
            if [[ "$result" != "success" ]]; then
              echo "::error::E2E gate failed — $suite concluded '$result'"
              exit 1
            fi
            echo "$suite passed"
          }

          # Each suite runs as two jobs — the Dockerized pixel half and the
          # native functional half. BOTH are required, so a red functional
          # half cannot be hidden by a green pixel half.
          verify_required_e2e interview-e2e "$E2E_INTERVIEW_REQUIRED" "$INTERVIEW_E2E_RESULT"
          verify_required_e2e interview-e2e-native "$E2E_INTERVIEW_REQUIRED" "$INTERVIEW_E2E_NATIVE_RESULT"
          verify_required_e2e interviewer-e2e "$E2E_INTERVIEWER_REQUIRED" "$INTERVIEWER_E2E_RESULT"
          verify_required_e2e interviewer-e2e-native "$E2E_INTERVIEWER_REQUIRED" "$INTERVIEWER_E2E_NATIVE_RESULT"
          verify_required_e2e architect-e2e "$E2E_ARCHITECT_REQUIRED" "$ARCHITECT_E2E_RESULT"
          verify_required_e2e architect-e2e-native "$E2E_ARCHITECT_REQUIRED" "$ARCHITECT_E2E_NATIVE_RESULT"
          echo "quality gate passed"

  docs-preview-checks:
    needs: detect
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      needs.detect.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      statuses: read
    steps:
      - id: netlify-preview
        name: Wait for Netlify documentation preview
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const siteName = 'documentation-dev';
            const statusContext = `netlify/${siteName}/deploy-preview`;
            const headSha = context.payload.pull_request.head.sha;
            const expectedHost = `deploy-preview-${context.issue.number}--${siteName}.netlify.app`;
            const deadline = Date.now() + 15 * 60 * 1000;

            while (Date.now() < deadline) {
              const statuses = await github.paginate(
                github.rest.repos.listCommitStatusesForRef,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: headSha,
                  per_page: 100,
                },
              );
              const status = statuses.find(({ context }) => context === statusContext);

              if (status?.state === 'success') {
                let previewUrl;
                try {
                  previewUrl = new URL(status.target_url);
                } catch {
                  core.setFailed(`${statusContext} did not provide a valid preview URL`);
                  return;
                }

                if (previewUrl.protocol !== 'https:' || previewUrl.hostname !== expectedHost) {
                  core.setFailed(
                    `${statusContext} pointed to unexpected URL ${previewUrl.toString()}`,
                  );
                  return;
                }

                core.setOutput('url', previewUrl.origin);
                return;
              }

              if (status && ['error', 'failure'].includes(status.state)) {
                core.setFailed(`${statusContext} concluded ${status.state}`);
                return;
              }

              await new Promise((resolve) => setTimeout(resolve, 15_000));
            }

            core.setFailed(`Timed out waiting for ${statusContext}`);
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Confirm Netlify preview is reachable
        env:
          DOCS_URL: ${{ steps.netlify-preview.outputs.url }}
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsSL --max-time 10 -o /dev/null "$DOCS_URL/en"; then
              echo "deploy is reachable; proceeding"
              exit 0
            fi
            echo "attempt $i: not yet, sleeping 5s"
            sleep 5
          done
          echo "::error::Netlify documentation preview is not reachable at $DOCS_URL"
          exit 1
      - name: Dead-link check
        env:
          DOCS_URL: ${{ steps.netlify-preview.outputs.url }}
        # @jthrilly/dead-link-checker >=1.1.0 retries each request on transient
        # network errors (UND_ERR_SOCKET / connect timeouts), so a single flaky
        # fetch no longer fails the run. Retrying the whole crawl here was the
        # wrong layer — it multiplied exposure to the per-request flake instead
        # of recovering from it — so a single invocation is now correct.
        run: npx --yes @jthrilly/dead-link-checker@^1.1.0 "$DOCS_URL" -v --yes
      - name: Redirect test
        working-directory: apps/documentation
        env:
          DEPLOYMENT_URL: ${{ steps.netlify-preview.outputs.url }}
        run: pnpm run test-redirects

  website-preview-checks:
    needs: detect
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      needs.detect.outputs.website == 'true'
    runs-on: ubuntu-latest
    # Budgets two sequential 15-minute Netlify status polls (website, then
    # documentation) plus the reachability probes and the crawl itself.
    timeout-minutes: 40
    permissions:
      contents: read
      statuses: read
    steps:
      - id: netlify-preview
        name: Wait for Netlify website preview
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const siteName = 'networkcanvasdotdev';
            const statusContext = `netlify/${siteName}/deploy-preview`;
            const headSha = context.payload.pull_request.head.sha;
            const expectedHost = `deploy-preview-${context.issue.number}--${siteName}.netlify.app`;
            const deadline = Date.now() + 15 * 60 * 1000;

            while (Date.now() < deadline) {
              const statuses = await github.paginate(
                github.rest.repos.listCommitStatusesForRef,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: headSha,
                  per_page: 100,
                },
              );
              const status = statuses.find(({ context }) => context === statusContext);

              if (status?.state === 'success') {
                let previewUrl;
                try {
                  previewUrl = new URL(status.target_url);
                } catch {
                  core.setFailed(`${statusContext} did not provide a valid preview URL`);
                  return;
                }

                if (previewUrl.protocol !== 'https:' || previewUrl.hostname !== expectedHost) {
                  core.setFailed(
                    `${statusContext} pointed to unexpected URL ${previewUrl.toString()}`,
                  );
                  return;
                }

                core.setOutput('url', previewUrl.origin);
                return;
              }

              if (status && ['error', 'failure'].includes(status.state)) {
                core.setFailed(`${statusContext} concluded ${status.state}`);
                return;
              }

              await new Promise((resolve) => setTimeout(resolve, 15_000));
            }

            core.setFailed(`Timed out waiting for ${statusContext}`);
      - name: Confirm Netlify preview is reachable
        env:
          WEBSITE_URL: ${{ steps.netlify-preview.outputs.url }}
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsSL --max-time 10 -o /dev/null "$WEBSITE_URL/en-US/"; then
              echo "deploy is reachable; proceeding"
              exit 0
            fi
            echo "attempt $i: not yet, sleeping 5s"
            sleep 5
          done
          echo "::error::Netlify website preview is not reachable at $WEBSITE_URL"
          exit 1
      # In a deploy-preview context the website rewrites its documentation
      # links to this PR's documentation preview
      # (apps/networkcanvas.com/next.config.ts, documentationUrl). The two
      # Netlify builds race, so wait for the documentation preview before
      # crawling — otherwise every docs link 404s whenever the website
      # preview deploys first.
      - id: docs-preview
        name: Wait for Netlify documentation preview
        if: needs.detect.outputs.docs == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const siteName = 'documentation-dev';
            const statusContext = `netlify/${siteName}/deploy-preview`;
            const headSha = context.payload.pull_request.head.sha;
            const expectedHost = `deploy-preview-${context.issue.number}--${siteName}.netlify.app`;
            const deadline = Date.now() + 15 * 60 * 1000;

            while (Date.now() < deadline) {
              const statuses = await github.paginate(
                github.rest.repos.listCommitStatusesForRef,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: headSha,
                  per_page: 100,
                },
              );
              const status = statuses.find(({ context }) => context === statusContext);

              if (status?.state === 'success') {
                let previewUrl;
                try {
                  previewUrl = new URL(status.target_url);
                } catch {
                  core.setFailed(`${statusContext} did not provide a valid preview URL`);
                  return;
                }

                if (previewUrl.protocol !== 'https:' || previewUrl.hostname !== expectedHost) {
                  core.setFailed(
                    `${statusContext} pointed to unexpected URL ${previewUrl.toString()}`,
                  );
                  return;
                }

                core.setOutput('url', previewUrl.origin);
                return;
              }

              if (status && ['error', 'failure'].includes(status.state)) {
                core.setFailed(`${statusContext} concluded ${status.state}`);
                return;
              }

              await new Promise((resolve) => setTimeout(resolve, 15_000));
            }

            core.setFailed(`Timed out waiting for ${statusContext}`);
      - name: Confirm documentation preview is reachable
        if: needs.detect.outputs.docs == 'true'
        env:
          DOCS_URL: ${{ steps.docs-preview.outputs.url }}
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsSL --max-time 10 -o /dev/null "$DOCS_URL/en"; then
              echo "deploy is reachable; proceeding"
              exit 0
            fi
            echo "attempt $i: not yet, sleeping 5s"
            sleep 5
          done
          echo "::error::Netlify documentation preview is not reachable at $DOCS_URL"
          exit 1
      - name: Dead-link check
        env:
          WEBSITE_URL: ${{ steps.netlify-preview.outputs.url }}
        run: npx --yes @jthrilly/dead-link-checker@^1.1.0 "$WEBSITE_URL/en-US/" -v --yes

  interview-e2e:
    # Runs when the policy requires the interview suite. The Dockerized suite
    # builds its own dependency graph and cannot consume the host runner's
    # Turbo cache, so start it as soon as the policy completes.
    needs: [e2e-policy, pick-e2e-runner]
    if: >-
      ${{ !cancelled() && needs.e2e-policy.outputs.interview == 'true'
      && needs.pick-e2e-runner.result == 'success' }}
    runs-on: ${{ fromJSON(needs.pick-e2e-runner.outputs.runs_on) }}
    timeout-minutes: 45
    env:
      # Cap matrix parallelism per runner class (see pick-e2e-runner). The
      # config default ('50%') both under-uses the GitHub box for the
      # fully-parallel matrix projects and lets the crypto-heavy Anonymisation
      # scenarios (PBKDF2 at write time) contend under high worker counts,
      # which surfaces as spurious timeout flakes. 4 is the measured sweet
      # spot for the single-job (no shard matrix) run on GitHub's 4-core
      # runners; the self-hosted runner (12 cores) gets 6.
      PW_WORKERS: ${{ needs.pick-e2e-runner.outputs.pw_workers }}
      E2E_RUNNER_CLASS: ${{ needs.pick-e2e-runner.outputs.runner_class }}
      E2E_SHARD: ${{ github.event_name == 'workflow_dispatch' && inputs.interview_e2e_benchmark == true && inputs.interview_e2e_shard || '' }}
      E2E_BENCHMARK: ${{ github.event_name == 'workflow_dispatch' && inputs.interview_e2e_benchmark == true }}
    outputs:
      slug: ${{ steps.meta.outputs.slug }}
      snapshot_failure: ${{ steps.snapshot_failure.outputs.detected }}
    steps:
      - name: Ensure workspace is a healthy git repo
        # On the self-hosted runner the workspace persists between jobs, and a
        # CANCELLED predecessor leaves two hazards behind (observed
        # 2026-07-16/17 breaking every release-lane run):
        # 1) Its Dockerized test run outlives the job — cancellation kills the
        #    `docker run` client, not the container — and keeps writing
        #    root-owned files into the bind-mounted workspace. Remove it by
        #    name BEFORE touching the tree, or the wipe below races a live
        #    writer and checkout's delete-everything fallback throws EACCES
        #    (which actions/checkout's finally-block then masks as "--local
        #    can only be used inside a git repository").
        # 2) Root-owned files it already wrote make `git clean` fail even
        #    once the container is gone. The chown reuses the runner's scoped
        #    sudo rule to reclaim them unconditionally — a valid repo with
        #    root-owned leftovers is just as fatal to checkout as a broken
        #    one.
        # If the tree is non-empty but has no usable .git, wipe it so checkout
        # falls back to a fresh clone. No-op on ephemeral GitHub-hosted VMs:
        # the directory starts empty and no container pre-exists.
        run: |
          docker rm -f interview-e2e-run 2>/dev/null || true
          sudo chown -R "$(id -u):$(id -g)" . 2>/dev/null || true
          if [ -n "$(ls -A . 2>/dev/null)" ] \
            && ! git rev-parse --resolve-git-dir "$PWD/.git" >/dev/null 2>&1; then
            echo "workspace is not a valid git repo — wiping for a fresh checkout"
            find . -mindepth 1 -delete
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # The Dockerized test run mounts the workspace; don't leave the
          # checkout token in .git/config for test/build code to read.
          persist-credentials: false
      - id: meta
        env:
          REF: ${{ github.head_ref || github.ref_name }}
        run: |
          SLUG=$(printf '%s' "$REF" | tr '/' '-' | tr '[:upper:]' '[:lower:]')
          # Strip any chars that would break GitHub Pages URLs or filesystem paths.
          SLUG=$(printf '%s' "$SLUG" | tr -c '[:alnum:]-_.' '-')
          SLUG=${SLUG:-unknown}
          printf 'slug=%s\n' "$SLUG" >> "$GITHUB_OUTPUT"
      - name: Record benchmark runner hardware
        if: env.E2E_BENCHMARK == 'true'
        run: |
          lscpu
          free -h
          docker info --format '{{json .DriverStatus}}'
      - name: Run E2E tests
        run: |
          # Pixel half only — the *-matrix projects run natively in
          # interview-e2e-native. Same project selector as
          # test:e2e:update-snapshots and the regeneration workflow.
          args=(--project=chromium-visual --project=firefox-visual --project=webkit-visual)
          if [[ -n "$E2E_SHARD" ]]; then
            if [[ ! "$E2E_SHARD" =~ ^[1-9][0-9]*/[1-9][0-9]*$ ]]; then
              echo "::error::Invalid Playwright shard '$E2E_SHARD' (expected N/M)"
              exit 1
            fi
            args+=("--shard=$E2E_SHARD")
          fi

          if [[ "$E2E_BENCHMARK" != "true" ]]; then
            ./packages/interview/e2e/scripts/run.sh "${args[@]}"
            exit
          fi

          telemetry="$RUNNER_TEMP/interview-e2e-telemetry.tsv"
          printf 'timestamp\tload\tmemory_available_kb\tdocker_stats\n' > "$telemetry"
          ./packages/interview/e2e/scripts/run.sh "${args[@]}" &
          test_pid=$!
          stop_test() {
            kill "$test_pid" 2>/dev/null || true
            docker rm -f interview-e2e-run 2>/dev/null || true
          }
          trap stop_test INT TERM
          while kill -0 "$test_pid" 2>/dev/null; do
            timestamp=$(date --iso-8601=seconds)
            load=$(cut -d ' ' -f 1-3 /proc/loadavg)
            memory=$(awk '/MemAvailable:/ { print $2 }' /proc/meminfo)
            stats=$(docker stats interview-e2e-run --no-stream \
              --format '{{json .}}' 2>/dev/null || true)
            printf '%s\t%s\t%s\t%s\n' \
              "$timestamp" "$load" "$memory" "$stats" >> "$telemetry"
            sleep 5
          done
          set +e
          wait "$test_pid"
          status=$?
          set -e
          trap - INT TERM
          exit "$status"
      - name: Record E2E execution configuration
        if: always()
        run: |
          {
            echo "### Interview E2E execution"
            echo
            echo "- Runner: $E2E_RUNNER_CLASS"
            echo "- Playwright workers: $PW_WORKERS"
            echo "- Shard: ${E2E_SHARD:-none}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload benchmark telemetry
        if: always() && env.E2E_BENCHMARK == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: interview-e2e-telemetry
          path: ${{ runner.temp }}/interview-e2e-telemetry.tsv
          if-no-files-found: error
          retention-days: 7
      - name: Stop the e2e container
        # Cancellation kills the `docker run` client but not the container;
        # left alive it keeps writing root-owned files into the persistent
        # workspace and corrupts the next job's checkout. Must run BEFORE the
        # ownership reclaim below so the chown covers everything the container
        # wrote. No-op when the run exited normally (`--rm` already removed
        # it) and on ephemeral GitHub-hosted VMs.
        if: always()
        run: docker rm -f interview-e2e-run 2>/dev/null || true
      - name: Classify snapshot-only failure
        id: snapshot_failure
        if: failure()
        run: |
          detected=$(node scripts/playwright-snapshot-failure.mjs packages/interview/e2e/test-results/results.json)
          echo "snapshot-only failure: $detected"
          echo "detected=$detected" >> "$GITHUB_OUTPUT"
      # Dormant until a shard matrix is added (spec: enable shards only if the
      # single-job wall-clock exceeds the 45-minute budget). When enabling: add
      # strategy.matrix.shard, pass --shard=${{ matrix.shard }} to run.sh, set
      # PW_BLOB: 1, and give the merge step the downloaded per-shard blob dirs.
      - name: Set up sharded report merger
        if: ${{ env.PW_BLOB == '1' }}
        uses: ./.github/actions/turbo-ci-setup
      - name: Merge sharded blob reports
        if: ${{ env.PW_BLOB == '1' }}
        run: pnpm --filter @codaco/interview exec playwright merge-reports --reporter html ./blob-report
      - name: Reclaim workspace ownership
        # The Dockerized run executes as container root, so everything it
        # writes into the bind-mounted workspace (dist trees, reports, volume
        # mountpoints) lands root-owned. Reclaim the WHOLE checkout, not just
        # the report dirs: on a self-hosted runner the workspace persists
        # between runs, and the next checkout's `git clean` cannot remove
        # root-owned files. (Ephemeral GitHub-hosted VMs never noticed.)
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" . 2>/dev/null || true
      - name: Flag flaky tests
        # Reporting only — never gate the job on it (belt-and-suspenders with the
        # script's own guards).
        if: always()
        continue-on-error: true
        run: node packages/interview/e2e/scripts/flaky-summary.mjs
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: interview-playwright-report
          path: packages/interview/e2e/playwright-report/
          if-no-files-found: warn
          retention-days: 14

  interview-e2e-native:
    # The functional half of the Interview suite: the three *-matrix projects,
    # whose only baselines are ARIA accessibility-tree text. Those are
    # OS-independent by design, and are already regenerated on developer macOS
    # hosts and compared inside Linux CI today — so running them outside the
    # container changes nothing about what they assert. The three *-visual
    # projects own all 318 committed PNGs and stay in interview-e2e.
    # Deliberately hosted-only: this half does not need the self-hosted
    # runner's warm Docker volumes, and `playwright install --with-deps` needs
    # an apt sudo that runner does not grant.
    needs: e2e-policy
    if: ${{ !cancelled() && needs.e2e-policy.outputs.interview == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Matches the Dockerized job's cap for GitHub's 4-core runners: the
      # config default ('50%') lets the crypto-heavy Anonymisation scenarios
      # contend, which surfaces as spurious timeout flakes.
      PW_WORKERS: '4'
      # Makes a stray pixel capture throw here rather than silently
      # comparing container-rasterised baselines against this runner's fonts
      # (see the suite's capture helper).
      E2E_PIXEL_LANE: native
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/turbo-ci-setup
      - name: Resolve the pinned Playwright version
        id: pw
        # The same lockfile-derived pin the Docker image tag is built from:
        # the browser build is fixed by the resolved @playwright/test version
        # either way, so this lane is no less deterministic about the browsers.
        run: |
          version="$(grep -oE '@playwright/test@[0-9]+\.[0-9]+\.[0-9]+' pnpm-lock.yaml \
            | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | sort -uV | tail -1 || true)"
          if [ -z "$version" ]; then
            echo "::error::could not resolve @playwright/test from pnpm-lock.yaml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium-firefox-webkit
      - name: Install the pinned browsers
        # turbo-ci-setup installs with --ignore-scripts, so Playwright's own
        # postinstall browser download never runs.
        run: pnpm --filter @codaco/interview exec playwright install --with-deps chromium firefox webkit
      - name: Build the app under test
        # The Playwright config serves an already-built app; it does not build
        # one for us.
        run: pnpm exec turbo run build --filter=@codaco/interview
      - name: Build the e2e host
        run: pnpm --filter @codaco/interview exec vite build --config e2e/host/vite.config.ts
      - name: Run functional E2E tests
        run: pnpm --filter @codaco/interview run test:e2e:native
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: interview-playwright-report-native
          path: packages/interview/e2e/playwright-report/
          if-no-files-found: warn
          retention-days: 14

  interviewer-e2e:
    # See interview-e2e: this Dockerized suite owns its build too.
    needs: e2e-policy
    if: ${{ !cancelled() && needs.e2e-policy.outputs.interviewer == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      snapshot_failure: ${{ steps.snapshot_failure.outputs.detected }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # The Dockerized test run mounts the workspace; don't leave the
          # checkout token in .git/config for test/build code to read.
          persist-credentials: false
      - name: Run visual E2E tests
        # Pixel half only — the functional tests run natively in
        # interviewer-e2e-native. Same selector as
        # test:e2e:update-snapshots and the regeneration workflow.
        run: ./apps/interviewer/e2e/scripts/run.sh --grep @visual
      - name: Classify snapshot-only failure
        id: snapshot_failure
        if: failure()
        run: |
          detected=$(node scripts/playwright-snapshot-failure.mjs apps/interviewer/e2e/test-results/results.json)
          echo "snapshot-only failure: $detected"
          echo "detected=$detected" >> "$GITHUB_OUTPUT"
      - name: Reclaim workspace ownership
        # See interview-e2e: reclaim the whole checkout for self-hosted runs.
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" . 2>/dev/null || true
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: interviewer-playwright-report
          path: apps/interviewer/e2e/playwright-report/
          if-no-files-found: warn
          retention-days: 14

  interviewer-e2e-native:
    # The functional half of the Interviewer suite: the tests that read no
    # baseline of any kind — no PNG, no ARIA, no JSON. The 5 @visual tests stay
    # in interviewer-e2e's container. webkit is installed for the
    # webkit-visual-viewport project, which asserts live geometry rather than
    # pixels and so is safe outside the image.
    needs: e2e-policy
    if: ${{ !cancelled() && needs.e2e-policy.outputs.interviewer == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Build-time PostHog kill switch. Not a Docker artifact: without it the
      # CSP-blocked analytics script load interleaves non-deterministically
      # with a spec's own page.evaluate/addStyleTag calls and surfaces as a
      # spurious action failure (the suite's run.sh explains this at length).
      VITE_DISABLE_ANALYTICS: 'true'
      # Makes a stray pixel capture throw here rather than silently
      # comparing container-rasterised baselines against this runner's fonts
      # (see the suite's capture helper).
      E2E_PIXEL_LANE: native
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/turbo-ci-setup
      - name: Resolve the pinned Playwright version
        id: pw
        # The same lockfile-derived pin the Docker image tag is built from:
        # the browser build is fixed by the resolved @playwright/test version
        # either way, so this lane is no less deterministic about the browsers.
        run: |
          version="$(grep -oE '@playwright/test@[0-9]+\.[0-9]+\.[0-9]+' pnpm-lock.yaml \
            | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | sort -uV | tail -1 || true)"
          if [ -z "$version" ]; then
            echo "::error::could not resolve @playwright/test from pnpm-lock.yaml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium-webkit
      - name: Install the pinned browsers
        # turbo-ci-setup installs with --ignore-scripts, so Playwright's own
        # postinstall browser download never runs.
        run: pnpm --filter @codaco/interviewer exec playwright install --with-deps chromium webkit
      - name: Build the app under test
        # The Playwright config serves an already-built app; it does not build
        # one for us.
        run: pnpm exec turbo run build --filter=@codaco/interviewer
      - name: Run functional E2E tests
        run: pnpm --filter @codaco/interviewer run test:e2e:native
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: interviewer-playwright-report-native
          path: apps/interviewer/e2e/playwright-report/
          if-no-files-found: warn
          retention-days: 14

  architect-e2e:
    # See interview-e2e: this Dockerized suite owns its build too.
    needs: e2e-policy
    if: ${{ !cancelled() && needs.e2e-policy.outputs.architect == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      snapshot_failure: ${{ steps.snapshot_failure.outputs.detected }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # The Dockerized test run mounts the workspace; don't leave the
          # checkout token in .git/config for test/build code to read.
          persist-credentials: false
      - name: Run visual E2E tests
        # Pixel half only — the functional tests run natively in
        # architect-e2e-native. This is the same selector
        # test:e2e:update-snapshots and the regeneration workflow already use,
        # so the two lanes cannot drift apart.
        run: ./apps/architect/e2e/scripts/run.sh --grep @visual
      - name: Classify snapshot-only failure
        id: snapshot_failure
        if: failure()
        run: |
          detected=$(node scripts/playwright-snapshot-failure.mjs apps/architect/e2e/test-results/results.json)
          echo "snapshot-only failure: $detected"
          echo "detected=$detected" >> "$GITHUB_OUTPUT"
      - name: Reclaim workspace ownership
        # See interview-e2e: reclaim the whole checkout for self-hosted runs.
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" . 2>/dev/null || true
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-architect
          path: apps/architect/e2e/playwright-report/
          if-no-files-found: warn
          retention-days: 14

  architect-e2e-native:
    # The functional half of the Architect suite. Its JSON stage snapshots are
    # read back out of IndexedDB protocol JSON rather than from rendered
    # geometry, so they are byte-stable across fonts, arch and OS: the pinned
    # Playwright image buys this half nothing but a ~1 GB pull and a build that
    # cannot reach the Turbo remote cache. The @visual tests stay in
    # architect-e2e's container, the only place a pixel comparison means
    # anything.
    needs: e2e-policy
    if: ${{ !cancelled() && needs.e2e-policy.outputs.architect == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Build-time PostHog kill switch. Not a Docker artifact: without it the
      # CSP-blocked analytics script load interleaves non-deterministically
      # with a spec's own page.evaluate/addStyleTag calls and surfaces as a
      # spurious action failure (the suite's run.sh explains this at length).
      VITE_DISABLE_ANALYTICS: 'true'
      # Builds the same deterministic app shell as the Docker pixel lane:
      # Motion and Base UI animation bookkeeping are both disabled before the
      # application mounts.
      VITE_DISABLE_ANIMATIONS: 'true'
      # Makes a stray pixel capture throw here rather than silently
      # comparing container-rasterised baselines against this runner's fonts
      # (see the suite's capture helper).
      E2E_PIXEL_LANE: native
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/turbo-ci-setup
      - name: Resolve the pinned Playwright version
        id: pw
        # The same lockfile-derived pin the Docker image tag is built from:
        # the browser build is fixed by the resolved @playwright/test version
        # either way, so this lane is no less deterministic about Chromium.
        run: |
          version="$(grep -oE '@playwright/test@[0-9]+\.[0-9]+\.[0-9]+' pnpm-lock.yaml \
            | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | sort -uV | tail -1 || true)"
          if [ -z "$version" ]; then
            echo "::error::could not resolve @playwright/test from pnpm-lock.yaml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium
      - name: Install the pinned browsers
        # turbo-ci-setup installs with --ignore-scripts, so Playwright's own
        # postinstall browser download never runs.
        run: pnpm --filter @codaco/architect exec playwright install --with-deps chromium
      - name: Build the app under test
        # The Playwright config serves an already-built app; it does not build
        # one for us.
        run: pnpm exec turbo run build --filter=@codaco/architect
      - name: Run functional E2E tests
        run: pnpm --filter @codaco/architect run test:e2e:native
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-architect-native
          path: apps/architect/e2e/playwright-report/
          if-no-files-found: warn
          retention-days: 14

  regenerate-interview-snapshots:
    needs: [e2e-policy, interview-e2e]
    if: >-
      ${{ always()
      && needs.e2e-policy.outputs.release_ref != ''
      && needs.interview-e2e.result == 'failure'
      && needs.interview-e2e.outputs.snapshot_failure == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/regenerate-e2e-visual-snapshots.yml
    with:
      suite: interview

  regenerate-interviewer-snapshots:
    needs: [e2e-policy, interviewer-e2e]
    if: >-
      ${{ always()
      && needs.e2e-policy.outputs.release_ref != ''
      && needs.interviewer-e2e.result == 'failure'
      && needs.interviewer-e2e.outputs.snapshot_failure == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/regenerate-e2e-visual-snapshots.yml
    with:
      suite: interviewer

  regenerate-architect-snapshots:
    needs: [e2e-policy, architect-e2e]
    if: >-
      ${{ always()
      && needs.e2e-policy.outputs.release_ref != ''
      && needs.architect-e2e.result == 'failure'
      && needs.architect-e2e.outputs.snapshot_failure == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/regenerate-e2e-visual-snapshots.yml
    with:
      suite: architect

  open-e2e-snapshot-update-pr:
    needs:
      - e2e-policy
      - regenerate-interview-snapshots
      - regenerate-interviewer-snapshots
      - regenerate-architect-snapshots
    if: >-
      ${{ always()
      && needs.e2e-policy.outputs.release_ref != ''
      && (needs.regenerate-interview-snapshots.result == 'success'
      || needs.regenerate-interviewer-snapshots.result == 'success'
      || needs.regenerate-architect-snapshots.result == 'success') }}
    permissions:
      actions: write
      contents: write
      pull-requests: write
    uses: ./.github/workflows/open-e2e-snapshot-update-pr.yml
    with:
      release_ref: ${{ needs.e2e-policy.outputs.release_ref }}
      run_head_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      snapshot_branch: ${{ needs.e2e-policy.outputs.snapshot_branch }}
      source_run_url: ${{ format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}

  # Publishes the Playwright report to GitHub Pages and comments the E2E result
  # on the PR. Purely informational: whether the report PUBLISHED says nothing
  # about whether the code is sound — the actual verdict is the interview-e2e job
  # (and the comment below). continue-on-error keeps a reporting/Pages-deploy
  # hiccup from failing the workflow run and gating a release; it is also
  # excluded from the carry-forward job so its verdict is never republished onto
  # an unrelated push (see carry-forward-statuses).
  interview-e2e-report:
    needs: [interview-e2e, interview-e2e-native]
    if: >-
      ${{ !cancelled()
      && needs.interview-e2e.result != 'skipped'
      && !(github.event_name == 'workflow_dispatch'
      && inputs.interview_e2e_benchmark == true) }}
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      # contents: write is for the gh-pages state branch below, not the source.
      contents: write
      pages: write
      id-token: write
      pull-requests: write
    concurrency:
      group: interview-e2e-pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: https://complexdatacollective.github.io/network-canvas-monorepo/interview-e2e/${{ needs.interview-e2e.outputs.slug }}/
    steps:
      - name: Download new report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: interview-playwright-report
          path: new-report
      - name: Fetch existing pages content
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: gh-pages
          path: existing-pages
        continue-on-error: true
      - name: Merge report into branch subdirectory
        env:
          SLUG: ${{ needs.interview-e2e.outputs.slug }}
        run: |
          mkdir -p merged
          if [ -d existing-pages ] && [ "$(ls -A existing-pages 2>/dev/null)" ]; then
            cp -r existing-pages/. merged/
            rm -rf merged/.git
          fi
          rm -rf "merged/interview-e2e/$SLUG"
          mkdir -p "merged/interview-e2e/$SLUG"
          cp -r new-report/. "merged/interview-e2e/$SLUG/"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: merged/
      - name: Persist merged site to gh-pages branch
        # deploy-pages replaces the ENTIRE Pages site with this run's artifact
        # and maintains no branch, so the only prior content the merge step can
        # fetch is what this step saves. Without it, the two release lanes
        # erase each other's report subdirectory on every deploy (the report
        # link 404s a minute after it is posted). The branch is pure derived
        # state, so force-push a fresh single commit; the job concurrency
        # group serialises writers.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -q -b gh-pages "$RUNNER_TEMP/pages-state"
          git --git-dir="$RUNNER_TEMP/pages-state/.git" --work-tree=merged add -A
          git --git-dir="$RUNNER_TEMP/pages-state/.git" --work-tree=merged \
            -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "interview-e2e report site (run ${{ github.run_id }})"
          git --git-dir="$RUNNER_TEMP/pages-state/.git" push -q --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" gh-pages
      - name: Deploy report to Pages
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        timeout-minutes: 3
        continue-on-error: true
      - name: Comment on PR
        # always(): still post the E2E result even if the Pages publish above
        # failed — the report link may be stale but the pass/fail signal is the
        # point.
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SLUG: ${{ needs.interview-e2e.outputs.slug }}
          OUTCOME: ${{ needs.interview-e2e.result }}
          NATIVE_OUTCOME: ${{ needs.interview-e2e-native.result }}
        with:
          script: |
            const { SLUG, OUTCOME, NATIVE_OUTCOME } = process.env;
            const url = `https://complexdatacollective.github.io/network-canvas-monorepo/interview-e2e/${SLUG}/`;
            // The suite runs as two jobs; report both, so a green pixel half
            // can never read as a green suite while the functional half is red.
            const ok = OUTCOME === 'success' && NATIVE_OUTCOME === 'success';
            const emoji = ok ? '✅' : '❌';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `${emoji} Interview E2E — pixel **${OUTCOME}** · functional **${NATIVE_OUTCOME}**\n\n📊 [View report](${url})`,
            });

  release:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: ./.github/actions/turbo-ci-setup
      - name: Build all publishable packages
        # Only build the workspaces under packages/ — those are what changesets
        # publishes to npm. Apps (./apps/*) are private:true and don't need to
        # build successfully here; their deploy pipeline is per-app deploy jobs.
        run: pnpm exec turbo run build --filter='./packages/*'
      - name: Verify publish exports
        # Internal consumption reads each package's `src`; npm tarballs must ship
        # `dist` via pnpm's publishConfig field-swap. Pack each publishable
        # package and assert no packed export/main/module/types path points into
        # `src` and every referenced file exists — guarding the swap before the
        # changesets/action publish below.
        run: node scripts/verify-publish-exports.mjs
      - name: Hide separately gated product changesets from the normal release
        # Documentation and Website changesets persist until their own release
        # PR consumes them. Architect and Interviewer intentionally remain for
        # the normal Changesets CLI to version alongside library packages.
        # Working-tree-only deletion; see the script header.
        run: node scripts/prune-ignored-changesets.mjs
      - id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1
        with:
          version: pnpm run version-packages
          publish: pnpm run publish-packages
          createGithubReleases: true
        env:
          # A fine-grained PAT makes the generated PR's pull_request event run
          # normally. GITHUB_TOKEN-created PR events always require manual
          # workflow approval, which previously forced a duplicate dispatch.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

  # Maintains generated PRs for the products that remain outside the normal
  # "Version Packages" PR. Architect and Interviewer now use that standard
  # Changesets lane; Documentation and Website remain independently releasable.
  product-release-pr:
    name: Release PR (${{ matrix.product }})
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - product: Documentation
            slug: documentation
            package_args: "--package '@codaco/documentation'"
          - product: Website
            slug: website
            package_args: "--package 'networkcanvas.com'"
    runs-on: ubuntu-latest
    concurrency:
      group: product-release-pr-${{ matrix.slug }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Guard against mixed changesets
        run: pnpm check:changesets
      - name: Compute ${{ matrix.product }} version bump
        run: >-
          node scripts/version-gated-products.mjs ${{ matrix.package_args }}
          --out "${RUNNER_TEMP}/product-release-body.md"
      - name: Open/update the ${{ matrix.product }} release PR
        id: product_pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          # Use the dedicated PAT so the generated PR triggers its native
          # pull_request CI run without an approval prompt.
          token: ${{ secrets.RELEASE_PR_TOKEN }}
          branch: changeset-release/${{ matrix.slug }}
          base: main
          delete-branch: true
          title: 'Release ${{ matrix.product }}'
          commit-message: 'chore(release): version ${{ matrix.slug }}'
          body-path: ${{ runner.temp }}/product-release-body.md
  # On a push to main that changes a released product version (i.e. a release PR
  # just merged), detect which product moved. Idempotency is a local git-tag
  # check (no external repo).
  apps-release-detect:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      architect_released: ${{ steps.architect.outputs.released }}
      architect_version: ${{ steps.architect.outputs.version }}
      documentation_released: ${{ steps.documentation.outputs.released }}
      documentation_version: ${{ steps.documentation.outputs.version }}
      fresco_released: ${{ steps.fresco.outputs.released }}
      fresco_version: ${{ steps.fresco.outputs.version }}
      interviewer_released: ${{ steps.interviewer.outputs.released }}
      interviewer_version: ${{ steps.interviewer.outputs.version }}
      website_released: ${{ steps.website.outputs.released }}
      website_version: ${{ steps.website.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 2
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: '.nvmrc'
      - id: architect
        env:
          PKG_JSON: apps/architect/package.json
          PKG_NAME: '@codaco/architect'
          RELEASE_CHANNEL: stable-tagged
        run: bash .github/scripts/detect-app-release.sh
      - id: documentation
        env:
          PKG_JSON: apps/documentation/package.json
          PKG_NAME: '@codaco/documentation'
          RELEASE_CHANNEL: stable
        run: bash .github/scripts/detect-app-release.sh
      - id: fresco
        env:
          PKG_JSON: apps/fresco/package.json
          PKG_NAME: 'fresco'
          RELEASE_CHANNEL: stable-tagged
        run: bash .github/scripts/detect-app-release.sh
      - id: interviewer
        env:
          PKG_JSON: apps/interviewer/package.json
          PKG_NAME: '@codaco/interviewer'
          RELEASE_CHANNEL: stable-tagged
        run: bash .github/scripts/detect-app-release.sh
      - id: website
        env:
          PKG_JSON: apps/networkcanvas.com/package.json
          PKG_NAME: 'networkcanvas.com'
          RELEASE_CHANNEL: stable
        run: bash .github/scripts/detect-app-release.sh

  # Build, deploy to Netlify production, and cut a GitHub release for architect
  # when its version changed. Separate from the interviewer job (below) so one
  # app's build/deploy failure never blocks the other's release — the same
  # per-app isolation the deleted deploy-*-prod jobs had.
  apps-release-architect:
    needs: apps-release-detect
    if: needs.apps-release-detect.outputs.architect_released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # One release per version. With per-commit push concurrency (see top of file)
    # main pushes run in parallel, so two runs can both detect the same untagged
    # version and race into a duplicate build/deploy/release. Serialise them on
    # the tag so only one runs at a time; the guard step below turns the run that
    # starts after the tag exists into a clean no-op (no redundant prod deploy).
    concurrency:
      group: apps-release-@codaco/architect@${{ needs.apps-release-detect.outputs.architect_version }}
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      VITE_FRESCO_PREVIEW_URL: ${{ secrets.VITE_FRESCO_PREVIEW_URL }}
      VITE_FRESCO_PREVIEW_API_TOKEN: ${{ secrets.VITE_FRESCO_PREVIEW_API_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-tags: true
          persist-credentials: false
      - name: Skip if this version was already released
        id: guard
        env:
          TAG: '@codaco/architect@${{ needs.apps-release-detect.outputs.architect_version }}'
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "$TAG already released — nothing to do"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.guard.outputs.skip != 'true'
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          install: false
      - if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - if: steps.guard.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build architect
        if: steps.guard.outputs.skip != 'true'
        # The PostHog credentials are scoped to this build step alone: only the
        # build needs them (it emits source maps and uploads them — see
        # apps/architect/vite.config.ts), and keeping them off the job means the
        # deploy step's dynamically fetched netlify-cli never sees them.
        env:
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          POSTHOG_PROJECT_ID: ${{ secrets.POSTHOG_PROJECT_ID }}
        run: pnpm exec turbo run build --filter=@codaco/architect
      - name: Deploy architect to production
        if: steps.guard.outputs.skip != 'true'
        run: |
          npx --yes netlify-cli@22 deploy --no-build --prod \
            --filter=@codaco/architect \
            --dir=apps/architect/dist \
            --site="${{ secrets.NETLIFY_SITE_ID_ARCHITECT }}"
      - name: architect release notes
        if: steps.guard.outputs.skip != 'true'
        env:
          VERSION: ${{ needs.apps-release-detect.outputs.architect_version }}
        run: >-
          node scripts/release-notes.mjs
          --app apps/architect
          --pkg @codaco/architect
          --version "$VERSION"
          --out "${RUNNER_TEMP}/architect-notes.md"
      - if: steps.guard.outputs.skip != 'true'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: '@codaco/architect@${{ needs.apps-release-detect.outputs.architect_version }}'
          name: Architect ${{ needs.apps-release-detect.outputs.architect_version }}
          body_path: ${{ runner.temp }}/architect-notes.md
          prerelease: false
          make_latest: 'true'

  # Build, deploy to Netlify production, and cut a GitHub release for interviewer
  # when its version changed. Separate job (see apps-release-architect) so a
  # failure in one app's build never blocks the other's release.
  # NOTE(human-setup-required): needs NETLIFY_SITE_ID_INTERVIEWER set —
  # see apps/interviewer/RELEASING.md.
  apps-release-interviewer:
    needs: apps-release-detect
    if: needs.apps-release-detect.outputs.interviewer_released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # One release per version — see apps-release-architect for the rationale.
    concurrency:
      group: apps-release-@codaco/interviewer@${{ needs.apps-release-detect.outputs.interviewer_version }}
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-tags: true
          persist-credentials: false
      - name: Skip if this version was already released
        id: guard
        env:
          TAG: '@codaco/interviewer@${{ needs.apps-release-detect.outputs.interviewer_version }}'
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "$TAG already released — nothing to do"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.guard.outputs.skip != 'true'
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          install: false
      - if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - if: steps.guard.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build interviewer
        if: steps.guard.outputs.skip != 'true'
        # The PostHog credentials are scoped to this build step alone: only the
        # build needs them (it emits source maps and uploads them — see
        # apps/interviewer/vite.config.ts), and keeping them off the job means
        # the deploy step's dynamically fetched netlify-cli never sees them.
        env:
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          POSTHOG_PROJECT_ID: ${{ secrets.POSTHOG_PROJECT_ID }}
        run: pnpm exec turbo run build --filter=@codaco/interviewer
      - name: Deploy interviewer to production
        if: steps.guard.outputs.skip != 'true'
        run: |
          npx --yes netlify-cli@22 deploy --no-build --prod \
            --filter=@codaco/interviewer \
            --dir=apps/interviewer/dist \
            --site="${{ secrets.NETLIFY_SITE_ID_INTERVIEWER }}"
      - name: interviewer release notes
        if: steps.guard.outputs.skip != 'true'
        env:
          VERSION: ${{ needs.apps-release-detect.outputs.interviewer_version }}
        run: >-
          node scripts/release-notes.mjs
          --app apps/interviewer
          --pkg @codaco/interviewer
          --version "$VERSION"
          --out "${RUNNER_TEMP}/interviewer-notes.md"
      - if: steps.guard.outputs.skip != 'true'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: '@codaco/interviewer@${{ needs.apps-release-detect.outputs.interviewer_version }}'
          name: Interviewer ${{ needs.apps-release-detect.outputs.interviewer_version }}
          body_path: ${{ runner.temp }}/interviewer-notes.md
          prerelease: false
          make_latest: 'true'

  # Fresco is developed here but deployed from its own repository: the mirror
  # replaces that repo's `main` with this app's source (every workspace:/catalog:
  # specifier resolved, plus the single-package pnpm-workspace.yaml and lockfile
  # its Dockerfile needs). Pushing `main` there is what triggers the container
  # image build and push to GHCR — see apps/fresco/.github/workflows.
  # The GitHub release is created on the Fresco repo, tagged v<version>, while
  # the local `fresco@<version>` tag is what makes this job idempotent.
  apps-release-fresco:
    # Also needs `release`: the mirror resolves Fresco's workspace: dependencies
    # to registry ranges and generates a lockfile against npm, so any @codaco/*
    # version bumped in this same release must be published first. The Netlify
    # app releases have no such ordering constraint because they build from the
    # workspace itself.
    needs: [apps-release-detect, release]
    if: needs.apps-release-detect.outputs.fresco_released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # One release per version — see apps-release-architect for the rationale.
    concurrency:
      group: apps-release-fresco@${{ needs.apps-release-detect.outputs.fresco_version }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-tags: true
          persist-credentials: false
      - name: Skip if this version was already released
        id: guard
        env:
          TAG: 'fresco@${{ needs.apps-release-detect.outputs.fresco_version }}'
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "$TAG already released — nothing to do"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.guard.outputs.skip != 'true'
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          install: false
      - if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Mirror source to the Fresco repository
        id: mirror
        if: steps.guard.outputs.skip != 'true'
        env:
          LEGACY_RELEASE_GH_TOKEN: ${{ secrets.LEGACY_RELEASE_GH_TOKEN }}
          MONOREPO_SHA: ${{ github.sha }}
          VERSION: ${{ needs.apps-release-detect.outputs.fresco_version }}
        run: >-
          node scripts/mirror-app.mjs
          --app apps/fresco
          --repo complexdatacollective/Fresco
          --branch main
          --version "$VERSION"
          --with-lockfile
      - name: fresco release notes
        if: steps.guard.outputs.skip != 'true'
        env:
          VERSION: ${{ needs.apps-release-detect.outputs.fresco_version }}
        run: >-
          node scripts/release-notes.mjs
          --app apps/fresco
          --pkg fresco
          --version "$VERSION"
          --out "${RUNNER_TEMP}/fresco-notes.md"
      - name: Create the release on the Fresco repository
        if: steps.guard.outputs.skip != 'true'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          repository: complexdatacollective/Fresco
          token: ${{ secrets.LEGACY_RELEASE_GH_TOKEN }}
          tag_name: v${{ needs.apps-release-detect.outputs.fresco_version }}
          target_commitish: ${{ steps.mirror.outputs.mirror_sha }}
          name: Fresco v${{ needs.apps-release-detect.outputs.fresco_version }}
          body_path: ${{ runner.temp }}/fresco-notes.md
          prerelease: false
          make_latest: 'true'
      # Tagged locally so detect-app-release.sh sees this version as released and
      # the mirror is not repeated on the next push to main.
      - name: Tag the released version in this repository
        if: steps.guard.outputs.skip != 'true'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: 'fresco@${{ needs.apps-release-detect.outputs.fresco_version }}'
          name: Fresco ${{ needs.apps-release-detect.outputs.fresco_version }}
          body_path: ${{ runner.temp }}/fresco-notes.md
          prerelease: false
          make_latest: 'false'

  # Documentation follows the same generated-release-PR gate as the PWA apps,
  # but uses normal semver and produces only a Netlify deployment + git tag.
  apps-release-documentation:
    needs: apps-release-detect
    if: needs.apps-release-detect.outputs.documentation_released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: apps-release-@codaco/documentation@${{ needs.apps-release-detect.outputs.documentation_version }}
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NEXT_PUBLIC_ALGOLIA_APPLICATION_ID: ${{ secrets.NEXT_PUBLIC_ALGOLIA_APPLICATION_ID }}
      NEXT_PUBLIC_ALGOLIA_INDEX_NAME: ${{ secrets.NEXT_PUBLIC_ALGOLIA_INDEX_NAME }}
      NEXT_PUBLIC_ALGOLIA_API_KEY: ${{ secrets.NEXT_PUBLIC_ALGOLIA_API_KEY }}
      NEXT_PUBLIC_MENDABLE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_MENDABLE_ANON_KEY }}
      NEXT_PUBLIC_GA_ID: ${{ secrets.NEXT_PUBLIC_GA_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-tags: true
          persist-credentials: false
      - name: Skip if this version was already deployed
        id: guard
        env:
          TAG: '@codaco/documentation@${{ needs.apps-release-detect.outputs.documentation_version }}'
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "$TAG already deployed — nothing to do"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.guard.outputs.skip != 'true'
        uses: ./.github/actions/turbo-ci-setup
      - name: Build documentation
        if: steps.guard.outputs.skip != 'true'
        # The PostHog credentials are scoped to this build step alone: only the
        # build needs them (it emits source maps and uploads them — see
        # apps/documentation/next.config.ts), and keeping them off the job means
        # the deploy step's dynamically fetched netlify-cli never sees them.
        env:
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          POSTHOG_PROJECT_ID: ${{ secrets.POSTHOG_PROJECT_ID }}
        run: |
          pnpm exec turbo run build --filter=@codaco/documentation
          cp apps/documentation/netlify.toml apps/documentation/out/netlify.toml
      - name: Deploy documentation to production
        if: steps.guard.outputs.skip != 'true'
        run: |
          npx --yes netlify-cli@22 deploy --no-build --prod \
            --filter=@codaco/documentation \
            --dir=apps/documentation/out \
            --site="${{ secrets.NETLIFY_DOCUMENTATION_SITE_ID }}"
      - name: Tag deployed documentation version
        if: steps.guard.outputs.skip != 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TAG: '@codaco/documentation@${{ needs.apps-release-detect.outputs.documentation_version }}'
        with:
          script: |
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/tags/${process.env.TAG}`,
              sha: context.sha,
            });

  # networkcanvas.com follows the same stable generated-release-PR gate as the
  # documentation site. A successful deploy is recorded with a git tag; websites
  # do not create GitHub Releases.
  apps-release-website:
    needs: apps-release-detect
    if: needs.apps-release-detect.outputs.website_released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      # Every production deployment targets the same Netlify site, including
      # metadata refreshes after Classic releases. Keep them serialized.
      group: apps-release-networkcanvas.com-production
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-tags: true
          persist-credentials: false
      - name: Skip if this version was already deployed
        id: guard
        env:
          TAG: networkcanvas.com@${{ needs.apps-release-detect.outputs.website_version }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "$TAG already deployed — nothing to do"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.guard.outputs.skip != 'true'
        uses: ./.github/actions/turbo-ci-setup
      - name: Build and deploy networkcanvas.com to production
        if: steps.guard.outputs.skip != 'true'
        # netlify-cli performs the build here (--build), so unlike the other
        # products these cannot be narrowed past this step. They stay off the
        # job so nothing before or after this step can read them.
        env:
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          POSTHOG_PROJECT_ID: ${{ secrets.POSTHOG_PROJECT_ID }}
        run: |
          json=$(npx --yes netlify-cli@26 deploy --build --prod \
                   --filter=networkcanvas.com \
                   --site="${{ secrets.NETLIFY_SITE_ID_WEBSITE }}" --json)
          echo "$json" | jq .
      - name: Tag deployed website version
        if: steps.guard.outputs.skip != 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TAG: networkcanvas.com@${{ needs.apps-release-detect.outputs.website_version }}
        with:
          script: |
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/tags/${process.env.TAG}`,
              sha: context.sha,
            });

  # Decide whether to (re)release the legacy desktop apps. A release fires when:
  #   * a workflow_dispatch selected the app (forced release at the current
  #     package.json version, even with no version change — used for the initial
  #     6.6.0 cut), OR
  #   * the app's external repo has no release for the current version yet
  #     (idempotent first-time check — also makes a normal push to main release a
  #     newly-bumped version, and a no-op once that version is already published), OR
  #   * the version changed versus the previous commit (defensive: covers bumps
  #     even if the release somehow predates this check).
  # version is always the current apps/<app>/package.json version.
  legacy-release-detect:
    # Only ever runs on main — a manual workflow_dispatch from a feature branch
    # must not mirror/publish branch-only code to the external app repos. An E2E
    # benchmark dispatch is measurement-only and must not enter any release lane.
    if: >-
      github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && !(github.event_name == 'workflow_dispatch'
      && inputs.interview_e2e_benchmark == true)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      architect_released: ${{ steps.architect.outputs.released }}
      architect_version: ${{ steps.architect.outputs.version }}
      interviewer_released: ${{ steps.interviewer.outputs.released }}
      interviewer_version: ${{ steps.interviewer.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: '.nvmrc'
      - name: Detect architect release
        id: architect
        env:
          PKG_JSON: apps/architect-classic/package.json
          EXTERNAL_REPO: complexdatacollective/architect
          FORCED: ${{ (github.event_name == 'workflow_dispatch' && (inputs.release_app == 'architect' || inputs.release_app == 'both')) }}
          GH_TOKEN: ${{ secrets.LEGACY_RELEASE_GH_TOKEN }}
        run: bash .github/scripts/detect-legacy-release.sh
      - name: Detect interviewer release
        id: interviewer
        env:
          PKG_JSON: apps/interviewer-classic/package.json
          EXTERNAL_REPO: complexdatacollective/interviewer
          FORCED: ${{ (github.event_name == 'workflow_dispatch' && (inputs.release_app == 'interviewer' || inputs.release_app == 'both')) }}
          GH_TOKEN: ${{ secrets.LEGACY_RELEASE_GH_TOKEN }}
        run: bash .github/scripts/detect-legacy-release.sh

  interviewer-release-build:
    needs: legacy-release-detect
    if: needs.legacy-release-detect.outputs.interviewer_released == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: ./.github/actions/turbo-ci-setup
        with:
          ignore-scripts: 'false'
      - name: Build app + workspace deps
        run: pnpm exec turbo run build --filter=@codaco/interviewer-classic
      # Build only — the release lifecycle (tag, draft, attach, publish) is owned
      # by the mirror + publish jobs, so electron-builder must not publish.
      # Use the same proven signing/notarization secrets as the standalone
      # classic-app build workflow. Windows ships unsigned (no CSC_LINK).
      - name: Package
        working-directory: apps/interviewer-classic
        env:
          CSC_LINK: ${{ matrix.os == 'macos-latest' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.os == 'macos-latest' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ matrix.os == 'macos-latest' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.os == 'macos-latest' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.os == 'macos-latest' && secrets.APPLE_TEAM_ID || '' }}
        run: pnpm exec electron-builder --${{ matrix.platform }} --config electron-builder.config.cjs --publish never
      # Verify the packaged app before its artifacts leave this job: an
      # exhaustive module-resolution sweep over the asar (run inside the
      # packaged binary itself) plus a boot smoke test that requires a
      # renderer process to appear (macOS/Linux; Windows runs the sweep
      # only). Either check would have blocked the broken 6.6.0 releases,
      # where `files` exclusions stripped runtime modules from the asar and
      # the apps crashed at launch. See scripts/verify-packaged-app.mjs.
      - name: Verify packaged app
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq xvfb
            xvfb-run --auto-servernum node scripts/verify-packaged-app.mjs --app apps/interviewer-classic
          else
            node scripts/verify-packaged-app.mjs --app apps/interviewer-classic
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Distinct prefix so the publish job's glob doesn't also collect the
          # `interviewer-*` artifacts built in the same run.
          name: interviewer-release-${{ matrix.platform }}
          path: apps/interviewer-classic/release-builds/*
          if-no-files-found: error
          retention-days: 30

  architect-release-build:
    needs: legacy-release-detect
    if: needs.legacy-release-detect.outputs.architect_released == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: ./.github/actions/turbo-ci-setup
        with:
          ignore-scripts: 'false'
      - name: Build app + workspace deps
        run: pnpm exec turbo run build --filter=@codaco/architect-classic
      # Build only — the release lifecycle (tag, draft, attach, publish) is owned
      # by the mirror + publish jobs, so electron-builder must not publish.
      # Use the same proven signing/notarization secrets as the standalone
      # classic-app build workflow. Windows ships unsigned (no CSC_LINK,
      # no certificateSubjectName).
      - name: Package
        working-directory: apps/architect-classic
        env:
          CSC_LINK: ${{ matrix.os == 'macos-latest' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.os == 'macos-latest' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ matrix.os == 'macos-latest' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.os == 'macos-latest' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.os == 'macos-latest' && secrets.APPLE_TEAM_ID || '' }}
        run: pnpm exec electron-builder --${{ matrix.platform }} --config electron-builder.config.js --publish never
      # Verify the packaged app before its artifacts leave this job — see the
      # matching step in interviewer-release-build for the rationale.
      - name: Verify packaged app
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq xvfb
            xvfb-run --auto-servernum node scripts/verify-packaged-app.mjs --app apps/architect-classic
          else
            node scripts/verify-packaged-app.mjs --app apps/architect-classic
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: architect-${{ matrix.platform }}
          path: apps/architect-classic/release-builds/*
          if-no-files-found: error
          retention-days: 30

  # Mirror Interviewer source into complexdatacollective/interviewer master
  # (linear-append commit, npm-installable manifest, no node_modules) and create a
  # DRAFT GitHub release on that repo. Runs in parallel with the build job.
  interviewer-mirror:
    needs: legacy-release-detect
    if: needs.legacy-release-detect.outputs.interviewer_released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      mirror_sha: ${{ steps.mirror.outputs.mirror_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: '.nvmrc'
      - name: Mirror source to external master
        id: mirror
        env:
          LEGACY_RELEASE_GH_TOKEN: ${{ secrets.LEGACY_RELEASE_GH_TOKEN }}
          MONOREPO_SHA: ${{ github.sha }}
        run: >-
          node scripts/mirror-app.mjs
          --app apps/interviewer-classic
          --repo complexdatacollective/interviewer
          --version ${{ needs.legacy-release-detect.outputs.interviewer_version }}
      - name: Extract release notes
        run: >-
          node scripts/release-notes.mjs
          --app apps/interviewer-classic
          --pkg @codaco/interviewer-classic
          --version ${{ needs.legacy-release-detect.outputs.interviewer_version }}
          --out "${RUNNER_TEMP}/notes.md"
      - name: Create draft release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          repository: complexdatacollective/interviewer
          token: ${{ secrets.LEGACY_RELEASE_GH_TOKEN }}
          tag_name: v${{ needs.legacy-release-detect.outputs.interviewer_version }}
          target_commitish: ${{ steps.mirror.outputs.mirror_sha }}
          name: ${{ needs.legacy-release-detect.outputs.interviewer_version }}
          body_path: ${{ runner.temp }}/notes.md
          draft: true
          make_latest: 'false'

  # Collect Interviewer platform artifacts, attach to the draft release, publish it.
  interviewer-release-publish:
    needs:
      [legacy-release-detect, interviewer-mirror, interviewer-release-build]
    if: needs.legacy-release-detect.outputs.interviewer_released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: interviewer-release-*
          merge-multiple: true
      - run: ls -la artifacts/
      - name: Attach artifacts and publish
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          repository: complexdatacollective/interviewer
          token: ${{ secrets.LEGACY_RELEASE_GH_TOKEN }}
          tag_name: v${{ needs.legacy-release-detect.outputs.interviewer_version }}
          files: artifacts/*
          fail_on_unmatched_files: true
          draft: false
          # The website resolves Classic installers from this repository's
          # releases/latest endpoint during its static build.
          make_latest: 'true'

  # Mirror Architect source into complexdatacollective/architect master and create
  # a DRAFT release. Builds the Interviewer preview bundle first so it can be
  # vendored into the mirror (the standalone repo has no monorepo sibling to copy
  # ../interviewer-classic/out from).
  architect-mirror:
    needs: legacy-release-detect
    if: needs.legacy-release-detect.outputs.architect_released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      mirror_sha: ${{ steps.mirror.outputs.mirror_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Build Interviewer preview bundle (vendored into the mirror)
        run: pnpm exec turbo run build --filter=@codaco/interviewer-classic
      - name: Mirror source to external master
        id: mirror
        env:
          LEGACY_RELEASE_GH_TOKEN: ${{ secrets.LEGACY_RELEASE_GH_TOKEN }}
          MONOREPO_SHA: ${{ github.sha }}
        run: >-
          node scripts/mirror-app.mjs
          --app apps/architect-classic
          --repo complexdatacollective/architect
          --version ${{ needs.legacy-release-detect.outputs.architect_version }}
      - name: Extract release notes
        run: >-
          node scripts/release-notes.mjs
          --app apps/architect-classic
          --pkg @codaco/architect-classic
          --version ${{ needs.legacy-release-detect.outputs.architect_version }}
          --out "${RUNNER_TEMP}/notes.md"
      - name: Create draft release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          repository: complexdatacollective/architect
          token: ${{ secrets.LEGACY_RELEASE_GH_TOKEN }}
          tag_name: v${{ needs.legacy-release-detect.outputs.architect_version }}
          target_commitish: ${{ steps.mirror.outputs.mirror_sha }}
          name: ${{ needs.legacy-release-detect.outputs.architect_version }}
          body_path: ${{ runner.temp }}/notes.md
          draft: true
          make_latest: 'false'

  # Collect Architect platform artifacts, attach to the draft release, publish it.
  architect-release-publish:
    needs: [legacy-release-detect, architect-mirror, architect-release-build]
    if: needs.legacy-release-detect.outputs.architect_released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: architect-*
          merge-multiple: true
      - run: ls -la artifacts/
      - name: Attach artifacts and publish
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          repository: complexdatacollective/architect
          token: ${{ secrets.LEGACY_RELEASE_GH_TOKEN }}
          tag_name: v${{ needs.legacy-release-detect.outputs.architect_version }}
          files: artifacts/*
          fail_on_unmatched_files: true
          draft: false
          # The website resolves Classic installers from this repository's
          # releases/latest endpoint during its static build.
          make_latest: 'true'

  # Classic download metadata is embedded into networkcanvas.com's static HTML
  # at build time. Rebuild the production site after either external release is
  # published so releases/latest is reflected without waiting for an unrelated
  # website version bump. If a website release is part of the same main push,
  # wait for it first and make this refresh the final production deployment.
  refresh-website-after-classic-release:
    needs:
      - apps-release-website
      - interviewer-release-publish
      - architect-release-publish
    if: >-
      always()
      && (needs.interviewer-release-publish.result == 'success'
      || needs.architect-release-publish.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: apps-release-networkcanvas.com-production
      cancel-in-progress: false
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      # Classic release metadata is an external build input, so it cannot be
      # represented in Turbo's source hash. Always execute the static build.
      TURBO_FORCE: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          # A Classic build can take much longer than a later website release.
          # Build the current production source instead of this run's older SHA.
          ref: main
          persist-credentials: false
      - uses: ./.github/actions/turbo-ci-setup
      - name: Rebuild networkcanvas.com with the latest Classic releases
        # This job also deploys to production, so it uploads source maps too.
        # netlify-cli performs the build (--build), so the credentials cannot be
        # narrowed past this step; they stay off the job regardless.
        env:
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          POSTHOG_PROJECT_ID: ${{ secrets.POSTHOG_PROJECT_ID }}
        run: |
          json=$(npx --yes netlify-cli@26 deploy --build --prod \
                   --filter=networkcanvas.com \
                   --site="${{ secrets.NETLIFY_SITE_ID_WEBSITE }}" --json)
          echo "$json" | jq .

  # Carry forward prior statuses for conditional jobs that the current
  # push didn't touch. Push-to-push detection (see detect job)
  # deliberately re-runs a job ONLY when its package changed between
  # consecutive PR commits, but GitHub renders the latest workflow run's
  # check list — so jobs that ran on an earlier PR commit would appear
  # "skipped" on the new tip and (depending on branch protection config)
  # block merge.
  #
  # This step republishes a check_run on the current SHA — same name,
  # same conclusion as the job's most recent CONCLUSIVE prior run —
  # pointing at that run. Crucially it carries the prior verdict faithfully:
  # a job that last FAILED for unchanged code stays red, rather than being
  # masked by an even-older green run. Branch protection sees the
  # most-recent check_run for each name, so a still-valid pass merges
  # without re-running and a still-valid failure keeps blocking — both
  # without burning runner time re-executing work that hasn't changed.
  #
  # First push on a PR: no prior runs exist, so nothing to carry; the
  # detect logic already runs the relevant jobs at least once because
  # the push diff IS the cumulative PR diff on the first commit.
  # E2E jobs are deliberately excluded: feature PRs select suites from the
  # cumulative merge-base-to-head diff, while release PRs let e2e-policy
  # decide when an equivalent earlier verdict may be reused. The required
  # quality gate checks that current policy decision in both cases.
  carry-forward-statuses:
    needs:
      - detect
      - docs-preview-checks
      - website-preview-checks
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          # Map detect flag → list of conditional jobs gated on it.
          # interview-e2e-report is deliberately NOT here: it is a dependent,
          # reporting-only job (publishes the Playwright report to Pages +
          # comments) whose own `if:` already skips it whenever interview-e2e is
          # skipped. Its verdict describes whether the report PUBLISHED, not
          # whether the code is sound, so carrying a stale (possibly failed)
          # report verdict onto an unrelated push would wrongly gate it — let
          # its natural skip stand instead.
          FLAG_DOCS: ${{ needs.detect.outputs.docs }}
          FLAG_WEBSITE: ${{ needs.detect.outputs.website }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const flagToJobs = {
              FLAG_DOCS: ["docs-preview-checks"],
              FLAG_WEBSITE: ["website-preview-checks"],
            };

            // Only consider jobs the current run didn't execute (flag false).
            // If a flag is true, the real job ran on this commit and its own
            // check_run already reflects the outcome — no carry-forward needed.
            const skippedJobs = Object.entries(flagToJobs).flatMap(
              ([flag, jobs]) => (process.env[flag] === "false" ? jobs : []),
            );
            if (skippedJobs.length === 0) {
              core.info("No skipped conditional jobs on this run; nothing to carry forward.");
              return;
            }

            // Walk prior workflow runs on this PR's source branch, most recent
            // first, looking for the latest CONCLUSIVE execution of each skipped
            // job — the run whose verdict still describes the current code,
            // since the job was skipped on this push precisely because its
            // package didn't change. The first conclusive verdict we encounter
            // is authoritative whether it passed or failed; carrying a stale
            // success over an intervening failure would misrepresent the branch.
            // "success", "failure" and "timed_out" are conclusive verdicts;
            // "skipped", "cancelled" (superseded by a newer push — see the
            // cancel-in-progress concurrency above) and in-flight runs carry no
            // verdict, so we walk past them.
            const CONCLUSIVE = new Set(["success", "failure", "timed_out"]);
            const remaining = new Set(skippedJobs);
            const resolutions = new Map();
            let page = 1;
            const PER_PAGE = 50;
            const MAX_RUNS = 200; // safety cap; PRs rarely have 200 runs.
            let scanned = 0;

            outer: while (remaining.size > 0 && scanned < MAX_RUNS) {
              const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                branch: process.env.PR_HEAD_REF,
                event: "pull_request",
                per_page: PER_PAGE,
                page,
              });
              if (data.workflow_runs.length === 0) break;

              for (const run of data.workflow_runs) {
                scanned += 1;
                // Skip the run we're currently inside of.
                if (run.id === context.runId) continue;
                // Skip runs against the same commit (re-runs of the same SHA
                // don't introduce new information).
                if (run.head_sha === process.env.PR_HEAD_SHA) continue;
                // Pull the job list for this run.
                const { data: jobs } = await github.rest.actions.listJobsForWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id,
                  per_page: 100,
                });
                for (const job of jobs.jobs) {
                  if (!remaining.has(job.name)) continue;
                  if (!CONCLUSIVE.has(job.conclusion)) continue;
                  resolutions.set(job.name, { run, job });
                  remaining.delete(job.name);
                }
                if (remaining.size === 0) break outer;
              }
              if (data.workflow_runs.length < PER_PAGE) break;
              page += 1;
            }

            for (const [name, { run, job }] of resolutions) {
              const conclusion = job.conclusion;
              const passed = conclusion === "success";
              const outcome = passed
                ? `ran successfully`
                : `last ran to a \`${conclusion}\` conclusion`;
              await github.rest.checks.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name,
                head_sha: context.sha,
                status: "completed",
                conclusion,
                details_url: job.html_url,
                output: {
                  title: `Carried forward from ${run.head_sha.substring(0, 7)}`,
                  summary: [
                    `This job ${outcome} on an earlier commit of this PR and the latest push did not touch its package, so it was not re-executed. That result still applies to the current code.`,
                    ``,
                    `Source run: [#${run.run_number}](${run.html_url}) on commit \`${run.head_sha.substring(0, 7)}\`.`,
                  ].join("\n"),
                },
              });
              core.info(`Carried forward ${name} (${conclusion}) from run #${run.run_number} (${run.head_sha.substring(0, 7)}).`);
            }

            for (const name of remaining) {
              core.info(`No prior conclusive run found for ${name}; leaving its skipped status as-is.`);
            }

name: Hotfix Release

# Releases Architect, Interviewer or Fresco from a branch that is NOT main.
#
# The normal lane (`apps-release-detect` + `apps-release-<app>` in
# ci-and-release.yml) builds whatever is on main, so it can only ship a patch
# together with everything else merged since the last release. When main
# carries work that is not ready to go out, the only way to ship a fix alone is
# a branch cut from the released tag — and nothing on such a branch can trigger
# the normal lane, which fires exclusively on push-to-main. This workflow is
# that missing trigger: the same verify → build → tag → release steps, run
# against a ref named at dispatch time.
#
# Architect and Interviewer deploy their built tree to Netlify. Fresco releases
# by mirroring its source into its own repository, whose image build installs
# the PUBLISHED `@codaco/*` packages rather than workspace source — so a library
# fix cherry-picked onto a Fresco hotfix branch would never reach the image on
# its own. The Fresco path therefore mirrors the branch with every workspace
# package changed since the release tag (and its dependents) vendored as
# tarballs the image installs instead (scripts/mirror-app.mjs
# --vendor-changed-since). Nothing is published to npm.
#
# The workflow is dispatched FROM main and takes the branch to release as an
# input, so the job definition — which steps run, which secrets they see, which
# guards they pass — is reviewed code from the protected branch. Only the tree
# that gets built comes from the hotfix branch.
#
# NOTE(human-setup-required): that separation is a convention this file cannot
# enforce. GitHub runs whichever copy of a workflow lives on the ref a dispatch
# selects, so a writer who selects their own branch runs their own definition —
# including one with the guard below and the `environment:` line deleted. No
# check written here survives that, because the attacker edits the check. The
# same is already true of any workflow in this repository that a branch can
# trigger, so this lane widens nothing; what closes it is configuration:
# `<app>-hotfix-production` needs required reviewers AND its deployment branches
# restricted to main, with the deploy credentials held as environment secrets
# rather than repository secrets. See each app's RELEASING.md (Fresco:
# apps/fresco/CLAUDE.md).
#
# Procedure (see each app's RELEASING.md):
#   1. Cut `hotfix/<app>-<version>` from the released tag, cherry-pick the fix,
#      bump package.json and CHANGELOG.md, push the branch.
#   2. Run this workflow from main with `source_ref` set to that branch.
#   3. Record the released version on main afterwards, or the normal lane's tag
#      guard will silently swallow main's next release.

on:
  workflow_dispatch:
    inputs:
      app:
        description: App to release
        required: true
        type: choice
        options:
          - interviewer
          - architect
          - fresco
      source_ref:
        description: Branch or tag to release (e.g. hotfix/interviewer-8.1.3)
        required: true
        type: string

permissions:
  contents: read

# The same group the normal lane's apps-release-<app> job uses. Version checks
# alone cannot order the two lanes: each job deploys before it tags, so a
# re-check can read a stale newest-tag and put older code live in the window
# before the other lane's tag appears. Only mutual exclusion over the whole
# check → deploy → tag sequence closes that, which means one group per app,
# without the version. The normal lane names the Netlify apps by their scoped
# package and Fresco by its bare one, so the group is spelled the same way.
#
# The cost is that a versionless group keeps only one pending run, so a release
# queued behind two others can be dropped before it ever tags. Its code is not
# lost — the next release contains it — and its notes are not either: both lanes
# pass `--since <newest released version>` to release-notes.mjs, so a release
# body carries every CHANGELOG section skipped that way.
concurrency:
  group: apps-release-${{ inputs.app == 'fresco' && 'fresco' || format('@codaco/{0}', inputs.app) }}
  cancel-in-progress: false

jobs:
  hotfix-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ inputs.app }}-hotfix-production
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      newest: ${{ steps.version.outputs.newest }}
    # No credential at job level: every step below that runs code from the
    # hotfix branch (verify, build, stage) would see it. The deploy step
    # names the Netlify token itself, and the Fresco push token never enters
    # this job at all (see fresco-publish).
    env:
      APP: ${{ inputs.app }}
      SOURCE_REF: ${{ inputs.source_ref }}
    steps:
      - name: Validate the dispatch
        # DISPATCH_REF comes through the environment, never interpolated into the
        # script: `$(...)` is a legal git ref name, and an expression pasted
        # straight into bash would execute it before this check could reject it —
        # with the environment's deploy credentials already in scope.
        env:
          DISPATCH_REF: ${{ github.ref }}
        run: |
          if [[ "$DISPATCH_REF" != 'refs/heads/main' ]]; then
            echo "::error::Dispatch this workflow from main and name the branch to release in source_ref. Running it from a branch would take the job definition from that branch too." >&2
            exit 1
          fi
          if [[ "$SOURCE_REF" == 'main' ]]; then
            echo "::error::main releases through apps-release-<app> in ci-and-release.yml. This lane exists for hotfix branches cut from a release tag." >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ inputs.source_ref }}
          fetch-tags: true
          # Full history: the validator checks that this tree descends from the
          # newest release tag, which a shallow clone cannot answer, and the
          # Fresco path diffs the tree against that tag.
          fetch-depth: 0
          persist-credentials: false

      # The ref being released is a branch cut from a release tag, so its copy of
      # this lane's tooling is whatever existed then — the validator did not
      # exist at all, release-notes.mjs predates `--since` and would ignore it
      # silently, and the mirror predates vendoring. All of it comes from the
      # dispatching main commit instead, which is also the only copy anyone
      # has reviewed. Each script reads its inputs (package.json, git tags, the
      # app's CHANGELOG, the workspace) relative to the working directory rather
      # than to its own location, so they operate on the ref's tree while
      # living outside it. One consequence: release-notes.mjs looks for a
      # dedicated `release-*` changeset under `.hotfix-lane`, which the sparse
      # checkout omits, so it always takes its CHANGELOG path here.
      - name: Check out the lane's tooling from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.sha }}
          path: .hotfix-lane
          sparse-checkout: |
            .github/scripts
            scripts
            apps/architect/scripts
          persist-credentials: false

      - name: Resolve the released commit
        id: commit
        # Compares commits, not strings: `refs/heads/main` and a raw SHA both
        # slip past a literal 'main' check and would start a second release path
        # for the very tree the normal lane owns. `.hotfix-lane` is checked out
        # at the dispatching main commit, so its HEAD is main's tip.
        run: |
          sha=$(git rev-parse HEAD)
          if [[ "$sha" == "$(git -C .hotfix-lane rev-parse HEAD)" ]]; then
            echo "::error::source_ref '$SOURCE_REF' resolves to main. main releases through apps-release-<app> in ci-and-release.yml." >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Resolve and validate the version
        id: version
        run: node .hotfix-lane/.github/scripts/resolve-hotfix-release.mjs

      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile --ignore-scripts

      # A hotfix branch has no required `quality` gate behind it, and workspace
      # packages are consumed as source — a fix cherry-picked into a dependency
      # compiles straight into the app. The filter therefore covers the app's
      # whole dependency closure (`...`), not just the app. The package name is
      # the resolver's: scoped for the Netlify apps, bare for Fresco. Fresco's
      # tasks depend on `fresco#codegen` in turbo.json, which regenerates the
      # Prisma client and Next types the `--ignore-scripts` install skipped.
      - name: Verify the app and its workspace dependencies
        env:
          PKG: ${{ steps.version.outputs.package }}
          SKIP_ENV_VALIDATION: 'true'
        run: pnpm exec turbo run typecheck test --filter="${PKG}..."

      - name: Build ${{ inputs.app }}
        if: inputs.app != 'fresco'
        # Scoped to this step alone, exactly as in the normal lane: only the
        # build needs the PostHog credentials that switch source-map upload on,
        # and keeping them off the job means the deploy step's dynamically
        # fetched netlify-cli never sees them.
        env:
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          POSTHOG_PROJECT_ID: ${{ secrets.POSTHOG_PROJECT_ID }}
        run: pnpm exec turbo run build --filter="@codaco/$APP"

      # Fresco's image is built by its own repository from the mirrored tree;
      # what this job builds is the workspace dependency closure, so the
      # packages the mirror vendors can be packed (pnpm pack applies
      # publishConfig, which points at dist/). Same filter as the release
      # test's build-image.sh.
      - name: Build Fresco's workspace dependencies
        if: inputs.app == 'fresco'
        env:
          SKIP_ENV_VALIDATION: 'true'
        run: pnpm exec turbo run build --filter='fresco^...'

      # The build takes minutes, during which the normal lane can tag and deploy
      # a newer version. Re-fetch tags and re-run the same validator, so a hotfix
      # that has been overtaken aborts here instead of putting older code live.
      - name: Re-check the version against the newest release
        run: |
          # Anonymous fetch over https (the checkout persists no credentials);
          # a failure here fails the step rather than validating stale tags.
          git fetch --tags --force origin
          node .hotfix-lane/.github/scripts/resolve-hotfix-release.mjs

      # Claimed BEFORE the deploy, deliberately. Tagging afterwards fails
      # unsafely: a deploy whose tag step then errors leaves production carrying
      # a release that neither lane's guard can see, so the next normal release
      # quietly overwrites it. This way the inconsistency points the other way —
      # a tag with nothing live, which blocks later releases until someone
      # reconciles it, and is visible on a run that has already gone red.
      # Creating the ref through the API is atomic, so a duplicate run fails
      # here rather than racing. If the deploy below fails, delete this tag
      # before re-dispatching (see the app's RELEASING.md).
      - name: Claim the release tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$TAG" \
            -f sha="$SHA"

      # Architect deployments expose their source commit at /build-info.json
      # (apps/architect/scripts/write-build-info.mjs; the release-test workflow
      # verifies it). Run MAIN's copy of the script — a hotfix branch cut from
      # an older tag may predate it — pointed at the hotfix tree's dist, and
      # pass the hotfix source commit explicitly: GITHUB_SHA here is the main
      # commit this workflow ran from, not the deployed code.
      - name: Stamp deployed commit
        if: inputs.app == 'architect'
        env:
          COMMIT_REF: ${{ steps.commit.outputs.sha }}
        run: node .hotfix-lane/apps/architect/scripts/write-build-info.mjs apps/architect/dist

      - name: Deploy ${{ inputs.app }} to production
        if: inputs.app != 'fresco'
        # Both site ids come in as environment variables and the app picks one in
        # bash. A `inputs.app == 'x' && secrets.A || secrets.B` expression would
        # silently fall through to the *other* app's site whenever the selected
        # secret is unset — deploying, say, Interviewer over Architect's
        # production site instead of failing for the missing setup.
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          SITE_ID_INTERVIEWER: ${{ secrets.NETLIFY_SITE_ID_INTERVIEWER }}
          SITE_ID_ARCHITECT: ${{ secrets.NETLIFY_SITE_ID_ARCHITECT }}
        run: |
          case "$APP" in
            interviewer) site="$SITE_ID_INTERVIEWER"; secret=NETLIFY_SITE_ID_INTERVIEWER ;;
            architect) site="$SITE_ID_ARCHITECT"; secret=NETLIFY_SITE_ID_ARCHITECT ;;
            *) echo "::error::No production site is configured for '$APP'." >&2; exit 1 ;;
          esac
          if [[ -z "$site" ]]; then
            echo "::error::$secret is unset. See apps/$APP/RELEASING.md for the one-time setup." >&2
            exit 1
          fi
          npx --yes netlify-cli@22 deploy --no-build --prod \
            --filter="@codaco/$APP" \
            --dir="apps/$APP/dist" \
            --site="$site"

      # Fresco's production target is its repository's `main`: the push is what
      # triggers the GHCR image build there, exactly as in the normal lane.
      # This job only STAGES that push. Staging runs code from the hotfix
      # branch — `pnpm pack` runs each vendored package's lifecycle scripts —
      # so it holds no push credential; the staged tree goes to
      # `fresco-publish` as an artifact, and that job pushes it without ever
      # checking out the branch. Vendored against the newest release tag — the
      # one this branch was cut from, which the validator has just confirmed —
      # so every workspace package the hotfix changed goes into the image from
      # this tree, and everything it did not touch installs at the registry
      # versions the released image already used: the resolution starts from
      # the lockfile the Fresco repository holds at that release (`v<newest>`
      # there), so unchanged packages keep their exact released versions
      # rather than the newest their ranges admit. The mirror script's own
      # lockfile guard fails the step if a vendored package still resolves
      # from the registry.
      - name: Stage the Fresco mirror
        if: inputs.app == 'fresco'
        env:
          MIRROR_STAGE_DIR: ${{ runner.temp }}/fresco-mirror/stage
          VERSION: ${{ steps.version.outputs.version }}
          NEWEST: ${{ steps.version.outputs.newest }}
          NEWEST_TAG: ${{ steps.version.outputs.newest_tag }}
        run: |
          if [[ -z "$NEWEST_TAG" ]]; then
            echo "::error::No released fresco@ tag to vendor against. A hotfix presupposes a release; the first Fresco release goes through the normal lane." >&2
            exit 1
          fi
          node .hotfix-lane/scripts/mirror-app.mjs \
            --app apps/fresco \
            --repo complexdatacollective/Fresco \
            --branch main \
            --version "$VERSION" \
            --with-lockfile \
            --vendor-changed-since "$NEWEST_TAG" \
            --seed-lockfile-from "v$NEWEST" \
            --stage-only

      - name: Release notes
        # --since is the newest version released before this one, so the body
        # also carries any CHANGELOG section whose own release run was dropped
        # while pending on the shared lock above.
        env:
          PKG: ${{ steps.version.outputs.package }}
          VERSION: ${{ steps.version.outputs.version }}
          SINCE: ${{ steps.version.outputs.newest }}
        run: >-
          node .hotfix-lane/scripts/release-notes.mjs
          --app "apps/$APP"
          --pkg "$PKG"
          --version "$VERSION"
          --since "$SINCE"
          --out "${RUNNER_TEMP}/hotfix-notes.md"

      # A tarball keeps file modes (the mirrored tree carries shell scripts the
      # image runs) where a plain artifact upload would not, and the notes ride
      # along so fresco-publish reads nothing from the branch.
      - name: Package the staged mirror for fresco-publish
        if: inputs.app == 'fresco'
        run: |
          tar -czf "${RUNNER_TEMP}/fresco-mirror/stage.tgz" -C "${RUNNER_TEMP}/fresco-mirror/stage" .
          cp "${RUNNER_TEMP}/hotfix-notes.md" "${RUNNER_TEMP}/fresco-mirror/notes.md"
          rm -rf "${RUNNER_TEMP}/fresco-mirror/stage"
      - name: Upload the staged mirror
        if: inputs.app == 'fresco'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fresco-mirror
          path: ${{ runner.temp }}/fresco-mirror
          if-no-files-found: error
          retention-days: 3

      # The tag already exists from the claim step; this only attaches the
      # release notes to it. Always the newest line — resolve-hotfix-release.mjs
      # refuses anything older than the current release.
      - name: Create the release
        if: inputs.app != 'fresco'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ steps.commit.outputs.sha }}
          name: ${{ steps.version.outputs.label }} ${{ steps.version.outputs.version }}
          body_path: ${{ runner.temp }}/hotfix-notes.md
          prerelease: false
          make_latest: 'true'

  # The push to the Fresco repository, from a job that has never checked out
  # the branch being released: it takes the staged tree from the artifact,
  # main's mirror tooling from the dispatching commit, and executes nothing
  # from either tree — git treats the stage as content, and a fresh clone has
  # no hooks. This is the only job that sees LEGACY_RELEASE_GH_TOKEN, which can
  # push Fresco's `main` and so publish `latest`; a hotfix branch's build
  # scripts, run in the job above, cannot reach it. The environment gates this
  # job separately from the one above, so a protected environment asks twice
  # for a Fresco hotfix.
  fresco-publish:
    needs: hotfix-release
    if: inputs.app == 'fresco'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: fresco-hotfix-production
    permissions:
      contents: write
    steps:
      # main's tooling only, plus .nvmrc for the Node version. No workspace:
      # the publish phase reads nothing but the staged tree.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            scripts
            .nvmrc
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: '.nvmrc'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fresco-mirror
          path: ${{ runner.temp }}/fresco-mirror
      - name: Unpack the staged mirror
        run: |
          mkdir -p "${RUNNER_TEMP}/fresco-mirror/stage"
          tar -xzf "${RUNNER_TEMP}/fresco-mirror/stage.tgz" -C "${RUNNER_TEMP}/fresco-mirror/stage"

      - name: Push the mirror to the Fresco repository
        id: mirror
        env:
          LEGACY_RELEASE_GH_TOKEN: ${{ secrets.LEGACY_RELEASE_GH_TOKEN }}
          MONOREPO_SHA: ${{ needs.hotfix-release.outputs.sha }}
          VERSION: ${{ needs.hotfix-release.outputs.version }}
        run: >-
          node scripts/mirror-app.mjs
          --publish-from "${RUNNER_TEMP}/fresco-mirror/stage"
          --repo complexdatacollective/Fresco
          --branch main
          --version "$VERSION"

      # Fresco's releases live in two places, as in the normal lane: the
      # user-facing one on the Fresco repository at the mirrored commit, and
      # the record on this repository's tag (claimed by the job above) that
      # the normal lane's guards read.
      - name: Create the release on the Fresco repository
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          repository: complexdatacollective/Fresco
          token: ${{ secrets.LEGACY_RELEASE_GH_TOKEN }}
          tag_name: v${{ needs.hotfix-release.outputs.version }}
          target_commitish: ${{ steps.mirror.outputs.mirror_sha }}
          name: Fresco v${{ needs.hotfix-release.outputs.version }}
          body_path: ${{ runner.temp }}/fresco-mirror/notes.md
          prerelease: false
          make_latest: 'true'
      - name: Record the Fresco release on this repository's tag
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.hotfix-release.outputs.tag }}
          target_commitish: ${{ needs.hotfix-release.outputs.sha }}
          name: Fresco ${{ needs.hotfix-release.outputs.version }}
          body_path: ${{ runner.temp }}/fresco-mirror/notes.md
          prerelease: false
          make_latest: 'false'

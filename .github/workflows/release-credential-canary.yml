name: Release credential canary

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: release-credential-canary
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cross-repo-write:
    name: Cross-repository write access
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify the release token can push every mirror
        env:
          RELEASE_TOKEN: ${{ secrets.LEGACY_RELEASE_GH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$RELEASE_TOKEN" ]]; then
            echo '::error::LEGACY_RELEASE_GH_TOKEN is not configured'
            exit 1
          fi

          auth_header=$(printf 'x-access-token:%s' "$RELEASE_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$auth_header"

          for target in \
            'complexdatacollective/Fresco:main' \
            'complexdatacollective/Architect:master' \
            'complexdatacollective/Interviewer:master'; do
            repository=${target%:*}
            branch=${target##*:}
            probe_dir=$(mktemp -d)

            branch_rules=$(curl \
              --fail-with-body \
              --silent \
              --show-error \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $RELEASE_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${repository}/rules/branches/${branch}")

            if [[ "$(jq 'length' <<<"$branch_rules")" -ne 0 ]]; then
              echo "::error::${repository}:${branch} has effective branch rules; the canary cannot prove the release push is allowed"
              jq -r '.[].type' <<<"$branch_rules"
              exit 1
            fi

            git \
              -c "http.extraHeader=Authorization: Basic $auth_header" \
              clone \
              --bare \
              --depth=1 \
              --branch "$branch" \
              "https://github.com/${repository}.git" \
              "$probe_dir"

            if ! git \
              -C "$probe_dir" \
              -c "http.extraHeader=Authorization: Basic $auth_header" \
              push \
              --dry-run \
              origin \
              "$branch:refs/heads/network-canvas-release-token-canary"; then
              echo "::error::LEGACY_RELEASE_GH_TOKEN cannot push ${repository}:${branch}"
              exit 1
            fi
          done

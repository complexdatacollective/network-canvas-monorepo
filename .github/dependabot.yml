# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2

# Every version update — npm and GitHub Actions, patch through major — arrives
# as one weekly pull request. One PR also keeps lock-step families together
# (@playwright/test + playwright, storybook + @storybook/*, vitest + @vitest/*,
# react + react-dom, next + @next/*, @tiptap/*, the Tailwind v4 core), which
# break the build when one member moves without its siblings.
#
# Dependabot drops from the PR any dependency it cannot update and still opens
# the rest, so check the PR's list against the families above. A family can
# also arrive split when its packages were published hours apart and the run
# falls inside the cooldown of only some of them (storybook 10.6.3, Oct 2026:
# @storybook/addon-docs shipped 80 minutes after the rest).
#
# Security (CVE) updates are not version updates: they still open one PR per
# advisory, immediately.
multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: 'weekly'

updates:
  - package-ecosystem: 'npm'
    directory: '/'
    patterns: ['*']
    multi-ecosystem-group: 'dependencies'
    # Align Dependabot with pnpm's minimumReleaseAge gate (24h — see
    # pnpm-workspace.yaml): hold routine version-update PRs until the release is
    # at least a day old, by which point the pnpm age gate also accepts it, so
    # the PR's CI is green on arrival instead of failing the frozen install.
    # NOTE: cooldown applies to VERSION updates only — it does NOT delay
    # security (CVE) updates, which still open immediately against a freshly
    # published fix. Those are handled by the dependabot age-gate exempt
    # workflows, which add a narrow, version-pinned minimumReleaseAgeExclude
    # entry.
    cooldown:
      default-days: 1
    # The legacy apps (apps/architect-classic, apps/interviewer-classic) pin
    # strict dependency versions and break on routine version bumps.
    # exclude-paths (GA Aug 2025) is applied before manifest parsing, so
    # Dependabot never reads these package.json files and never opens
    # version-update PRs that touch them. The modern apps keep receiving all
    # updates, including dependencies the legacy apps also use (react, vite,
    # electron, ...). Paths are relative to the repo root. Note: exclude-paths
    # suppresses version updates only — it does NOT stop security (CVE) update
    # PRs, which are repo-level and can still target the legacy apps.
    exclude-paths:
      - 'apps/architect-classic/**'
      - 'apps/interviewer-classic/**'
    # @types/node follows the Node runtime (.nvmrc), not the newest types: a
    # major ahead describes APIs the runtime does not have. Move it with Node.
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: 'github-actions'
    directory: '/'
    patterns: ['*']
    multi-ecosystem-group: 'dependencies'
    # Same 1-day cooldown posture for action updates — don't adopt a brand-new
    # action release the day it ships.
    cooldown:
      default-days: 1

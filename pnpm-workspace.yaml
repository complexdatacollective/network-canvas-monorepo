packages:
  - apps/*
  # Studio is two deployables plus a leaf boundary package (#1244); its
  # halves nest under apps/studio/.
  - apps/studio/*
  - packages/*
  - tooling/*
  - workers/*

allowBuilds:
  '@clerk/shared': true
  '@parcel/watcher': true
  '@swc/core': true
  '@tailwindcss/oxide': true
  bufferutil: true
  core-js: true
  core-js-pure: true
  esbuild: true
  sharp: true
  '@prisma/engines': true
  prisma: true
  unrs-resolver: true
  electron: false
  electron-winstaller: false
  protobufjs: false
  workerd: false
  '@posthog/cli': false
  msgpackr-extract: false

catalog:
  '@base-ui/react': ~1.8.0
  '@capacitor/android': ^8.5.2
  '@capacitor/app': ^8.1.1
  '@capacitor/assets': ^3.0.5
  '@capacitor/browser': ^8.0.4
  '@capacitor/cli': ^8.5.2
  '@capacitor/core': ^8.5.2
  '@capacitor/device': ^8.0.3
  '@capacitor/filesystem': ^8.1.3
  '@capacitor/ios': ^8.5.2
  '@capacitor/share': ^8.0.2
  '@capawesome/capacitor-file-picker': ^8.1.0
  '@chromatic-com/storybook': ^5.3.1
  # Every `@effect/*` entry must be the exact version `effect` is pinned to
  # below; the ecosystem ships one version number for all of them.
  '@effect/sql-pg': 4.0.0
  '@effect/platform-node': 4.0.0
  '@effect/vitest': 4.0.0
  # Held on 10.5: 10.6 reorganised the en first-name data, which moves every
  # seeded SyntheticInterview name and so every Storybook visual baseline.
  # Take 10.6+ in its own PR that updates the pinned SyntheticInterview
  # expectation and the baselines together.
  '@faker-js/faker': ~10.5.0
  '@fontsource-variable/inclusive-sans': ^5.3.0
  '@fontsource-variable/nunito': ^5.3.0
  # App-i18n tooling: programmatic message extraction (guards + extract
  # scripts) and build-time ICU-to-AST compilation for catalog JSON.
  '@formatjs/cli-lib': ^10.0.8
  '@formatjs/icu-messageformat-parser': ^3.5.20
  # oxc-based build transform (no babel) compiling defineMessages
  # defaultMessage strings to pre-parsed AST in @codaco/app-i18n's vite
  # integration, keeping the ICU parser out of production bundles.
  '@formatjs/unplugin': ^1.2.12
  # BCP 47 best-fit matching for app locale negotiation (@codaco/app-i18n);
  # the protocol localization design (§7.1) adopts this same entry when
  # protocol-validation's locale helpers land.
  '@formatjs/intl-localematcher': ^0.9.0
  '@microsoft/api-extractor': ^7.59.3
  '@next/bundle-analyzer': ^16.3.8
  '@next/third-parties': ^16.3.8
  # Keep in lock-step with `playwright` below (grouped in .github/dependabot.yml);
  # the interview-e2e Docker image tag is derived from this resolved version.
  '@playwright/test': ^1.63.0
  '@posthog/cli': ^0.18.9
  '@posthog/nextjs-config': ^1.11.1
  '@posthog/plugin-utils': ^2.0.0
  '@posthog/react': ^1.11.3
  '@radix-ui/react-slot': ^1.3.3
  '@reduxjs/toolkit': ^2.13.0
  '@storybook/addon-a11y': ^10.6.1
  '@storybook/addon-docs': ^10.6.1
  '@storybook/addon-mcp': ^10.6.1
  '@storybook/addon-vitest': ^10.6.1
  '@storybook/nextjs-vite': ^10.6.1
  '@storybook/react-vite': ^10.6.1
  '@tailwindcss/cli': ^4.3.3
  '@tailwindcss/postcss': ^4.3.3
  '@tailwindcss/typography': ^0.5.20
  '@tailwindcss/vite': ^4.3.3
  '@tanstack/react-query': ^5.104.0
  '@tanstack/react-table': ^9.2.4
  # Declared so the shared Vitest setup can call `configure()` on the very same
  # module instance the suites' own queries read. React Testing Library depends
  # on this range, so the catalog pin keeps it a single copy.
  '@testing-library/dom': ^10.4.2
  '@testing-library/jest-dom': ^7.0.1
  '@testing-library/react': ^16.3.3
  '@total-typescript/ts-reset': ^0.6.1
  '@types/node': ^24.19.0
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  # vite-plugin-dts/unplugin-dts needs the TypeScript JavaScript Compiler API,
  # which TS7 does not ship; it looks for this exact fallback package name.
  '@typescript/typescript6': ^6.0.2
  '@vitejs/plugin-react': ^6.1.1
  '@vitest/browser': ^5.0.3
  '@vitest/browser-playwright': ^5.0.3
  '@vitest/coverage-v8': ^5.0.3
  # The engine behind Storybook's a11y addon, used directly by the
  # protocol-builder suite so a heading ladder is judged by the same
  # `heading-order` rule a story is.
  axe-core: ^4.13.0
  # Pinned: 1.7.x is the first line whose peer range admits the pinned
  # drizzle-orm 1.0.0 RC (1.6.x pins ^0.45.2), and 1.7.5 is the first to declare
  # a Vitest 5 peer, so stay on 1.7.5 or newer.
  better-auth: 1.7.6
  chromatic: ^18.10.1
  # Matches the range `cva` itself depends on, so the joiner it hands `cva`'s
  # `cx` config option stays in lock-step with what `cva` was built against.
  clsx: ^2.1.1
  csvtojson: ^2.0.14
  dotenv: ^18.0.4
  # Pinned to the 1.0 RC, exactly (the rc dist-tag moves): stable drizzle-kit
  # 0.31.x `push` silently drops RLS policy USING/WITH CHECK expressions, which
  # #1249's tenancy layer depends on. Keep both in lock-step; unpin to a normal
  # range once 1.0.0 stable ships.
  #
  # The `rc5` snapshot rather than the `rc` tag (still 1.0.0-rc.4): rc.4's
  # `drizzle-orm/effect-postgres` entry point does not load on Effect
  # 4.0.0-rc.115 at all — it calls `Schema.TaggedErrorClass`, which Effect
  # removed, so importing it throws `Schema$1.TaggedErrorClass is not a
  # function` before any Studio code runs. rc.5 also adds the
  # `transaction(fn, config)` overload #1927 §9 needs to set an isolation
  # level on a tenant scope. Both packages move together, as the note above
  # requires.
  drizzle-kit: 1.0.0-rc.5-5935859
  drizzle-orm: 1.0.0-rc.5-5935859
  # Pinned exactly, with every `@effect/*` entry above in lock-step. Bumping is
  # a chore PR of its own.
  effect: 4.0.0
  electron: ^43.7.7
  electron-builder: ^26.16.1
  electron-vite: ^6.0.0-beta.1
  # ICU/localisation linting, run under oxlint's jsPlugins (descriptor
  # hygiene, ICU validity, call-site placeholder checking).
  eslint-plugin-formatjs: ^8.1.0
  es-toolkit: ^1.52.0
  fuse.js: ^7.5.0
  # Held on 30.0: 30.1.1 models focus across frames like a browser (focus
  # inside an iframe keeps the <iframe> focused in the outer document, and
  # `frame.blur()` no longer clears it), and fresco-ui's NavDrawer iframe test
  # then sees Base UI return focus to the <iframe> instead of the trigger.
  # Widen back to ^30 once that handoff is fixed for drawers rendered in frames.
  jsdom: ~30.0.1
  jszip: ^3.10.2
  lucide-react: ^1.49.0
  motion: ^13.4.6
  next: ^16.3.8
  # Catalogued so the root's formatter and Architect's cannot drift apart.
  # Architect's E2E helper formats stage snapshots in-process (see
  # `apps/architect/e2e/helpers/normalize-stage.ts`) and depends on producing
  # bytes identical to what the pre-commit hook writes with the root's copy;
  # two versions means the hook can rewrite a generated baseline that the
  # subsequent comparison then rejects.
  oxfmt: ^0.71.0
  # Keep in lock-step with `@playwright/test` above (grouped in dependabot); a
  # mismatch crashes interview-e2e with "two different versions of @playwright/test".
  playwright: ^1.63.0
  postcss: ^8.5.28
  posthog-js: ^1.435.3
  react: ^19.3.0
  react-dom: ^19.3.0
  react-dropzone: ^20.1.2
  # ICU MessageFormat runtime for app UI catalogs; consumed only through
  # @codaco/app-i18n's curated API, never imported directly.
  react-intl: ^12.1.3
  react-redux: ^9.3.0
  redux-logger: ^3.0.6
  sass: ^1.105.1
  storybook: ^10.6.1
  tailwind-merge: ^3.7.0
  tailwindcss: ^4.3.3
  tsx: ^4.23.15
  typescript: ^7.0.2
  uuid: ^14.0.2
  vite: ^8.3.1
  vite-plugin-dts: ^5.1.1
  vitest: ^5.0.3
  wrangler: ^4.144.0
  zod: ^4.6.5
  zustand: ^5.0.15
overrides:
  # Held below 4.13 (pulled in by @storybook/addon-a11y): 4.13.0's colour-contrast
  # stacking-context rewrite intermittently reports a 1.08 contrast on
  # protocol-builder's RuleSetField radio labels (about 1 run in 4), which
  # 4.11 and 4.12 never do. Lift it once that check is understood.
  axe-core: ~4.12.1
  # Keep transitive resolutions (vitest, @vitejs/plugin-react, …) on the
  # catalog version above rather than letting a plugin's looser peer range
  # pull a second, older Vite into the tree.
  vite: 'catalog:'
  # `@storybook/addon-docs` takes React as an ordinary dependency ranged
  # ^16.8 || … || ^19, so a fresh resolution can bind it to the classic apps'
  # React 16 and run the docs blocks' hooks against a second React inside the
  # catalog's 19. Pin it to the catalog React the stories render with.
  '@storybook/addon-docs>react': 'catalog:'
  '@storybook/addon-docs>react-dom': 'catalog:'
  react-resize-aware: 3.1.3
  cheerio: 1.0.0-rc.12
  immer: ^11.1.18
  '@types/node': 'catalog:'
  # A single workspace-wide @types/react instance: without this, the classic
  # apps' @material-ui auto-installed peers pull in a second @types/react@17,
  # and fresco-ui's declaration emit (vite-plugin-dts) can bind inferred types
  # to the wrong instance (TS2883) depending on hoisting (broke Netlify).
  '@types/react': 'catalog:'
  # A single workspace-wide zod instance, for the same reason. Published
  # externals (better-auth, better-call, @codaco/network-exporters, knip) still
  # ask for 4.4.x, which splits drizzle-orm into two peer-resolved copies; the
  # one pnpm hoists for drizzle-kit's own types is then not the one
  # apps/studio/api resolves, and `pushSchema` stops accepting the database
  # handle it is handed (TS2345).
  zod: 'catalog:'
  '@types/react-dom': 'catalog:'
  '@microsoft/api-extractor>typescript': npm:@typescript/typescript6@^6.0.2
  'slate>immer': '^5.3.0'
  'slate-history>immer': '^5.3.0'
  # Keep security-sensitive transitives on patched versions when upstream
  # manifests still pin vulnerable releases (inherited from fresco).
  # @prisma/config pins deepmerge-ts to an exact 7.x release; 8.x fixes the
  # recursive-graph stack exhaustion (GHSA-ggr8-5vv4-36mx) and keeps the
  # variadic deepmerge() API Prisma's config loader calls.
  deepmerge-ts: '^8.0.2'
  # @uploadthing/shared is written against the Effect 3 API. A literal, not
  # `catalog:`, because the catalog is on Effect 4.
  'effect@3.17.7': '^3.22.1'
  # ajv (build and dev tooling only) resolves fast-uri; 3.1.6 closes the
  # URI-normalisation host-confusion / SSRF family (GHSA-5jgf-p345-68v8,
  # GHSA-fph4-wmhf-6fwf, GHSA-jqff-g426-hqxp, GHSA-f65p-4m7j-42xc) and 3.1.8
  # the percent-encoded host-case normalisation (GHSA-hrr3-gc8f-f4qj).
  fast-uri: '^3.1.8'
  # posthog-js pins dompurify to a range that resolves below the node-removing
  # afterSanitize hook fix (GHSA-p98j-92pf-mc4p).
  dompurify: '^3.4.16'
  # minimatch (several majors, via electron-builder, archiver, eslint, api-extractor)
  # resolves brace-expansion below the recursion and quadratic-expansion DoS
  # fixes (GHSA-6j4f-fj2g-mc7p, GHSA-qhr7-859c-m2p7, GHSA-q2hr-2g5m-vwhr). One
  # patched release per major line so the majors do not collapse together.
  'brace-expansion@^1.0.0': '^1.1.21'
  'brace-expansion@^2.0.0': '^2.1.7'
  'brace-expansion@^5.0.0': '^5.0.12'
  # undici advisories (GHSA-rfgv-xxqx-mfg5, GHSA-w293-vg96-wgc3 and others):
  # miniflare pins an exact 7.x, node-gyp and @electron/get ask for 6.x/7.x, and
  # jsdom / @effect/platform-node use 8.x. One patched release per major line.
  'undici@^6.0.0': '^6.28.1'
  'undici@^7.0.0': '^7.29.1'
  'undici@7.24.8': '^7.29.1'
  'undici@^8.0.0': '^8.10.2'
  find-my-way: '^9.7.0'
  'immutable@4.3.8': '4.3.9'
  # electron-builder (app-builder-lib, builder-util, dmg-builder) asks for
  # js-yaml ^4.1.0 but pnpm keeps re-selecting 4.3.0 for those
  # peer-suffixed snapshots; 4.3.2 fixes the merge-key CPU exhaustion
  # (GHSA-2883-xcg3-v3hh).
  'js-yaml@^4.0.0': '^4.3.2'
  # electron-builder (app-builder-lib, @electron/rebuild > node-gyp) resolves
  # tar 7.5.19; 7.5.21 fixes the mapHas/filesFilter recursion DoS
  # (GHSA-r292-9mhp-454m). The tar 6.x copy under @capacitor/assets'
  # @capacitor/cli 5 has no patched 6.x release and stays as is.
  'tar@^7.0.0': '^7.5.21'
  # @capacitor/assets > @trapezedev/project > replace pins minimatch to exactly
  # 3.0.5; 3.1.4 closes the ReDoS family (GHSA-3ppc-4f35-3m26,
  # GHSA-7r86-cg39-jmmj, GHSA-23c5-xmqv-rm74) on the same major.
  'minimatch@3.0.5': '^3.1.5'
  # prisma pins mysql2 to an exact release below the auth-plugin downgrade fix
  # (GHSA-3f6p-5ww8-9rcr); nothing here talks to MySQL, so the driver only
  # needs to resolve to a patched version.
  mysql2: '^3.22.0'
  # Next pins an exact PostCSS version, so keep transitives on the patched
  # catalog version rather than duplicating the version here.
  postcss: 'catalog:'
  sharp: '^0.35.5'
  valibot: '^1.4.2'
autoInstallPeers: true
packageExtensions:
  # `@effect/platform-node` declares `redis` as a hard peer for its
  # NodeClusterSocket module, which Studio never imports. With
  # `autoInstallPeers` a hard peer is installed whether or not
  # `peerDependencyRules.ignoreMissing` names it (that rule only silences the
  # warning), and it would ship a second Redis client beside ioredis into the
  # studio-api image. Making the peer optional is what keeps it out;
  # apps/studio/api's process-separation suite asserts that it stays out.
  '@effect/platform-node':
    peerDependenciesMeta:
      redis:
        optional: true
peerDependencyRules:
  allowedVersions:
    # `vite-plugin-pwa@1.3.0` is the newest release and still declares its
    # optional `@vite-pwa/assets-generator` peer as ^1.0.0, so there is no
    # version of the plugin that admits the generator's 2.0.0 (ESM-only) major.
    # The integration is exercised — both PWA apps set
    # `pwaAssets: { config: true }` — and it works on 2.0.0: architect and
    # interviewer emit every configured icon. Drop this entry once the plugin
    # widens the range.
    'vite-plugin-pwa>@vite-pwa/assets-generator': '2'
linkWorkspacePackages: false
# Supply-chain cooldown: refuse dependency versions younger than this many
# minutes. 1440 = 24h. This is pnpm 11's built-in default, pinned explicitly so
# the policy is visible and consistent across machines and CI rather than
# riding on a framework default that could change between pnpm versions.
minimumReleaseAge: 1440
# Preserve pnpm's default *non-strict* resolution — fall back to an older
# in-range version rather than failing resolution. (Setting minimumReleaseAge
# explicitly would otherwise flip strict mode on by default, which would change
# `pnpm install` behaviour for local dev and the release job's
# `--no-frozen-lockfile` step.) CI's frozen-lockfile verification pass still
# enforces the 24h gate exactly as the implicit default does today.
minimumReleaseAgeStrict: false
minimumReleaseAgeExclude:
  - '@codaco/network-exporters@1.1.3'
  - '@codaco/network-query@1.2.0'
  - '@codaco/protocol-validation@11.9.0'
  - '@codaco/shared-consts@5.5.0'
  - '@next/env@16.3.8'
  - '@next/swc-darwin-arm64@16.3.8'
  - '@next/swc-darwin-x64@16.3.8'
  - '@next/swc-linux-arm64-gnu@16.3.8'
  - '@next/swc-linux-arm64-musl@16.3.8'
  - '@next/swc-linux-x64-gnu@16.3.8'
  - '@next/swc-linux-x64-musl@16.3.8'
  - '@next/swc-win32-arm64-msvc@16.3.8'
  - '@next/swc-win32-x64-msvc@16.3.8'
  - 'next@16.3.8'
  - '@next/bundle-analyzer@16.3.8'
  - '@next/third-parties@16.3.8'
  - 'better-auth@1.7.5'
  - 'electron@43.7.7'
  # Effect 4.0.0, published 2026-10-01 between 01:47Z and 03:11Z — excluded only
  # so the upgrade could install before it ages out at 2026-10-02T03:12Z. Inert
  # after that, and safe to delete in any passing sweep.
  - 'effect@4.0.0'
  - '@effect/platform-node@4.0.0'
  - '@effect/platform-node-shared@4.0.0'
  - '@effect/sql-pg@4.0.0'
  - '@effect/vitest@4.0.0'
patchedDependencies:
  # The addon applies a story's `viewport` parameter by importing `page` from
  # `@vitest/browser/context`, an entry point Vitest 5 no longer serves to a
  # test. The import is wrapped in `.catch(() => ({ page: null }))` and the
  # function then returns early, so under Vitest 5 the viewport is never set
  # and nothing is reported: a story asking for a 700px viewport renders at
  # whatever `browser.viewport` says, and only a story that measures its own
  # layout notices. `vitest/browser` is the same `page` object under the name
  # Vitest 5 serves. 10.6.1 declares Vitest 5 peers but still imports the old
  # entry point; drop this once a release imports `vitest/browser` itself.
  '@storybook/addon-vitest@10.6.1': patches/@storybook__addon-vitest@10.6.1.patch
  drizzle-orm@1.0.0-rc.5-5935859: patches/drizzle-orm@1.0.0-rc.5-5935859.patch

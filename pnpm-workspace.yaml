packages:
  - apps/*
  - packages/*
  - tooling/*
  - workers/*

allowBuilds:
  '@clerk/shared': true
  '@parcel/watcher': true
  '@swc/core': true
  '@tailwindcss/oxide': true
  bufferutil: true
  core-js: true
  core-js-pure: true
  esbuild: true
  sharp: true
  '@prisma/engines': true
  prisma: true
  unrs-resolver: true
  electron: false
  electron-winstaller: false
  phantomjs-prebuilt: false
  protobufjs: false
  workerd: false
  '@posthog/cli': false
  msgpackr-extract: false


  '@capacitor/filesystem': ^8.1.2
  '@capacitor/ios': ^8.4.0
  '@capacitor/share': ^8.0.1
  '@capawesome/capacitor-file-picker': ^8.0.2
  '@chromatic-com/storybook': ^5.2.1
  '@faker-js/faker': ^10.4.0
  '@fontsource-variable/inclusive-sans': ^5.2.8
  '@fontsource-variable/nunito': ^5.2.7
  '@microsoft/api-extractor': ^7.58.12
  '@next/bundle-analyzer': ^16.3.0
  '@next/third-parties': ^16.3.0
  # Keep in lock-step with `playwright` below (grouped in .github/dependabot.yml);
  # the interview-e2e Docker image tag is derived from this resolved version.
  '@playwright/test': ^1.62.1
  '@posthog/react': ^1.10.3
  '@radix-ui/react-dialog': ^1.1.15
  '@radix-ui/react-slot': ^1.2.4
  '@reduxjs/toolkit': ^2.12.0
  '@storybook/addon-a11y': ^10.5.6
  '@storybook/addon-docs': ^10.5.6
  '@storybook/addon-mcp': ^0.7.0
  '@storybook/addon-vitest': ^10.5.6
  '@storybook/nextjs-vite': ^10.5.5
  '@storybook/react-vite': ^10.5.6
  '@tailwindcss/cli': ^4.3.3
  '@tailwindcss/container-queries': ^0.1.1
  '@tailwindcss/postcss': ^4.3.3
  '@tailwindcss/typography': ^0.5.20
  '@tailwindcss/vite': ^4.3.3
  '@tanstack/react-table': ^8.21.3
  '@testing-library/jest-dom': ^7.0.0
  '@testing-library/react': ^16.3.2
  '@total-typescript/ts-reset': ^0.6.1
  '@types/node': ^24.13.3
  '@types/react': ^19.2.18
  '@types/react-dom': ^19.2.4
  # vite-plugin-dts/unplugin-dts needs the TypeScript JavaScript Compiler API,
  # which TS7 does not ship; it looks for this exact fallback package name.
  '@typescript/typescript6': ^6.0.2
  '@vitejs/plugin-react': ^6.0.4
  '@vitest/browser': ^4.1.10
  '@vitest/browser-playwright': ^4.1.10
  '@vitest/coverage-v8': ^4.1.10
  chromatic: ^18.1.0
  class-variance-authority: 0.7.1
  csvtojson: ^2.0.14
  dotenv: ^17.4.2
  effect: ^3.22.0
  electron: ^43.0.0
  electron-builder: ^26.15.2
  electron-vite: ^6.0.0-beta.1
  es-toolkit: ^1.50.0
  fuse.js: ^7.5.0
  jsdom: ^30.0.0
  jszip: ^3.10.1
  lucide-react: ^1.27.0
  motion: ^12.43.0
  next: ^16.3.0
  # Keep in lock-step with `@playwright/test` above (grouped in dependabot); a
  # mismatch crashes interview-e2e with "two different versions of @playwright/test".
  playwright: ^1.62.1
  posthog-js: ^1.409.5
  react: ^19.2.8
  react-dom: ^19.2.8
  react-dropzone: ^15.0.0
  react-redux: ^9.3.0
  redux-form: ^8.3.10
  redux-logger: ^3.0.6
  sass: ^1.102.0
  storybook: ^10.5.6
  tailwind-merge: ^3.6.0
  tailwindcss: ^4.3.3
  tsx: ^4.23.1
  typescript: ^7.0.2
  uuid: ^14.0.0
  # Pinned: rolldown in vite 8.2.0 inlines a member access on a re-exported
  # namespace object (motion's `Reorder.Group`), tree-shakes the namespace away,
  # then never emits the inlined binding — the chunk declares `var ReorderGroup`
  # and never assigns it, so ArrayField renders `undefined` (React #130). Breaks
  # fresco-ui's Storybook build (9 stories) and so Chromatic. No source-level
  # workaround exists; unpin once rolldown ships a fix.
  vite: 8.1.4
  vite-plugin-dts: ^5.0.3
  vitest: ^4.1.10
  wrangler: ^4.95.0
  zod: ^4.4.3
  zustand: ^5.0.14
overrides:
  # Keep transitive resolutions (vitest, @vitejs/plugin-react, …) on the pinned
  # catalog version above rather than letting them float back onto 8.2.0.
  vite: 8.1.4
  react-resize-aware: 3.1.3
  cheerio: 1.0.0-rc.12
  immer: ^11.1.8
  '@types/node': 'catalog:'
  # A single workspace-wide @types/react instance: without this, the classic
  # apps' @material-ui auto-installed peers pull in a second @types/react@17,
  # and fresco-ui's declaration emit (vite-plugin-dts) can bind inferred types
  # to the wrong instance (TS2883) depending on hoisting (broke Netlify).
  '@types/react': 'catalog:'
  '@types/react-dom': 'catalog:'
  '@microsoft/api-extractor>typescript': npm:@typescript/typescript6@^6.0.2
  'slate>immer': '^5.3.0'
  'slate-history>immer': '^5.3.0'
  # Keep security-sensitive transitives on patched versions when upstream
  # manifests still pin vulnerable releases (inherited from fresco).
  'dompurify@3.4.7': '^3.4.12'
  'effect@3.17.7': '3.20.0'
  fast-uri: '^3.1.4'
  find-my-way: '^9.7.0'
  'immutable@4.3.8': '4.3.9'
  postcss: '^8.5.23'
  sharp: '^0.35.3'
  valibot: '^1.4.2'
autoInstallPeers: true
linkWorkspacePackages: false
# Supply-chain cooldown: refuse dependency versions younger than this many
# minutes. 1440 = 24h. This is pnpm 11's built-in default, pinned explicitly so
# the policy is visible and consistent across machines and CI rather than
# riding on a framework default that could change between pnpm versions.
minimumReleaseAge: 1440
# Preserve pnpm's default *non-strict* resolution — fall back to an older
# in-range version rather than failing resolution. (Setting minimumReleaseAge
# explicitly would otherwise flip strict mode on by default, which would change
# `pnpm install` behaviour for local dev and the release job's
# `--no-frozen-lockfile` step.) CI's frozen-lockfile verification pass still
# enforces the 24h gate exactly as the implicit default does today.
minimumReleaseAgeStrict: false
minimumReleaseAgeExclude:
  - '@codaco/network-exporters@1.1.3'
  - '@codaco/network-query@1.2.0'
  - '@codaco/protocol-validation@11.9.0'
  - '@codaco/shared-consts@5.5.0'
